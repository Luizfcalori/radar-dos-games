plugins {
    id 'com.android.application'
}

def stableKeystore = file('signing/tiktok-helper.keystore')

android {
    namespace 'com.luizcalori.radartiktokhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luizcalori.radartiktokhelper'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        stable {
            storeFile stableKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
