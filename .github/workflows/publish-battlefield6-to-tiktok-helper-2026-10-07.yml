name: Publish Battlefield 6 Shorts to TikTok Helper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-battlefield6-to-tiktok-helper-2026-10-07.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved Battlefield 6 Shorts artifact
        uses: actions/download-artifact@v4
        with:
          name: battlefield6-shorts-corrected-37682817247
          path: battlefield6-final
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Luizfcalori/radar-dos-games
          run-id: 37682817247

      - name: Prepare approved Shorts
        run: |
          set -euo pipefail
          mkdir -p helper-assets
          cp battlefield6-final/shorts/short_1.mp4 helper-assets/battlefield6-2026-10-07-short-1.mp4
          cp battlefield6-final/shorts/short_2.mp4 helper-assets/battlefield6-2026-10-07-short-2.mp4
          cp battlefield6-final/shorts/short_3.mp4 helper-assets/battlefield6-2026-10-07-short-3.mp4
          cp battlefield6-final/shorts/short_1_cover.jpg helper-assets/battlefield6-2026-10-07-short-1.jpg
          cp battlefield6-final/shorts/short_2_cover.jpg helper-assets/battlefield6-2026-10-07-short-2.jpg
          cp battlefield6-final/shorts/short_3_cover.jpg helper-assets/battlefield6-2026-10-07-short-3.jpg
          for f in helper-assets/*; do test -s "$f"; done

      - name: Publish files to TikTok Helper release
        run: |
          set -euo pipefail
          TAG=tiktok-approved-assets
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Radar dos Games - Shorts aprovados para TikTok" --notes "Arquivos aprovados usados pelo Radar TikTok Helper."
          gh release upload "$TAG" helper-assets/* --clobber

      - name: Refresh latest queue and promote Battlefield 6 Shorts
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('data/tiktok_queue.json')
          q=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'version':2,'items':[]}
          now=datetime.now(timezone.utc).isoformat()
          base='https://github.com/Luizfcalori/radar-dos-games/releases/download/tiktok-approved-assets'

          configs=[
            {
              'id':'battlefield6-gamepass-approved-37682817247-short-1',
              'title':'BATTLEFIELD 6 CHEGA AO GAME PASS!',
              'short_number':1,
              'mp4':'battlefield6-2026-10-07-short-1.mp4',
              'jpg':'battlefield6-2026-10-07-short-1.jpg',
              'post_text':'BATTLEFIELD 6 CHEGA AO GAME PASS! 🔥\n\nO jogo entra no catálogo e ganha uma nova porta de entrada para milhões de jogadores.\n\n#Battlefield6 #GamePass #Xbox #EA #RadarDosGames #Games #Gaming #TikTokGames'
            },
            {
              'id':'battlefield6-gamepass-approved-37682817247-short-2',
              'title':'GAME PASS ULTIMATE: O QUE VOCÊ GANHA NO BATTLEFIELD 6',
              'short_number':2,
              'mp4':'battlefield6-2026-10-07-short-2.mp4',
              'jpg':'battlefield6-2026-10-07-short-2.jpg',
              'post_text':'GAME PASS ULTIMATE: O QUE VOCÊ GANHA NO BATTLEFIELD 6 🎮\n\nVeja os benefícios e o que muda para quem entra no jogo pelo Game Pass Ultimate.\n\n#Battlefield6 #GamePassUltimate #XboxGamePass #EAPlay #RadarDosGames #Gaming #TikTokGames'
            },
            {
              'id':'battlefield6-gamepass-approved-37682817247-short-3',
              'title':'BATTLEFIELD 6: TEMPORADA 5 VAI PARA VEGAS',
              'short_number':3,
              'mp4':'battlefield6-2026-10-07-short-3.mp4',
              'jpg':'battlefield6-2026-10-07-short-3.jpg',
              'post_text':'BATTLEFIELD 6: TEMPORADA 5 VAI PARA VEGAS! 💥\n\nA nova fase leva Battlefield 6 para Las Vegas com novos mapas e conteúdo do Ano 2.\n\n#Battlefield6 #Season5 #LasVegas #EA #RadarDosGames #Games #Gaming #TikTokGames'
            },
          ]

          items=q.get('items') or []
          ids={c['id'] for c in configs}
          promoted=[]
          for cfg in configs:
              promoted.append({
                'id':cfg['id'],
                'title':cfg['title'],
                'media_url':f"{base}/{cfg['mp4']}",
                'thumbnail_url':f"{base}/{cfg['jpg']}",
                'post_text':cfg['post_text'],
                'status':'approved',
                'source_run_id':37682817247,
                'short_number':cfg['short_number'],
                'approved_at':now,
                'source':'approved_production_artifact',
                'synced_at':now,
              })

          rest=[x for x in items if str(x.get('id')) not in ids]
          q['version']=2
          q['source_channel']='https://www.youtube.com/@Radardosgamesbr/shorts'
          q['updated_at']=now
          q['items']=promoted+rest
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print(json.dumps({
            'updated_at':now,
            'added':len(promoted),
            'queue_total':len(q['items']),
            'items':[{'id':x['id'],'title':x['title'],'status':x['status'],'media_url':x['media_url']} for x in promoted]
          },ensure_ascii=False,indent=2))
          PY

      - name: Verify public MP4s
        run: |
          set -euo pipefail
          base="https://github.com/Luizfcalori/radar-dos-games/releases/download/tiktok-approved-assets"
          for f in battlefield6-2026-10-07-short-1.mp4 battlefield6-2026-10-07-short-2.mp4 battlefield6-2026-10-07-short-3.mp4; do
            curl -L --fail --retry 3 --range 0-1023 "$base/$f" -o /dev/null
            echo "PUBLIC_OK $f"
          done

      - name: Commit refreshed TikTok Helper queue
        run: |
          set -euo pipefail
          git config user.name radar-tiktok-bot
          git config user.email actions@users.noreply.github.com
          git add data/tiktok_queue.json
          if git diff --cached --quiet; then
            echo "Queue already contains approved Battlefield 6 Shorts."
            exit 0
          fi
          git commit -m "feat: add approved Battlefield 6 Shorts to TikTok Helper"
          git pull --rebase origin main
          git push origin main
