name: Build Radar TikTok Helper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tiktok-mobile-app/**'
      - '.github/workflows/build-tiktok-helper.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: radar-tiktok-helper-debug-keystore-v1

      - name: Create stable signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Radar dos Games,C=BR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Prepare app signing
        shell: bash
        run: |
          mkdir -p tiktok-mobile-app/app/signing
          cp ~/.android/debug.keystore tiktok-mobile-app/app/signing/tiktok-helper.keystore

      - name: Build APK
        working-directory: tiktok-mobile-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p releases
          cp tiktok-mobile-app/app/build/outputs/apk/debug/app-debug.apk \
            releases/radar-games-tiktok-helper-v1.apk
          SHA256=$(sha256sum releases/radar-games-tiktok-helper-v1.apk | awk '{print $1}')
          cat > releases/latest-tiktok.json <<EOF
          {
            "app": "Radar TikTok Helper",
            "version": "1.0.0",
            "version_code": 1,
            "apk": "radar-games-tiktok-helper-v1.apk",
            "sha256": "$SHA256",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-games-tiktok-helper-v1
          path: releases/radar-games-tiktok-helper-v1.apk
          retention-days: 30

      - name: Publish APK as easy-download release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tiktok-helper-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Radar dos Games — TikTok Helper" \
              --notes "APK de teste do Radar dos Games para sincronizar Shorts aprovados, copiar a legenda e abrir o TikTok para publicação manual."
          fi
          gh release upload "$TAG" releases/radar-games-tiktok-helper-v1.apk --clobber

      - name: Publish APK in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/radar-games-tiktok-helper-v1.apk releases/latest-tiktok.json
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Build Radar TikTok Helper v1"
          git push
