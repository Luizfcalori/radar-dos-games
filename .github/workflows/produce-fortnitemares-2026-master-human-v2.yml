name: Radar dos Games - FORTNITEMARES MASTER HUMAN V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-fortnitemares-2026-master-human-v2.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce-master:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Limpeza total V2
        run: |
          rm -rf output
          mkdir -p output

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp gdown pillow

      - name: Validar intro oficial
        run: |
          test -s radar-dos-games-intro-oficial.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 radar-dos-games-intro-oficial.mp4

      - name: Criar roteiro humano do zero
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          article="https://www.fortnite.com/news/the-corruption-spreads-in-fortnitemares-2026"
          article_pt="https://www.fortnite.com/news/the-corruption-spreads-in-fortnitemares-2026?lang=pt-BR"
          trailer="https://www.youtube.com/watch?v=7qQFLL_DJ7Q"

          weapon_img="https://cms-assets.unrealengine.com/cm6l5gfpm05kr07my04cqgy2x/resize=fit:clip,width:1920/quality=value:80/cmuo6uhl37cav07obrctm0nn6"
          fnaf_stage_img="https://cms-assets.unrealengine.com/cm6l5gfpm05kr07my04cqgy2x/resize=fit:clip,width:1920/quality=value:80/cmumsn6g007wm06n4pnkts1et"
          fnaf_group_img="https://cms-assets.unrealengine.com/cm6l5gfpm05kr07my04cqgy2x/resize=fit:clip,width:1920/quality=value:80/cmulmm5nc3jgl07o1ozjap94e"
          horde_img="https://cdn2.unrealengine.com/links-admin-EN_FNBR_42-30_Fortnitemares_HordeRush_DiscoverTile_480x270-2689b75f.jpg"

          paragraphs=[
              "Fortnitemares 2026 chegou com tudo ao Fortnite. A Epic juntou Freddy Krueger, Five Nights at Freddy's, armas de Halloween e a volta da Horda Impetuosa em uma atualização cheia de terror, chefes e combate diferente. É o tipo de evento que muda o clima das partidas e dá vários motivos para voltar ao jogo durante outubro.",
              "Five Nights at Freddy's é uma das grandes estrelas desta edição. Freddy Fazbear, Bonnie, Chica e Foxy fazem parte da colaboração e levam o visual clássico dos animatrônicos para o Fortnite. Para quem já acompanha FNAF, é uma mistura que combina muito bem com a temporada de Halloween.",
              "Freddy Krueger também ganhou um papel importante no evento. No Bairro Bruxesco, ele aparece como uma ameaça que pode ser enfrentada durante a partida. Ao derrotá-lo, entra em cena uma das recompensas mais interessantes da atualização: as Garras do Pesadelo de Freddy, feitas para encurtar a distância e partir para o ataque corpo a corpo.",
              "E os animatrônicos de Five Nights at Freddy's não ficaram só nos trajes. Eles também aparecem como chefes durante as partidas. Depois de vencer um deles, é possível assumir a forma do animatrônico e usar essa transformação para continuar a luta, deixando a colaboração bem mais presente na jogabilidade.",
              "Entre as novidades de combate, a SMG Quebra-ossos é uma das armas que mais chama atenção. Ela consegue revelar inimigos e se junta às Garras do Pesadelo como parte do arsenal temático de Fortnitemares. É uma combinação que favorece partidas mais agressivas, com perseguição e combate em curta distância.",
              "A Horda Impetuosa também está de volta. O modo coloca o grupo contra ondas de inimigos e transforma a partida em uma sequência de pressão constante. Para quem gosta do lado mais cooperativo e caótico do Fortnite, é uma das partes mais divertidas do pacote de Halloween.",
              "Fortnitemares 2026 apostou pesado em terror e nostalgia: Freddy Krueger, Five Nights at Freddy's, armas temáticas e Horda Impetuosa no mesmo evento. Entre todas essas novidades, qual delas vocês vão testar primeiro? Contem nos comentários e acompanhem o Radar dos Games para mais novidades de Fortnite."
          ]
          script="\n\n".join(paragraphs)+"\n"
          Path("output/auto-script.txt").write_text(script,encoding="utf-8")

          media=[
              {"type":"video","url":trailer,"role":"fortnitemares_trailer","max_assets":1,"min_duration":20,
               "source_proof":article,"relevance_evidence":"official_fortnite_article_embedded_trailer",
               "source_label":"Fortnitemares 2026 official trailer"},
              {"type":"image","url":fnaf_group_img,"role":"fnaf_group","max_assets":1,"force_image":True,
               "source_proof":article,"relevance_evidence":"official_epic_article_exact_fnaf_group",
               "source_label":"Five Nights at Freddy's group"},
              {"type":"image","url":weapon_img,"role":"freddy_weapon","max_assets":1,"force_image":True,
               "source_proof":article,"relevance_evidence":"official_epic_article_exact_freddy_claws_bonerattler",
               "source_label":"Freddy's Nightmare claws and Bonerattler SMG"},
              {"type":"image","url":fnaf_stage_img,"role":"fnaf_stage","max_assets":1,"force_image":True,
               "source_proof":article,"relevance_evidence":"official_epic_article_exact_fnaf_animatronics",
               "source_label":"FNAF animatronics"},
              {"type":"image","url":horde_img,"role":"horde_rush","max_assets":1,
               "source_proof":"https://www.fortnite.com/@epic","relevance_evidence":"official_epic_horde_rush_discover_tile",
               "source_label":"Horde Rush"}
          ]

          titles=[
              "FORTNITEMARES 2026 CHEGOU",
              "FNAF ENTROU NO FORTNITE",
              "FREDDY KRUEGER NO MAPA",
              "ANIMATRÔNICOS VIRARAM CHEFES",
              "SMG QUEBRA-OSSOS",
              "HORDA IMPETUOSA VOLTOU",
              "UM HALLOWEEN PESADO NO FORTNITE"
          ]
          subtitles=[
              "FREDDY • FNAF • ARMAS • HORDA",
              "FREDDY • BONNIE • CHICA • FOXY",
              "GARRAS DO PESADELO",
              "DERROTE E ASSUMA A FORMA",
              "REVELE INIMIGOS",
              "ONDAS DE INIMIGOS",
              "QUAL NOVIDADE VOCÊS VÃO TESTAR?"
          ]
          subjects=[
              "fortnitemares_overall","fnaf_outfits","freddy_claws",
              "fnaf_bosses","bonerattler","horde_rush","summary"
          ]
          allowed=[
              ["fortnitemares_trailer"],["fnaf_group"],["freddy_weapon"],
              ["fnaf_stage"],["freddy_weapon"],["horde_rush"],
              ["fnaf_group","freddy_weapon","fnaf_stage","horde_rush"]
          ]
          scenes=[]
          for i in range(7):
              scenes.append({
                  "paragraph":i+1,
                  "title":titles[i],
                  "subtitle":subtitles[i],
                  "semantic_subject":subjects[i],
                  "allowed_role_prefixes":allowed[i],
                  "media_indices":[]
              })

          plan={
              "topic":"FORTNITEMARES 2026 MASTER HUMAN V2",
              "source":article,
              "sources":[article_pt,"https://www.fortnite.com/@epic"],
              "minimum_assets":5,
              "minimum_video_assets":1,
              "minimum_unique_video_seconds":20,
              "minimum_image_assets":4,
              "media_policy":"STRICT exact subject visual; narration is audience-first; never explain editing or screen synchronization",
              "media":media,
              "scenes":scenes
          }
          Path("output/auto-media-plan.json").write_text(json.dumps(plan,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("output/selected.json").write_text(json.dumps({
              "title":"FORTNITEMARES 2026: FREDDY, FNAF E AS NOVIDADES DO EVENTO",
              "version":"MASTER_HUMAN_V2",
              "source":article,
              "rebuild_from_zero":True
          },ensure_ascii=False,indent=2),encoding="utf-8")
          Path("output/master-youtube.json").write_text(json.dumps({
              "title":"FORTNITEMARES 2026: FREDDY, FNAF E AS NOVIDADES DO EVENTO",
              "description":"🎃 Fortnitemares 2026 chegou ao Fortnite com Freddy Krueger, Five Nights at Freddy's, novas armas e a volta da Horda Impetuosa.\n\n🔎 Fonte oficial: https://www.fortnite.com/news/the-corruption-spreads-in-fortnitemares-2026\n\n#RadarDosGames #Fortnite #Fortnitemares2026 #FNAF #FreddyKrueger",
              "tags":["Radar dos Games","Fortnite","Fortnitemares 2026","Five Nights at Freddy's","FNAF","Freddy Krueger","Horde Rush"],
              "privacy":"unlisted",
              "containsSyntheticMedia":False
          },ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: QA editorial da narração
        run: python src/narration_qa.py output/auto-script.txt

      - name: Criar narração Thalita Multilingual PT-BR
        run: |
          python src/voice.py output/auto-script.txt output/voice.mp3 \
            --voice pt-BR-ThalitaMultilingualNeural \
            --segments-json output/voice-timings.json

      - name: Baixar mídias oficiais
        run: python src/media.py output/auto-media-plan.json

      - name: Criar movimento nas artes oficiais
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("output/clips.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assets=data["assets"]
          next_idx=max(a["index"] for a in assets)+1
          new=[]
          exact={"fnaf_group","freddy_weapon","fnaf_stage","horde_rush"}
          for a in list(assets):
              if a.get("type")!="image" or a.get("role") not in exact:
                  continue
              src=Path(a["path"])
              dst=Path("output/media")/f"motion_{next_idx:02d}.mp4"
              vf=("scale=1920:1080:force_original_aspect_ratio=decrease,"
                  "pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black,"
                  "zoompan=z='min(zoom+0.00065,1.055)':d=420:s=1920x1080:fps=30,format=yuv420p")
              subprocess.run([
                  "ffmpeg","-y","-v","error","-loop","1","-i",str(src),"-t","14",
                  "-vf",vf,"-an","-r","30","-c:v","libx264","-preset","veryfast","-crf","19",
                  "-pix_fmt","yuv420p",str(dst)
              ],check=True)
              rec=dict(a)
              rec.update({
                  "index":next_idx,"path":str(dst),"type":"video",
                  "role":a["role"]+"_motion","duration":14.0,"width":1920,"height":1080,
                  "relevance_evidence":a.get("relevance_evidence","")+"_motion_from_exact_official_image"
              })
              new.append(rec); next_idx+=1
          assets.extend(new)
          data["assets"]=assets
          data["clips"]=[a["path"] for a in assets]
          data["video_assets"]=sum(1 for a in assets if a["type"]=="video")
          data["image_assets"]=sum(1 for a in assets if a["type"]=="image")
          data["unique_video_seconds"]=round(sum(float(a.get("duration",0)) for a in assets if a["type"]=="video"),3)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          print("HUMAN_V2_MOTION",[(a["index"],a["role"]) for a in new])
          PY

      - name: Validar cobertura exata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          clips=json.loads(Path("output/clips.json").read_text(encoding="utf-8"))
          roles={a.get("role") for a in clips["assets"] if a.get("approved")}
          required=["fortnitemares_trailer","fnaf_group_motion","freddy_weapon_motion","fnaf_stage_motion","horde_rush_motion"]
          missing=[x for x in required if x not in roles]
          assert not missing, f"QUALITY_BLOCK: faltam mídias: {missing}"
          Path("output/topic-coverage-qa.json").write_text(json.dumps({
              "status":"APPROVED","required_roles":required,"available_roles":sorted(roles)
          },ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Montar manifesto semântico
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path("output/auto-media-plan.json").read_text(encoding="utf-8"))
          clips=json.loads(Path("output/clips.json").read_text(encoding="utf-8"))
          assets=[a for a in clips["assets"] if a.get("approved")]
          by={}
          for a in assets: by.setdefault(a["role"],[]).append(int(a["index"]))
          mapping={
              "fortnitemares_overall":by["fortnitemares_trailer"],
              "fnaf_outfits":by["fnaf_group_motion"],
              "freddy_claws":by["freddy_weapon_motion"],
              "fnaf_bosses":by["fnaf_stage_motion"],
              "bonerattler":by["freddy_weapon_motion"],
              "horde_rush":by["horde_rush_motion"],
              "summary":by["fnaf_group_motion"]+by["freddy_weapon_motion"]+by["fnaf_stage_motion"]+by["horde_rush_motion"]
          }
          for scene in spec["scenes"]:
              scene["media_indices"]=list(dict.fromkeys(mapping[scene["semantic_subject"]]))
          Path("output/auto-media-plan.json").write_text(json.dumps(spec,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("output/render.json").write_text(json.dumps({
              "assets":assets,
              "voice":"output/voice.mp3",
              "voice_timings":"output/voice-timings.json",
              "intro":"radar-dos-games-intro-oficial.mp4",
              "scenes":spec["scenes"],
              "output":"output/master.mp4"
          },ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Gate semântico
        run: python src/semantic_gate.py output/auto-media-plan.json output/clips.json output/semantic-visual-qa.json

      - name: Renderizar novo Master V2
        run: python src/render.py output/render.json

      - name: QA final Master humano V2
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def probe(path):
              return json.loads(subprocess.check_output(
                  ["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(path)],
                  text=True
              ))

          master=Path("output/master.mp4")
          assert master.exists() and master.stat().st_size>3_000_000
          info=probe(master)
          dur=float(info["format"]["duration"])
          v=next(s for s in info["streams"] if s["codec_type"]=="video")
          assert (int(v["width"]),int(v["height"]))==(1920,1080)
          assert any(s["codec_type"]=="audio" for s in info["streams"])
          assert 90<=dur<=300

          narr=json.loads(Path("output/narration-qa.json").read_text(encoding="utf-8"))
          assert narr.get("status")=="APPROVED",narr

          qa=json.loads(Path("output/qa.json").read_text(encoding="utf-8"))
          assert qa.get("voice")=="pt-BR-ThalitaMultilingualNeural"
          assert len(qa.get("scenes",[]))==7
          assert all(s.get("all_assets_explicit") for s in qa["scenes"])

          sem=json.loads(Path("output/semantic-visual-qa.json").read_text(encoding="utf-8"))
          assert sem.get("status")=="APPROVED"
          coverage=json.loads(Path("output/topic-coverage-qa.json").read_text(encoding="utf-8"))
          assert coverage.get("status")=="APPROVED"

          final={
              "status":"APPROVED_MASTER_HUMAN_V2",
              "topic":"FORTNITEMARES 2026",
              "master_seconds":round(dur,2),
              "master_resolution":"1920x1080",
              "voice":"pt-BR-ThalitaMultilingualNeural",
              "narration_style":"AUDIENCE_FIRST_NATURAL",
              "meta_narration":"BLOCKED_BY_QA",
              "semantic_visual_sync":"APPROVED",
              "exact_topic_media_coverage":"APPROVED",
              "rebuild_from_zero":True
          }
          Path("output/final-qa.json").write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(final,ensure_ascii=False,indent=2))
          PY

      - name: Guardar novo Master para validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-fortnitemares-master-human-v2
          path: |
            output/master.mp4
            output/auto-script.txt
            output/narration-qa.json
            output/voice.mp3
            output/voice-timings.json
            output/auto-media-plan.json
            output/clips.json
            output/render.json
            output/topic-coverage-qa.json
            output/semantic-visual-qa.json
            output/qa.json
            output/final-qa.json
            output/master-youtube.json
          retention-days: 7
