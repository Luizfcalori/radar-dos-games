name: Radar dos Games - Top 10 Games de Hoje v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-top10-v4-2026-10-04.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar intro oficial
        run: test -s radar-dos-games-intro-oficial.mp4

      - name: Montar pauta Top 10
        run: python src/top10_2026_10_04.py

      - name: Fixar fontes diretas validadas e robustez do coletor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('output/auto-media-plan.json')
          plan=json.loads(p.read_text(encoding='utf-8'))

          # Primeiro Top 10: usa imagens oficiais por assunto; vídeo fica para a evolução automática posterior.
          plan['media']=[m for m in plan['media'] if m.get('type')=='image']

          direct_roles={
            'kingdom_hearts_switch2': [
              'https://imguscdn.gamespress.com/cdn/files/Square-Enix/2026/06/090453-397a8af7/KHC_keyart_16x9_no_logo.png?w=600&mode=max&otf=y&quality=90&format=png&bgcolor=transparent&sky=571da1df12e6ae8ce287499185ca1c6f1f32c893ee985a7bef62dcdd965f1825'
            ],
            'ace_combat_8': [
              'https://us-east-1-bandai.graphassets.com/AXzioIclSWilEjFtsMJPwz/cmrwlrzb96u3u06lqcvr1hpxg',
              'https://us-east-1-bandai.graphassets.com/AXzioIclSWilEjFtsMJPwz/cmtqest6c15pf08lmvw006lre'
            ],
            'qssr_ps5': [
              'https://blog.playstation.com/tachyon/2026/10/5f2b04388e41b48507f4c8d57ce8f53bd059f03a.jpg'
            ],
            'gears_eday': [
              'https://xboxwire.thesourcemediaassets.com/sites/2/2026/10/GoW_EDAY_Adagio_4K_Final_09-0f31e58cf65dec22523a.jpg'
            ]
          }
          blocked=['avatar','author','profile','headshot','newsletter','podcast','logo','icon','header','footer']
          plan['media']=[m for m in plan['media'] if m.get('role') not in direct_roles]
          source_proof={
            'kingdom_hearts_switch2':'https://press.na.square-enix.com/SQUARE-ENIX-UNVEILS-NEW-KINGDOM-HEARTS-ANNOUNCEMENTS-DURING-NINTENDO-D',
            'ace_combat_8':'https://www.bandainamcoent.com/news/ace-combat-8-wings-of-theve-takes-flight-today',
            'qssr_ps5':'https://blog.playstation.com/2026/10/01/ai-upscaling-is-coming-to-ps5/',
            'gears_eday':'https://news.xbox.com/en-us/2026/10/01/gears-of-war-e-day-early-access-launch-trailer-xbox/'
          }
          for role,urls in direct_roles.items():
            for u in urls:
              plan['media'].append({
                'type':'image','url':u,'role':role,'max_assets':1,
                'source_proof':source_proof[role],
                'relevance_evidence':'direct_official_asset_validated',
                'blocked_tokens':blocked
              })

          plan['minimum_assets']=10
          plan['minimum_video_assets']=0
          plan['minimum_unique_video_seconds']=0
          plan['minimum_image_assets']=10
          p.write_text(json.dumps(plan,ensure_ascii=False,indent=2),encoding='utf-8')

          # Torna o coletor tolerante a HTML com pseudo-URLs inválidas e CDNs sem extensão.
          mp=Path('src/media.py')
          text=mp.read_text(encoding='utf-8')
          old="""    for raw in raws:\n        u=urllib.parse.urljoin(page,raw.strip());low=u.lower();clean=low.split('?')[0]\n        is_video=clean.endswith(VIDEO_EXTS+STREAM_EXTS) or 'drive.google.com/file/d/' in low or 'youtube.com/watch' in low or 'youtu.be/' in low\n"""
          new="""    for raw in raws:\n        try:\n            u=urllib.parse.urljoin(page,raw.strip())\n        except (ValueError, UnicodeError) as e:\n            print('invalid discovered url skipped', page, repr(raw[:160]), e)\n            continue\n        low=u.lower();clean=low.split('?')[0]\n        is_video=clean.endswith(VIDEO_EXTS+STREAM_EXTS) or 'drive.google.com/file/d/' in low or 'youtube.com/watch' in low or 'youtu.be/' in low\n"""
          if old in text:
            text=text.replace(old,new,1)

          old2="""def blocked_candidate(url,item):\n    low=url.lower();blocked=list(LOW_VALUE_TOKENS)+[str(x).lower() for x in item.get('blocked_tokens',[])]\n"""
          new2="""def blocked_candidate(url,item):\n    low=url.lower().replace('no_logo','keyart')\n    blocked=list(LOW_VALUE_TOKENS)+[str(x).lower() for x in item.get('blocked_tokens',[])]\n"""
          if old2 in text:
            text=text.replace(old2,new2,1)

          old3="""            if low.endswith(VIDEO_EXTS+STREAM_EXTS+IMAGE_EXTS) or 'drive.google.com/file/d/' in url.lower() or 'youtube.com' in url or 'youtu.be' in url:\n"""
          new3="""            if low.endswith(VIDEO_EXTS+STREAM_EXTS+IMAGE_EXTS) or ('bandai.graphassets.com' in low and wanted=='image') or 'drive.google.com/file/d/' in url.lower() or 'youtube.com' in url or 'youtu.be' in url:\n"""
          if old3 in text:
            text=text.replace(old3,new3,1)

          old4="""            low=u.lower();clean=low.split('?')[0];isimg=clean.endswith(IMAGE_EXTS);isstream=clean.endswith(STREAM_EXTS);isdrive='drive.google.com/file/d/' in low\n"""
          new4="""            low=u.lower();clean=low.split('?')[0];isimg=clean.endswith(IMAGE_EXTS) or ('bandai.graphassets.com' in low and wanted=='image');isstream=clean.endswith(STREAM_EXTS);isdrive='drive.google.com/file/d/' in low\n"""
          if old4 in text:
            text=text.replace(old4,new4,1)

          mp.write_text(text,encoding='utf-8')
          PY

      - name: Criar narração Thalita PT-BR
        run: |
          python src/voice.py output/auto-script.txt output/voice.mp3 \
            --voice pt-BR-ThalitaNeural \
            --segments-json output/voice-timings.json

      - name: Baixar imagens oficiais por pauta
        run: python src/media.py output/auto-media-plan.json

      - name: Montar manifesto com mídia casada por assunto
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          spec=json.loads(Path('output/auto-media-plan.json').read_text(encoding='utf-8'))
          media=json.loads(Path('output/clips.json').read_text(encoding='utf-8'))
          assets=media['assets']; by_role=defaultdict(list)
          for a in assets: by_role[a.get('role','')].append(int(a['index']))
          missing=[]
          for scene in spec['scenes']:
              ids=by_role.get(scene['role'],[])
              if not ids: missing.append(scene['role'])
              scene['media_indices']=ids[:2]
          if missing: raise RuntimeError('QUALITY_BLOCK: pautas sem mídia contextual: '+', '.join(missing))
          Path('output/render.json').write_text(json.dumps({'assets':assets,'voice':'output/voice.mp3','voice_timings':'output/voice-timings.json','intro':'radar-dos-games-intro-oficial.mp4','scenes':spec['scenes'],'output':'output/master.mp4'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Renderizar Master Top 10
        run: python src/render.py output/render.json

      - name: Criar capa Top 10
        run: python src/thumbnail.py output/master.mp4 'TOP 10 GAMES DE HOJE!' output/thumbnail.jpg

      - name: Gerar 3 Shorts derivados
        run: python src/shorts.py output/master.mp4

      - name: Quality gate Master + Shorts
        run: |
          python - <<'PY'
          import glob,json,subprocess
          from pathlib import Path
          def probe(p): return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          master=Path('output/master.mp4'); assert master.exists() and master.stat().st_size>5_000_000
          m=probe(master); md=float(m['format']['duration']); mv=next(x for x in m['streams'] if x['codec_type']=='video')
          assert 300<=md<=900,md; assert (int(mv['width']),int(mv['height']))==(1920,1080); assert any(x['codec_type']=='audio' for x in m['streams'])
          qa=json.loads(Path('output/qa.json').read_text(encoding='utf-8'))
          assert qa['voice']=='pt-BR-ThalitaNeural'; assert qa['card_style']['shadow_attached_to_text'] is True; assert len(qa['scenes'])==10; assert all(s['all_assets_explicit'] for s in qa['scenes'])
          shorts=sorted(glob.glob('output/shorts/short_*.mp4')); assert len(shorts)==3
          report=[]
          for p in shorts:
              q=probe(p); d=float(q['format']['duration']); v=next(x for x in q['streams'] if x['codec_type']=='video')
              assert (int(v['width']),int(v['height']))==(1080,1920); assert 10<=d<=65; assert any(x['codec_type']=='audio' for x in q['streams']); report.append({'file':p,'seconds':round(d,2)})
          Path('output/final-qa.json').write_text(json.dumps({'master_seconds':round(md,2),'master':'1920x1080@30','scenes':10,'shorts':report,'status':'APPROVED'},indent=2),encoding='utf-8')
          print(Path('output/final-qa.json').read_text())
          PY

      - name: Guardar pacote final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-top10-v4-${{ github.run_id }}
          path: |
            output/selected.json
            output/auto-script.txt
            output/auto-media-plan.json
            output/clips.json
            output/voice.mp3
            output/voice-timings.json
            output/master.mp4
            output/thumbnail.jpg
            output/qa.json
            output/final-qa.json
            output/shorts/*.mp4
            output/*youtube*.json
          retention-days: 7
