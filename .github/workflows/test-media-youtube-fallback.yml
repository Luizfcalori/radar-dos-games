name: Test media.py YouTube Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-media-youtube-fallback.yml"
      - "src/media.py"

permissions:
  contents: read

jobs:
  test-media-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -U 'yt-dlp[default]'
      - name: Build isolated media plan
        run: |
          cat > /tmp/media-plan.json <<'JSON'
          {
            "minimum_assets": 1,
            "minimum_video_assets": 1,
            "minimum_unique_video_seconds": 15,
            "minimum_image_assets": 0,
            "media": [
              {
                "type": "video",
                "role": "animal_hospital_halloween_gameplay_test",
                "url": "https://rutube.ru/video/2ac36578f8896cce9c40815ce9bf538e/",
                "fallback_urls": [
                  "https://rutube.ru/video/b4321c0d654662c55a61305c1b3722db/",
                  "https://rutube.ru/video/a9f301146140c0dba3429e41118bcbdb/",
                  "https://rutube.ru/video/080f24a0de6551c46e4f72f6faa669f1/",
                  "https://rutube.ru/video/12d08fe54428a40629d66056ef49d2cc/",
                  "https://rutube.ru/video/5a8ea6f04ed50f05ea82f10cc1e3c582/",
                  "https://rutube.ru/video/c1ea19049f9b5fa5373d6fd1298fe137/",
                  "https://www.dailymotion.com/video/xb6iwqi",
                  "https://www.bilibili.tv/video/4800979151887360",
                  "https://www.youtube.com/watch?v=oOCYoEQMoSU",
                  "https://www.youtube.com/watch?v=WejETWjm0oU",
                  "https://zolotube.com/watch?v=wEVQKPF0tg4",
                  "https://youtu.be/0EhXDqzsIU4",
                  "https://youtu.be/wEVQKPF0tg4"
                ],
                "source_proof": "Animal Hospital Roblox Halloween gameplay",
                "relevance_evidence": "game-specific gameplay source from the production brief",
                "source_label": "Animal Hospital — Halloween event gameplay",
                "min_duration": 15,
                "max_assets": 1
              }
            ]
          }
          JSON
          rm -rf output/media output/clips.json
          mkdir -p output/media
      - name: Run production media.py
        shell: bash
        run: |
          set -o pipefail
          python src/media.py /tmp/media-plan.json | tee /tmp/media-run.log
      - name: Verify resulting MP4
        run: |
          test -s output/clips.json
          python - <<'PY'
          import json, pathlib, subprocess
          m=json.load(open('output/clips.json'))
          assert m['publishable_media'] is True, m
          assert m['video_assets'] >= 1, m
          a=next((x for x in m['assets'] if x.get('type')=='video'),None)
          assert a, m
          p=pathlib.Path(a['path'])
          assert p.is_file() and p.stat().st_size>100000, a
          probe=subprocess.run(['ffprobe','-v','error','-show_entries','stream=codec_name,width,height','-show_entries','format=duration','-of','json',str(p)],capture_output=True,text=True,check=True)
          open('/tmp/ffprobe.json','w').write(probe.stdout)
          info=json.loads(probe.stdout)
          assert int(info['streams'][0]['width']) >= 640 and int(info['streams'][0]['height']) >= 360, {'asset':a,'probe':info}
          assert float(info['format']['duration']) >= 15, {'asset':a,'probe':info}
          assert any(host in a['url'] for host in ('rutube.ru','zolotube.com','youtu.be','youtube.com','dailymotion.com','bilibili.tv')), a
          print('INTEGRATION_SUCCESS',a)
          PY
      - name: Upload validated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-animal-hospital-gameplay-fallback
          path: |
            /tmp/media-run.log
            /tmp/ffprobe.json
            output/clips.json
            output/media/*.mp4
          if-no-files-found: warn
          retention-days: 3

# Validation includes alternate public video platforms after source access failures.
