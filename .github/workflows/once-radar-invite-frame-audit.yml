name: Inspect Radar promotional Short framing - one-off
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/once-radar-invite-frame-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frame-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Fetch current promo and inspect 00:12-00:22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release download radar-channel-invite-oneoff-2026-10-09 -R Luizfcalori/radar-dos-games -p Radar_dos_Games_Convite_Exclusivo.mp4 -D .
          for s in 12.5 15.5 18.5 21.5; do
            ffmpeg -y -v error -ss "$s" -i Radar_dos_Games_Convite_Exclusivo.mp4 -frames:v 1 -vf scale=270:480 -q:v 13 "review-$s.jpg"
            echo "FRAME_START:$s"
            base64 -w0 "review-$s.jpg"
            echo
            echo "FRAME_END:$s"
          done
          for src in gta6-leak-2026-10-08-short-2.mp4 battlefield6-2026-10-07-short-1.mp4 fortnitemares-2026-jwXtn0b0rYA.mp4; do
            gh release download tiktok-approved-assets -R Luizfcalori/radar-dos-games -p "$src" -D .
            ffmpeg -y -v error -ss 3 -i "$src" -frames:v 1 -vf scale=270:480 -q:v 13 "source-$src.jpg"
            echo "SOURCE_START:$src"
            base64 -w0 "source-$src.jpg"
            echo
            echo "SOURCE_END:$src"
          done

