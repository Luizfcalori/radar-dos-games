name: Radar TikTok - Sync YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-youtube-shorts-to-tiktok.yml'

permissions:
  contents: write

concurrency:
  group: radar-tiktok-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install discovery tool
        run: pip install --disable-pip-version-check yt-dlp

      - name: Read exact Shorts tab
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --flat-playlist --dump-single-json --no-warnings \
            'https://www.youtube.com/@Radardosgamesbr/shorts' \
            > /tmp/youtube-shorts-flat.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/youtube-shorts-flat.json',encoding='utf-8'))
          count=len(data.get('entries') or [])
          print('DISCOVERED_SHORTS',count)
          if count < 1:
              raise SystemExit('Nenhum Short encontrado; fila existente preservada.')
          PY

      - name: Synchronize channel index and TikTok queue
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          scan=json.load(open('/tmp/youtube-shorts-flat.json',encoding='utf-8'))
          queue_path=Path('data/tiktok_queue.json')
          index_path=Path('data/youtube_shorts_index.json')
          queue=json.loads(queue_path.read_text(encoding='utf-8')) if queue_path.exists() else {'version':2,'items':[]}
          previous_index=json.loads(index_path.read_text(encoding='utf-8')) if index_path.exists() else {}
          old=queue.get('items') or []
          now=datetime.now(timezone.utc).isoformat()

          def norm(value):
              value=re.sub(r'(?i)#shorts?\b','',str(value or ''))
              value=unicodedata.normalize('NFKD',value).encode('ascii','ignore').decode().lower()
              value=re.sub(r'[^a-z0-9]+',' ',value)
              return ' '.join(value.split())

          def clean_title(value):
              value=re.sub(r'(?i)#shorts?\b','',str(value or ''))
              return re.sub(r'\s+',' ',value).strip(' -|') or 'Radar dos Games'

          def make_post(title):
              words=re.findall(r'[A-Za-zÀ-ÿ0-9]{4,}',title)
              stop={'para','como','mais','esse','essa','sobre','games','game','radar','shorts','short','dos','uma','com'}
              tags=[]
              for word in words:
                  if word.lower() in stop:
                      continue
                  tag='#'+re.sub(r'[^\w]','',word,flags=re.UNICODE)
                  if tag.lower() not in {x.lower() for x in tags}:
                      tags.append(tag)
                  if len(tags)>=4:
                      break
              for tag in ['#RadarDosGames','#Games','#Gaming','#TikTokGames']:
                  if tag.lower() not in {x.lower() for x in tags}:
                      tags.append(tag)
              return f'{title}\n\n🎮 Curtiu? Siga o Radar dos Games para mais.\n\n'+' '.join(tags)

          by_yid={str(x.get('youtube_id')):x for x in old if x.get('youtube_id')}
          by_title={norm(x.get('title')):x for x in old if norm(x.get('title'))}
          discovered=[]
          seen=set()
          used_ids=set()

          for raw in scan.get('entries') or []:
              vid=str(raw.get('id') or raw.get('url') or '').strip()
              if not vid or vid in seen:
                  continue
              seen.add(vid)
              raw_title=str(raw.get('title') or '').strip() or f'Radar dos Games Short {vid}'
              title=clean_title(raw_title)
              base=dict(by_yid.get(vid) or by_title.get(norm(title)) or {})
              media=str(base.get('media_url') or '').strip()
              old_status=str(base.get('status') or '')
              status='approved' if media else 'waiting_media'
              item={
                  **base,
                  'id':base.get('id') or f'yt-{vid}',
                  'title':title,
                  'media_url':media,
                  'thumbnail_url':base.get('thumbnail_url') or raw.get('thumbnail') or f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg',
                  'post_text':base.get('post_text') or make_post(title),
                  'status':status,
                  'youtube_id':vid,
                  'youtube_url':f'https://www.youtube.com/shorts/{vid}',
                  'youtube_published_at':base.get('youtube_published_at') or raw.get('timestamp') or raw.get('upload_date'),
                  'source':'youtube_channel',
              }
              # Do not churn commits every 15 minutes.
              material_before={k:base.get(k) for k in ('title','media_url','thumbnail_url','post_text','status','youtube_id','youtube_url')}
              material_after={k:item.get(k) for k in material_before}
              item['synced_at']=base.get('synced_at') if material_before==material_after and base.get('synced_at') else now
              discovered.append(item)
              used_ids.add(str(item['id']))

          # Preserve original files already queued by our production pipeline,
          # even before YouTube has indexed/matched a freshly published Short.
          for row in old:
              rid=str(row.get('id') or '')
              if rid and rid not in used_ids and row.get('media_url'):
                  discovered.append(row)

          waiting=[
              {'youtube_id':x['youtube_id'],'title':x['title'],'reason':'original_media_not_recovered_yet'}
              for x in discovered
              if x.get('source')=='youtube_channel' and x.get('status')=='waiting_media'
          ]
          ready=sum(1 for x in discovered if x.get('source')=='youtube_channel' and x.get('status')=='approved')

          queue_new={
              'version':2,
              'source_channel':'https://www.youtube.com/@Radardosgamesbr/shorts',
              'updated_at':queue.get('updated_at'),
              'items':discovered[:200],
          }
          comparable_old={k:queue.get(k) for k in ('version','source_channel','items')}
          comparable_new={k:queue_new.get(k) for k in ('version','source_channel','items')}
          if comparable_old != comparable_new or not queue_new['updated_at']:
              queue_new['updated_at']=now

          index_items=[{
              'youtube_id':x.get('youtube_id'),
              'youtube_url':x.get('youtube_url'),
              'title':x.get('title'),
              'status':x.get('status'),
          } for x in discovered if x.get('source')=='youtube_channel']
          index_new={
              'channel':'https://www.youtube.com/@Radardosgamesbr',
              'shorts_url':'https://www.youtube.com/@Radardosgamesbr/shorts',
              'updated_at':previous_index.get('updated_at'),
              'total_discovered':len(index_items),
              'ready_for_tiktok':ready,
              'waiting_media':waiting,
              'items':index_items,
          }
          old_cmp={k:previous_index.get(k) for k in ('channel','shorts_url','total_discovered','ready_for_tiktok','waiting_media','items')}
          new_cmp={k:index_new.get(k) for k in old_cmp}
          if old_cmp != new_cmp or not index_new['updated_at']:
              index_new['updated_at']=now

          queue_path.parent.mkdir(parents=True,exist_ok=True)
          queue_path.write_text(json.dumps(queue_new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          index_path.write_text(json.dumps(index_new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'discovered':len(index_items),'ready':ready,'waiting_media':len(waiting)},ensure_ascii=False))
          PY

      - name: Commit only when the channel state changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-tiktok-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tiktok_queue.json data/youtube_shorts_index.json
          if git diff --cached --quiet; then
            echo 'Queue already synchronized.'
            exit 0
          fi
          git commit -m 'bot: sync YouTube Shorts into TikTok Helper'
          git pull --rebase origin main
          git push origin main
