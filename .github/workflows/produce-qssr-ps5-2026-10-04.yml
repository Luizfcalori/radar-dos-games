name: Radar dos Games - Produzir QSSR PS5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-qssr-ps5-2026-10-04.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Validar intro oficial permanente
        run: |
          test -s radar-dos-games-intro-oficial.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 radar-dos-games-intro-oficial.mp4

      - name: Pesquisar pautas atuais nas fontes oficiais
        run: python src/research.py

      - name: Forçar pauta QSSR/upscaling por IA no PS5
        env:
          RADAR_TOPIC: "AI upscaling is coming to PS5"
          PUBLISH_PRIVACY: unlisted
        run: python src/auto_daily.py

      - name: Criar narração Thalita PT-BR com timings semânticos
        run: |
          python src/voice.py output/auto-script.txt output/voice.mp3 \
            --voice pt-BR-ThalitaNeural \
            --segments-json output/voice-timings.json

      - name: Baixar mídia oficial/contextual
        run: python src/media.py output/auto-media-plan.json

      - name: Montar manifesto apenas com mídias validadas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path("output/auto-media-plan.json").read_text(encoding="utf-8"))
          media = json.loads(Path("output/clips.json").read_text(encoding="utf-8"))
          assets = media["assets"]
          ok = [int(a["index"]) for a in assets]
          assert len(ok) >= 2, ok
          scenes = spec["scenes"]
          for i, scene in enumerate(scenes):
              a = ok[i % len(ok)]
              b = ok[(i + 1) % len(ok)]
              scene["media_indices"] = [a] if a == b else [a, b]
          manifest = {
              "assets": assets,
              "voice": "output/voice.mp3",
              "voice_timings": "output/voice-timings.json",
              "intro": "radar-dos-games-intro-oficial.mp4",
              "scenes": scenes,
              "output": "output/master.mp4",
          }
          Path("output/render.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Renderizar Master no padrão aprovado
        run: python src/render.py output/render.json

      - name: Criar capa
        run: python src/thumbnail.py output/master.mp4 'PS5 GANHA UPSCALING POR IA!' output/thumbnail.jpg

      - name: Gerar exatamente 3 Shorts
        run: python src/shorts.py output/master.mp4

      - name: Quality gate Master + Shorts
        run: |
          python - <<'PY'
          import glob
          import json
          import subprocess
          from pathlib import Path
          def probe(path):
              return json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(path)], text=True))
          master = Path("output/master.mp4")
          assert master.exists() and master.stat().st_size > 3_000_000, master
          m = probe(master)
          md = float(m["format"]["duration"])
          mv = next(x for x in m["streams"] if x["codec_type"] == "video")
          assert 100 <= md <= 420, md
          assert (int(mv["width"]), int(mv["height"])) == (1920, 1080)
          assert any(x["codec_type"] == "audio" for x in m["streams"])
          qa = json.loads(Path("output/qa.json").read_text(encoding="utf-8"))
          assert qa["card_style"]["shadow_attached_to_text"] is True
          assert qa["framing_policy"] == "full_source_visible; blurred_background_fill; no_destructive_crop"
          assert qa["voice"] == "pt-BR-ThalitaNeural"
          assert qa["semantic_timing_source"] == "paragraph_boundaries"
          assert len(qa["scenes"]) == 8
          shorts = sorted(glob.glob("output/shorts/short_*.mp4"))
          assert len(shorts) == 3, shorts
          report = []
          for path in shorts:
              p = probe(path)
              d = float(p["format"]["duration"])
              v = next(x for x in p["streams"] if x["codec_type"] == "video")
              assert (int(v["width"]), int(v["height"])) == (1080, 1920), path
              assert 10 <= d <= 65, (path, d)
              assert any(x["codec_type"] == "audio" for x in p["streams"]), path
              report.append({"file": path, "seconds": round(d, 2)})
          Path("output/final-qa.json").write_text(json.dumps({"master_seconds": round(md, 2), "master": "1920x1080@30", "shorts": report, "status": "APPROVED"}, indent=2), encoding="utf-8")
          print(Path("output/final-qa.json").read_text())
          PY

      - name: Guardar pacote final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-qssr-ps5-${{ github.run_id }}
          path: |
            output/research.json
            output/selected.json
            output/auto-script.txt
            output/auto-media-plan.json
            output/clips.json
            output/voice.mp3
            output/voice-timings.json
            output/master.mp4
            output/thumbnail.jpg
            output/qa.json
            output/final-qa.json
            output/shorts/*.mp4
            output/*youtube*.json
          retention-days: 7
