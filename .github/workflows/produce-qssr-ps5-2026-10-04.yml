name: Radar dos Games - Produzir QSSR PS5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-qssr-ps5-2026-10-04.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Validar intro oficial permanente
        run: |
          test -s radar-dos-games-intro-oficial.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 radar-dos-games-intro-oficial.mp4

      - name: Pesquisar pautas atuais nas fontes oficiais
        run: python src/research.py

      - name: Forçar pauta QSSR/upscaling por IA no PS5
        env:
          RADAR_TOPIC: "AI upscaling is coming to PS5"
          PUBLISH_PRIVACY: unlisted
        run: python src/auto_daily.py

      - name: Aplicar roteiro editorial PT-BR e mídia oficial QSSR
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          script = """A Sony confirmou uma novidade importante para quem joga no PS5 padrão: o console vai receber o QSSR, sigla para Quick Spectral Super Resolution. Na prática, é uma nova tecnologia de upscaling por inteligência artificial criada para melhorar nitidez, detalhes finos e estabilidade de imagem sem exigir o hardware dedicado do PS5 Pro. E o mais interessante é que os primeiros jogos já foram anunciados.

          Para entender por que isso importa, vale lembrar do PSSR, o PlayStation Spectral Super Resolution usado no PS5 Pro. Essa tecnologia analisa a imagem do jogo pixel por pixel e usa inteligência artificial para reconstruir uma imagem mais limpa e detalhada. O problema é que o PSSR exige mais capacidade de processamento. Por isso, até agora, a Sony não conseguia levar a mesma abordagem ao PS5 base.

          O QSSR nasce justamente para resolver essa limitação. Segundo a própria Sony, ele veio do Project Amethyst, a colaboração da empresa com a AMD para desenvolver soluções de inteligência artificial aplicadas a gráficos. A nova biblioteca usa uma arquitetura de rede neural simplificada e uma implementação ajustada manualmente para aproveitar melhor o desempenho disponível no PS5 padrão.

          Isso não significa que o PS5 comum virou um PS5 Pro. A Sony deixa claro que o PSSR continua sendo a solução mais avançada no modelo Pro. O objetivo do QSSR é entregar parte desses benefícios no console base, com ganhos principalmente em riqueza de detalhes e estabilidade temporal. Em cenas cheias de movimento, vegetação, cabelo, partículas ou linhas finas, esse tipo de reconstrução pode fazer uma diferença visível na clareza final.

          Os dois primeiros jogos a receber o recurso são Marvel's Wolverine e Ghost of Yōtei. A Sony informou que ambos estão sendo atualizados para oferecer o QSSR como uma opção gráfica adicional no PS5. A Insomniac destacou mais clareza em nível de pixel e maior estabilidade nos cenários de Wolverine, enquanto a Sucker Punch chamou atenção para detalhes finos de personagens e ambientes em Ghost of Yōtei.

          Outro ponto importante é que isso não deve ficar preso a apenas esses dois títulos. A Sony confirmou que o QSSR será disponibilizado amplamente para todos os desenvolvedores de PlayStation. Isso abre espaço para que mais jogos adotem a tecnologia no futuro, principalmente títulos que hoje precisam escolher entre resolução, estabilidade e desempenho usando métodos tradicionais de reconstrução de imagem.

          Para o jogador, o impacto real vai depender de cada implementação. QSSR não aumenta sozinho a potência bruta do console e não substitui otimização. Mas ele oferece aos estúdios uma ferramenta nova para reconstruir uma imagem de melhor qualidade a partir de uma resolução interna menor. Se for bem utilizado, isso pode significar modos de desempenho mais nítidos, menos serrilhado e uma imagem mais estável sem sacrificar tantos quadros por segundo.

          Resumindo: o PS5 padrão acaba de ganhar uma nova camada de vida útil com inteligência artificial aplicada aos gráficos. Wolverine e Ghost of Yōtei serão a primeira vitrine, mas o ponto maior é a abertura da biblioteca para outros estúdios. Agora o que vale acompanhar é quais jogos vão adotar QSSR em seguida e quanto dessa melhoria vai aparecer na prática. Se curtiu o Radar dos Games, se inscreva no canal e conta nos comentários qual jogo você gostaria de ver recebendo QSSR."""
          script = "\n\n".join(line.strip() for line in script.split("\n\n")) + "\n"
          Path("output/auto-script.txt").write_text(script, encoding="utf-8")

          plan_path = Path("output/auto-media-plan.json")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          official_article = "https://blog.playstation.com/2026/10/01/ai-upscaling-is-coming-to-ps5/"
          videos = [
              {
                  "type": "video",
                  "url": "https://www.youtube.com/watch?v=RcFYsDKbAIk",
                  "role": "official_qssr_wolverine",
                  "source_proof": official_article,
                  "relevance_evidence": "embedded_on_official_playstation_qssr_article",
                  "source_label": "PlayStation Blog QSSR"
              },
              {
                  "type": "video",
                  "url": "https://www.youtube.com/watch?v=E929-XwrS_Q",
                  "role": "official_qssr_yotei",
                  "source_proof": official_article,
                  "relevance_evidence": "embedded_on_official_playstation_qssr_article",
                  "source_label": "PlayStation Blog QSSR"
              }
          ]
          plan["topic"] = "QSSR no PS5: Sony leva upscaling por IA ao console base"
          plan["minimum_assets"] = 6
          plan["minimum_video_assets"] = 0
          plan["minimum_image_assets"] = 6
          plan["minimum_unique_video_seconds"] = 0
          plan["media"] = videos + plan.get("media", [])
          scene_titles = [
              ("QSSR CHEGA AO PS5", "UPSCALING POR IA NO CONSOLE BASE"),
              ("POR QUE ISSO IMPORTA", "DO PSSR DO PS5 PRO AO NOVO QSSR"),
              ("COMO A SONY CONSEGUIU", "PROJECT AMETHYST + AMD"),
              ("PS5 NÃO VIROU UM PRO", "MAS A QUALIDADE DE IMAGEM PODE SUBIR"),
              ("OS PRIMEIROS JOGOS", "WOLVERINE E GHOST OF YŌTEI"),
              ("NÃO VAI PARAR EM DOIS", "QSSR SERÁ ABERTO A DESENVOLVEDORES"),
              ("O QUE MUDA NA PRÁTICA", "MAIS NITIDEZ E ESTABILIDADE"),
              ("O FUTURO DO PS5", "QUAIS JOGOS VÃO ADOTAR QSSR?")
          ]
          for scene, (title, subtitle) in zip(plan.get("scenes", []), scene_titles):
              scene["title"] = title
              scene["subtitle"] = subtitle
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2), encoding="utf-8")

          selected_path = Path("output/selected.json")
          selected = json.loads(selected_path.read_text(encoding="utf-8"))
          selected["editorial_title_ptbr"] = "QSSR no PS5: Sony leva upscaling por IA ao console base"
          selected_path.write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding="utf-8")

          source_br = "https://blog.br.playstation.com/2026/10/01/upscaling-com-ia-chega-em-breve-para-ps5/"
          master = {
              "title": "QSSR no PS5: Sony leva upscaling por IA ao console base",
              "description": "🎮 A Sony confirmou o QSSR para o PS5 padrão: uma nova solução de upscaling por IA criada a partir do Project Amethyst com a AMD. Marvel's Wolverine e Ghost of Yōtei serão os primeiros jogos, e a biblioteca será disponibilizada a outros desenvolvedores de PlayStation.\n\n🔎 Fonte oficial: " + source_br + "\n\n#RadarDosGames #PS5 #QSSR #PlayStation #Wolverine #GhostOfYotei",
              "tags": ["Radar dos Games", "PS5", "QSSR", "PlayStation", "upscaling IA", "PSSR", "Marvel's Wolverine", "Ghost of Yotei", "AMD", "Project Amethyst"],
              "privacy": "unlisted",
              "containsSyntheticMedia": False
          }
          Path("output/master-youtube.json").write_text(json.dumps(master, ensure_ascii=False, indent=2), encoding="utf-8")
          short_titles = [
              "QSSR: o PS5 ganhou upscaling por IA #Shorts",
              "Wolverine e Ghost of Yōtei estreiam QSSR #Shorts",
              "QSSR pode melhorar muitos jogos no PS5 #Shorts"
          ]
          for i, title in enumerate(short_titles, 1):
              meta = {
                  "title": title,
                  "description": "QSSR chegou ao PS5 padrão. Veja o que a Sony confirmou oficialmente e por que essa tecnologia pode melhorar a qualidade de imagem dos jogos.\n\nFonte oficial: " + source_br + "\n\n#RadarDosGames #PS5 #QSSR #Shorts",
                  "tags": ["Radar dos Games", "PS5", "QSSR", "PlayStation", "Shorts"],
                  "privacy": "unlisted",
                  "containsSyntheticMedia": False
              }
              Path(f"output/short-{i}-youtube.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Criar narração Thalita PT-BR com timings semânticos
        run: |
          python src/voice.py output/auto-script.txt output/voice.mp3 \
            --voice pt-BR-ThalitaNeural \
            --segments-json output/voice-timings.json

      - name: Baixar mídia oficial/contextual com fallback de imagens
        run: python src/media.py output/auto-media-plan.json

      - name: Montar manifesto apenas com mídias validadas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path("output/auto-media-plan.json").read_text(encoding="utf-8"))
          media = json.loads(Path("output/clips.json").read_text(encoding="utf-8"))
          assets = media["assets"]
          ok = [int(a["index"]) for a in assets]
          assert len(ok) >= 6, ok
          scenes = spec["scenes"]
          # Mapeamento editorial validado visualmente. Evita imagens laterais da página
          # que pertencem a outros conteúdos, mesmo sendo hospedadas pelo PlayStation Blog.
          preferred = [
              [3, 4],   # Wolverine + Ghost / abertura
              [4, 5],   # Ghost + comparação QSSR
              [5, 7],   # comparação + thumbnail oficial Wolverine
              [7, 8],   # comparações oficiais incorporadas na matéria
              [8, 9],   # Ghost/Wolverine + contexto PlayStation
              [9, 10],  # PS5 / ecossistema
              [10, 11], # imagens diretamente relacionadas ao anúncio
              [3, 7],   # encerra com Wolverine/QSSR; não usa assets periféricos
          ]
          available = set(ok)
          assert all(all(x in available for x in pair) for pair in preferred), (ok, preferred)
          for scene, pair in zip(scenes, preferred):
              scene["media_indices"] = pair
          manifest = {
              "assets": assets,
              "voice": "output/voice.mp3",
              "voice_timings": "output/voice-timings.json",
              "intro": "radar-dos-games-intro-oficial.mp4",
              "scenes": scenes,
              "output": "output/master.mp4",
          }
          Path("output/render.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Renderizar Master no padrão aprovado
        run: python src/render.py output/render.json

      - name: Criar capa
        run: python src/thumbnail.py output/master.mp4 'PS5 GANHA UPSCALING POR IA!' output/thumbnail.jpg

      - name: Gerar exatamente 3 Shorts
        run: python src/shorts.py output/master.mp4

      - name: Quality gate Master + Shorts
        run: |
          python - <<'PY'
          import glob
          import json
          import subprocess
          from pathlib import Path
          def probe(path):
              return json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(path)], text=True))
          master = Path("output/master.mp4")
          assert master.exists() and master.stat().st_size > 3_000_000, master
          m = probe(master)
          md = float(m["format"]["duration"])
          mv = next(x for x in m["streams"] if x["codec_type"] == "video")
          assert 100 <= md <= 420, md
          assert (int(mv["width"]), int(mv["height"])) == (1920, 1080)
          assert any(x["codec_type"] == "audio" for x in m["streams"])
          qa = json.loads(Path("output/qa.json").read_text(encoding="utf-8"))
          assert qa["card_style"]["shadow_attached_to_text"] is True
          assert qa["framing_policy"] == "full_source_visible; blurred_background_fill; no_destructive_crop"
          assert qa["voice"] == "pt-BR-ThalitaNeural"
          assert qa["semantic_timing_source"] == "paragraph_boundaries"
          assert len(qa["scenes"]) == 8
          assert qa["scenes"][7]["media_indices_explicit"] == [3, 7]
          shorts = sorted(glob.glob("output/shorts/short_*.mp4"))
          assert len(shorts) == 3, shorts
          report = []
          for path in shorts:
              p = probe(path)
              d = float(p["format"]["duration"])
              v = next(x for x in p["streams"] if x["codec_type"] == "video")
              assert (int(v["width"]), int(v["height"])) == (1080, 1920), path
              assert 10 <= d <= 65, (path, d)
              assert any(x["codec_type"] == "audio" for x in p["streams"]), path
              report.append({"file": path, "seconds": round(d, 2)})
          Path("output/final-qa.json").write_text(json.dumps({"master_seconds": round(md, 2), "master": "1920x1080@30", "shorts": report, "status": "APPROVED"}, indent=2), encoding="utf-8")
          print(Path("output/final-qa.json").read_text())
          PY

      - name: Guardar pacote final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-qssr-ps5-${{ github.run_id }}
          path: |
            output/research.json
            output/selected.json
            output/auto-script.txt
            output/auto-media-plan.json
            output/clips.json
            output/voice.mp3
            output/voice-timings.json
            output/master.mp4
            output/thumbnail.jpg
            output/qa.json
            output/final-qa.json
            output/shorts/*.mp4
            output/*youtube*.json
          retention-days: 7
