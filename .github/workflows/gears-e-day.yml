name: Radar Games - Gears E-Day Test 2
on:
  push:
    branches: [produce-gears-e-day-test-2]
    paths:
      - '.github/workflows/gears-e-day.yml'
      - 'production/2026-10-02-gears-e-day/**'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install free toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
          pip install -U edge-tts yt-dlp pillow
      - name: Create Thalita PT-BR narration
        run: |
          mkdir -p output
          python src/voice.py production/2026-10-02-gears-e-day/script-v1.txt output/voice.mp3 --voice pt-BR-ThalitaNeural --segments-json output/voice-timings.json
      - name: Acquire official contextual media without paid services
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          p=json.loads(pathlib.Path('production/2026-10-02-gears-e-day/media-plan.json').read_text())
          pathlib.Path('output/media').mkdir(parents=True,exist_ok=True)
          ok=[]
          for i,u in enumerate(p['sources'],1):
              dest=f'output/media/source_{i}.mp4'
              r=subprocess.run(['yt-dlp','--no-playlist','-f','bv*+ba/b','--merge-output-format','mp4','-o',dest,u],check=False)
              if r.returncode==0 and pathlib.Path(dest).exists(): ok.append(dest)
          pathlib.Path('output/media-acquired.json').write_text(json.dumps({'files':ok,'sources':p['sources']},indent=2))
          print('official playable assets:',len(ok))
          PY
      - name: Guard visual relevance and approved intro
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          acquired=json.loads(Path('output/media-acquired.json').read_text())['files']
          assert acquired, 'OFFICIAL_CONTEXTUAL_VIDEO_MISSING: do not render black/text fallback'
          intro=Path('production/reference-masters/radar-intro-official.mp4')
          assert intro.exists() and intro.stat().st_size>100000, 'APPROVED_RADAR_INTRO_MISSING'
          # Reject nearly-black media before render.
          for p in acquired:
              out=subprocess.check_output(['ffmpeg','-v','error','-ss','2','-i',p,'-frames:v','1','-vf','scale=64:36,signalstats,metadata=print:file=-','-f','null','-'],stderr=subprocess.STDOUT,text=True)
              if 'lavfi.signalstats.YAVG=' in out:
                  y=float(out.split('lavfi.signalstats.YAVG=')[1].splitlines()[0])
                  assert y>18, (p,'NEAR_BLACK',y)
          print('VISUAL + INTRO GUARDS OK')
          PY
      - name: Assemble Master with official intro and contextual media
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          media=json.loads(Path('output/media-acquired.json').read_text())['files']
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','output/voice.mp3'],text=True).strip())
          target=max(240,min(300,dur+8))
          Path('output/concat.txt').write_text(''.join("file '%s'\n"%Path(x).resolve() for _ in range(16) for x in media))
          subprocess.run(['ffmpeg','-y','-v','error','-f','concat','-safe','0','-i','output/concat.txt','-t',str(target),'-vf','scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text=RADAR DOS GAMES:x=w-tw-45:y=35:fontsize=30:fontcolor=white@0.65','-an','-c:v','libx264','-preset','veryfast','-crf','21','output/body.mp4'],check=True)
          subprocess.run(['ffmpeg','-y','-v','error','-i','output/body.mp4','-i','output/voice.mp3','-filter:a','loudnorm=I=-16:LRA=7:TP=-1.5','-map','0:v','-map','1:a','-c:v','copy','-c:a','aac','-b:a','192k','-shortest','output/body-av.mp4'],check=True)
          Path('output/master-concat.txt').write_text("file '%s'\nfile '%s'\n"%(Path('production/reference-masters/radar-intro-official.mp4').resolve(),Path('output/body-av.mp4').resolve()))
          subprocess.run(['ffmpeg','-y','-v','error','-f','concat','-safe','0','-i','output/master-concat.txt','-c','copy','-movflags','+faststart','output/gears-e-day-master.mp4'],check=True)
          PY
      - name: Generate exactly 3 approved-format Shorts
        run: python src/shorts.py output/gears-e-day-master.mp4
      - name: Generate free thumbnail
        run: |
          ffmpeg -y -v error -ss 00:00:20 -i output/gears-e-day-master.mp4 -frames:v 1 -vf "scale=1280:720,drawbox=x=0:y=470:w=1280:h=250:color=black@0.65:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GEARS OF WAR\: E-DAY':x=55:y=510:fontsize=72:fontcolor=white,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='O DIA DA EMERGÊNCIA CHEGOU':x=58:y=610:fontsize=42:fontcolor=white" output/gears-e-day-thumbnail.jpg
      - name: Quality gates visual + intro + shorts
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          master=Path('output/gears-e-day-master.mp4'); assert master.exists() and master.stat().st_size>10_000_000
          def probe(p): return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          m=probe(master); d=float(m['format']['duration']); assert 230 <= d <= 330, d
          # Sample six frames; reject black masters like the previous false-positive QA.
          for t in [5,30,60,120,180,min(240,d-2)]:
              raw=subprocess.check_output(['ffmpeg','-v','error','-ss',str(t),'-i',str(master),'-frames:v','1','-vf','scale=64:36','-f','rawvideo','-pix_fmt','gray','pipe:1'])
              avg=sum(raw)/len(raw); assert avg>18,(t,avg,'BLACK_MASTER')
          shorts=sorted(Path('output/shorts').glob('short_*.mp4')); assert len(shorts)==3
          for s in shorts:
              q=probe(s); v=next(x for x in q['streams'] if x['codec_type']=='video'); assert (int(v['width']),int(v['height']))==(1080,1920)
          assert Path('output/gears-e-day-thumbnail.jpg').exists()
          Path('output/qa-gears.json').write_text(json.dumps({'topic':'Gears of War: E-Day','master_seconds':d,'voice':'pt-BR-ThalitaNeural','intro_required':True,'visual_black_gate':True,'shorts':3,'vertical':'1080x1920','thumbnail':True,'paid_tools':False},indent=2))
          PY
      - name: Upload Master + 3 Shorts + thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: radar-games-gears-e-day-test-2-fixed
          path: |
            output/gears-e-day-master.mp4
            output/shorts/short_1.mp4
            output/shorts/short_2.mp4
            output/shorts/short_3.mp4
            output/shorts/manifest.json
            output/gears-e-day-thumbnail.jpg
            output/qa-gears.json
            output/voice-timings.json
          retention-days: 7