name: Saros cover correction - safe render only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-saros-cover-fix.yml"
      - "src/rebuild_saros_existing.py"
      - "src/premium_covers.py"
      - "src/cover_qa.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: radar-saros-cover-correction
  cancel-in-progress: false

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg, fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core unzip
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recover source video and timing map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/shorts /tmp/saros-legacy
          curl -fL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12337061067/zip" -o /tmp/saros-legacy.zip
          unzip -q /tmp/saros-legacy.zip -d /tmp/saros-legacy
          test -s /tmp/saros-legacy/master.mp4
          test -s /tmp/saros-legacy/voice-timings.json
          test -s /tmp/saros-legacy/thumbnail.jpg
          cp /tmp/saros-legacy/master.mp4 output/master-source.mp4
          cp /tmp/saros-legacy/voice-timings.json output/legacy-voice-timings.json
          cp /tmp/saros-legacy/thumbnail.jpg output/legacy-thumbnail.jpg
      - name: Validate editorial scripts
        run: |
          python src/narration_qa.py production/saros-rebuild-master.txt
          python - <<'PY'
          from pathlib import Path
          script = Path("production/saros-rebuild-master.txt").read_text(encoding="utf-8")
          if len(script.split()) < 500 or len([p for p in script.split("\n\n") if p.strip()]) != 13:
              raise SystemExit("QUALITY_BLOCK: Master needs 500+ words in 13 aligned blocks.")
          for i in range(1, 4):
              words = len(Path(f"production/saros-rebuild-short-{i}.txt").read_text(encoding="utf-8").split())
              if not 30 <= words <= 55:
                  raise SystemExit(f"QUALITY_BLOCK: Short {i} narration length invalid: {words}")
          PY
      - name: Generate Thalita PT-BR narration
        run: |
          python src/voice.py production/saros-rebuild-master.txt output/new-voice.mp3 --voice pt-BR-ThalitaMultilingualNeural --prepared --segments-json output/new-voice-timings.json
          cp -R output/voice_segments output/master_voice_segments
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/new-voice-timings.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          for segment in data.get("segments", []):
              segment["file"] = segment.get("file", "").replace("output/voice_segments/", "output/master_voice_segments/")
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python src/voice.py production/saros-rebuild-short-1.txt output/shorts/short_1_voice.mp3 --voice pt-BR-ThalitaMultilingualNeural --prepared
          python src/voice.py production/saros-rebuild-short-2.txt output/shorts/short_2_voice.mp3 --voice pt-BR-ThalitaMultilingualNeural --prepared
          python src/voice.py production/saros-rebuild-short-3.txt output/shorts/short_3_voice.mp3 --voice pt-BR-ThalitaMultilingualNeural --prepared
      - name: Rebuild with official Saros artwork and cover-first Shorts
        run: python src/rebuild_saros_existing.py
      - name: Rebuild all four covers with the shared Radar premium generator
        run: |
          set -euo pipefail
          test -s output/saros-official-keyart.jpg
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p = Path("output/saros-official-keyart.jpg")
          with Image.open(p) as im:
              w, h = im.size
          asset = {
            "index": 1, "approved": True, "type": "image",
            "path": str(p), "width": w, "height": h,
            "role": "official_saros_key_art",
            "source_label": "Saros official PlayStation key art",
            "url": "https://blog.playstation.com/2026/10/19/the-saros-zenith-update-out-today-brings-more-ways-to-play-for-newcomers-and-veterans-alike/",
            "relevance_evidence": "official exact Saros game key art; Zenith update; protection modifiers; New Game Plus Eclipse Layers; Overlord Rush eight bosses",
            "source": "PlayStation Blog",
            "duration": 0
          }
          Path("output/clips.json").write_text(json.dumps({"assets":[asset]}, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python src/premium_covers.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/cover-suite-policy.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          if data.get("status") != "APPROVED_PREMIUM":
              raise SystemExit("QUALITY_BLOCK: shared premium generator did not approve all covers")
          if data.get("template_version") != "radar-premium-auto-v1-2026-10-07":
              raise SystemExit("QUALITY_BLOCK: unexpected cover template")
          if len(data.get("short_openings", [])) != 3 or any(x.get("status") != "APPROVED" for x in data.get("short_openings", [])):
              raise SystemExit("QUALITY_BLOCK: not all three Shorts have matching 1.4-second cover openings")
          print("SHARED_PREMIUM_COVER_POLICY_OK")
          PY
      - name: Run mandatory four-cover and first-frame QA
        run: |
          set -euo pipefail
          python -m py_compile src/premium_covers.py src/cover_qa.py
          python src/cover_qa.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/cover-qa.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          if data.get("status") != "APPROVED_PREMIUM":
              raise SystemExit("QUALITY_BLOCK: cover QA did not approve premium covers")
          if data.get("premium_cover_qa") != "APPROVED" or data.get("fallback_used"):
              raise SystemExit("QUALITY_BLOCK: premium QA missing or fallback used")
          if len(data.get("covers", [])) != 4 or len(data.get("short_openings", [])) != 3:
              raise SystemExit("QUALITY_BLOCK: expected exactly four covers and three approved openings")
          if any(x.get("status") != "APPROVED" for x in data["short_openings"]):
              raise SystemExit("QUALITY_BLOCK: a Short first-frame check failed")
          print("COVER_QA_APPROVED_PREMIUM")
          PY
      - name: Cover and video quality gates
        run: |
          set -euo pipefail
          python -m py_compile src/rebuild_saros_existing.py
          test -s output/thumbnail.jpg
          test -s output/shorts/short_1_cover.jpg
          test -s output/shorts/short_2_cover.jpg
          test -s output/shorts/short_3_cover.jpg
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected = {"output/thumbnail.jpg": (1280,720), **{f"output/shorts/short_{i}_cover.jpg": (1080,1920) for i in range(1,4)}}
          from PIL import Image
          for name, size in expected.items():
              p=Path(name)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  if im.size != size or p.stat().st_size < 30000:
                      raise SystemExit(f"QUALITY_BLOCK: invalid cover {name}: {im.size}, {p.stat().st_size}")
              print("COVER_OK", name, size, p.stat().st_size)
          for i in range(1,4):
              p=Path(f"output/shorts/short_{i}.mp4")
              d=float(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",str(p)],capture_output=True,text=True,check=True).stdout.strip())
              if not 15 <= d <= 25:
                  raise SystemExit(f"QUALITY_BLOCK: Short {i} duration {d:.2f}s")
              print("SHORT_OK", i, round(d,2), "seconds; cover opening was applied by render script")
          PY
      - name: Upload corrected covers and private review videos (no YouTube upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saros-corrected-covers-review-only
          path: |
            output/thumbnail.jpg
            output/cover-qa.json
            output/cover-suite-policy.json
            output/saros-official-keyart.jpg
            output/shorts/short_1_cover.jpg
            output/shorts/short_2_cover.jpg
            output/shorts/short_3_cover.jpg
            output/master.mp4
            output/shorts/short_1.mp4
            output/shorts/short_2.mp4
            output/shorts/short_3.mp4
            output/master-youtube.json
            output/short-1-youtube.json
            output/short-2-youtube.json
            output/short-3-youtube.json
          if-no-files-found: warn
          retention-days: 14
