name: Publish approved ARC Raiders Frozen Trail Master and 3 Shorts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-arc-raiders-frozen-trail-approved-2026-10-09.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-approved-arc-raiders-37923972440
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Install YouTube client and media validators
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            google-api-python-client==2.184.0 google-auth==2.41.1 \
            google-auth-oauthlib==1.2.2 Pillow>=11.0

      - name: Download EXACT user-approved production (no new render)
        uses: actions/download-artifact@v4
        with:
          name: radar-daily-auto-37923972440
          path: approved
          github-token: ${{ github.token }}
          repository: Luizfcalori/radar-dos-games
          run-id: 37923972440

      - name: Verify package, covers and editorial QA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('approved')
          def locate(rel):
              for p in (root/rel,root/'output'/rel):
                  if p.is_file() and p.stat().st_size:
                      return p
              raise RuntimeError('QUALITY_BLOCK: approved file missing: '+rel)
          media=['master.mp4','shorts/short_1.mp4','shorts/short_2.mp4','shorts/short_3.mp4']
          for rel in media:
              p=locate(rel)
              if p.stat().st_size<500000:
                  raise RuntimeError('QUALITY_BLOCK: undersized '+rel)
              print('APPROVED_VIDEO',rel,p.stat().st_size)
          for rel,size in [('thumbnail.jpg',(1280,720)),
                           ('shorts/short_1_cover.jpg',(1080,1920)),
                           ('shorts/short_2_cover.jpg',(1080,1920)),
                           ('shorts/short_3_cover.jpg',(1080,1920))]:
              p=locate(rel)
              with Image.open(p) as im:
                  if im.size!=size: raise RuntimeError('Incorrect cover dimensions: '+rel)
                  im.verify()
              print('APPROVED_COVER',rel)
          for rel in ['master-youtube.json','short-1-youtube.json',
                      'short-2-youtube.json','short-3-youtube.json']:
              locate(rel)
          final=json.loads(locate('final-qa.json').read_text(encoding='utf-8'))
          anti=json.loads(locate('anti-repetition-qa.json').read_text(encoding='utf-8'))
          if final.get('status')!='APPROVED' or anti.get('status')!='APPROVED':
              raise RuntimeError('QUALITY_BLOCK: approved final QA or anti-spam QA missing')
          if len(anti.get('shorts',[]))!=3:
              raise RuntimeError('QUALITY_BLOCK: three shorts did not pass anti-repetition QA')
          selected=json.loads(locate('selected.json').read_text(encoding='utf-8'))
          if not selected.get('manual_brief') or 'arc raiders' not in str(selected.get('title','')).lower():
              raise RuntimeError('QUALITY_BLOCK: wrong approved topic/brief')
          print('LOCKED_APPROVED_SOURCE_RUN',37923972440)
          PY

      - name: Upload exactly approved MP4s and apply original covers
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError
          from src.cinematic import credited_description

          root=Path('approved')
          def locate(rel):
              for p in (root/rel,root/'output'/rel):
                  if p.is_file() and p.stat().st_size: return p
              raise RuntimeError('Approved file missing: '+rel)

          expected_id='UCSZJZE-E10SVdx42wrDeWhw'
          expected_name='Radar dos Games'
          keys=('YT_CLIENT_ID','YT_CLIENT_SECRET','YT_REFRESH_TOKEN')
          missing=[k for k in keys if not os.getenv(k)]
          if missing: raise RuntimeError('Missing OAuth Secrets: '+', '.join(missing))
          creds=Credentials(None,refresh_token=os.environ['YT_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YT_CLIENT_ID'],
              client_secret=os.environ['YT_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload',
                      'https://www.googleapis.com/auth/youtube.readonly'])
          yt=build('youtube','v3',credentials=creds)
          channels=yt.channels().list(part='id,snippet,contentDetails',mine=True).execute().get('items',[])
          if len(channels)!=1 or channels[0]['id']!=expected_id or (
                  channels[0].get('snippet',{}).get('title','').strip().casefold()!=expected_name.casefold()):
              raise RuntimeError('WRONG CHANNEL: upload forbidden')
          playlist=channels[0]['contentDetails']['relatedPlaylists']['uploads']
          print('RADAR_CHANNEL_VERIFIED',expected_id)

          # Idempotent on re-run; never upload a second copy with the same exact title.
          existing={}
          token=None
          for _ in range(10):
              page=yt.playlistItems().list(part='snippet,contentDetails',
                  playlistId=playlist,maxResults=50,pageToken=token).execute()
              for item in page.get('items',[]):
                  title=item.get('snippet',{}).get('title','').strip().casefold()
                  vid=item.get('contentDetails',{}).get('videoId')
                  if title and vid: existing[title]=vid
              token=page.get('nextPageToken')
              if not token: break

          items=[
              ('master','master.mp4','master-youtube.json','thumbnail.jpg'),
              ('short1','shorts/short_1.mp4','short-1-youtube.json','shorts/short_1_cover.jpg'),
              ('short2','shorts/short_2.mp4','short-2-youtube.json','shorts/short_2_cover.jpg'),
              ('short3','shorts/short_3.mp4','short-3-youtube.json','shorts/short_3_cover.jpg'),
          ]
          path=Path('youtube-publish-arc-raiders-results.json')
          rows=[]

          def persist():
              path.write_text(json.dumps({
                  'approved_source_run':37923972440,
                  'channel_id':expected_id,'status':'PARTIAL' if len(rows)<4 else 'COMPLETE',
                  'items':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for key,rel,meta_rel,thumb_rel in items:
              video=locate(rel)
              cover=locate(thumb_rel)
              meta=json.loads(locate(meta_rel).read_text(encoding='utf-8'))
              title=meta['title'].strip()
              video_id=existing.get(title.casefold())
              reused=bool(video_id)
              if reused:
                  found=yt.videos().list(part='snippet,status',id=video_id).execute().get('items',[])
                  if not found or found[0]['snippet'].get('channelId')!=expected_id:
                      raise RuntimeError('Existing video belongs to another channel or is missing')
                  print('ALREADY_UPLOADED',key,video_id)
              else:
                  body={'snippet':{
                          'title':title,
                          'description':credited_description(video,meta.get('description','')),
                          'tags':meta.get('tags',[]),'categoryId':'20'},
                        'status':{'privacyStatus':'public','selfDeclaredMadeForKids':False,
                          'containsSyntheticMedia':bool(meta.get('containsSyntheticMedia',True))}}
                  req=yt.videos().insert(part='snippet,status',body=body,
                      media_body=MediaFileUpload(str(video),chunksize=8*1024*1024,resumable=True))
                  response=None
                  retries=0
                  while response is None:
                      try:
                          progress,response=req.next_chunk()
                          retries=0
                          if progress: print('UPLOAD_PROGRESS',key,round(progress.progress()*100,1))
                      except (TimeoutError,OSError) as exc:
                          retries+=1
                          if retries>5: raise
                          time.sleep(min(5*(2**(retries-1)),60))
                  video_id=response['id']
                  existing[title.casefold()]=video_id
                  print('UPLOADED',key,video_id)

              cover_applied=False
              cover_warning=None
              try:
                  yt.thumbnails().set(videoId=video_id,media_body=MediaFileUpload(
                      str(cover),mimetype='image/jpeg',resumable=False)).execute()
                  cover_applied=True
                  print('THUMBNAIL_SET',key,video_id)
              except HttpError as exc:
                  cover_warning='HTTP_'+str(exc.resp.status)
                  print('THUMBNAIL_WARNING',key,cover_warning)
              check=yt.videos().list(part='snippet,status',id=video_id).execute().get('items',[])
              if not check: raise RuntimeError('Video not found after upload: '+key)
              v=check[0]
              if v['snippet'].get('channelId')!=expected_id:
                  raise RuntimeError('Unexpected video channel: '+key)
              if v['snippet'].get('title','').strip()!=title:
                  raise RuntimeError('Title changed unexpectedly: '+key)
              privacy=v['status'].get('privacyStatus')
              if privacy!='public':
                  raise RuntimeError('Video not public: '+key+' '+str(privacy))
              rows.append({'key':key,'id':video_id,'url':'https://youtu.be/'+video_id,
                           'title':title,'privacy':'public','reused':reused,
                           'thumbnail_applied':cover_applied,'thumbnail_warning':cover_warning})
              persist()
              print('VERIFIED_PUBLIC',key,video_id)

          if len(rows)!=4: raise RuntimeError('Expected Master plus three Shorts')
          print('FOUR_APPROVED_VIDEOS_PUBLIC',json.dumps(rows,ensure_ascii=False))
          PY

      - name: Keep publish proof even if a later upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-raiders-approved-youtube-results-${{ github.run_id }}
          path: youtube-publish-arc-raiders-results.json
          if-no-files-found: warn
          retention-days: 7
