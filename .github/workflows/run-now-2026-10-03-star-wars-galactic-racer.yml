name: Radar dos Games - Star Wars Galactic Racer STRICT 2026-10-03
# STRICT REBUILD v5: exact-game official videos only + Thalita Multilingual + semantic QA
on:
  push:
    paths:
      - '.github/workflows/run-now-2026-10-03-star-wars-galactic-racer.yml'
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Limpeza total do trabalho anterior
        run: |
          rm -rf output
          mkdir -p output
      - name: Ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp gdown
      - name: Validar intro oficial
        run: test -s radar-dos-games-intro-oficial.mp4
      - name: Preparar pauta e midia EXATA Galactic Racer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          press='https://starwarsgalacticracer.com/media/'
          media=[
            {'type':'video','url':'https://drive.google.com/file/d/1SGa4yvXHEAAiRCvb8rMwjMADwYegHcsL/view?usp=drive_link','role':'official_release_date_reveal','max_assets':1,'min_duration':25},
            {'type':'video','url':'https://drive.google.com/file/d/1R7LnTIQ8skZounI0u3uvpnNd916DSGtr/view?usp=drive_link','role':'official_gameplay_trailer','max_assets':1,'min_duration':25},
            {'type':'video','url':'https://drive.google.com/file/d/181vKmDj2eEBnTfp6DXwagUE9J7P12RJ6/view?usp=drive_link','role':'official_reveal_trailer','max_assets':1,'min_duration':25}
          ]
          script='''Star Wars: Galactic Racer coloca velocidade, risco e estratégia no centro de uma nova disputa na galáxia. Depois da queda do Império, a Orla Exterior vira terreno para a Galactic League, um circuito clandestino em que pilotos disputam dinheiro, reputação e sobrevivência.\n\nO protagonista é Shade, um piloto solitário em busca de vingança e glória. A campanha combina narrativa cinematográfica com corridas em que evolução, escolha de veículo e desempenho mudam a jornada até o topo da liga.\n\nA variedade de máquinas é um dos destaques. Landspeeders apostam em peso e drift, speeder bikes entregam aceleração e velocidade, enquanto outros veículos exigem linhas precisas, domínio das curvas e coragem para correr no limite.\n\nOs circuitos exploram a identidade de Star Wars com cenários, destroços, desertos e pistas perigosas. O objetivo deste vídeo é mostrar o jogo em movimento: corridas, veículos e situações retiradas diretamente dos materiais oficiais de Galactic Racer.\n\nAlém da campanha, Galactic Racer aposta em competição, personalização e melhorias para os veículos. A combinação de classes e estilos diferentes promete corridas imprevisíveis e espaço para estratégia.\n\nAqui não é uma história sobre Jedi ou profecias. Galactic Racer quer colocar a pilotagem em primeiro plano, recuperando a energia das grandes corridas de Star Wars com uma identidade própria.\n\nO Radar dos Games está acompanhando o projeto e os materiais oficiais divulgados. O que importa agora é saber se a sensação de velocidade, variedade de pistas e progressão vão sustentar a experiência completa.\n\nE você, estava esperando um novo jogo de corrida de Star Wars? Conta nos comentários e acompanhe o Radar dos Games para mais lançamentos e novidades.'''
          Path('output/auto-script.txt').write_text(script,encoding='utf-8')
          paras=[p for p in script.split('\n\n') if p.strip()]
          titles=['A GALAXIA VAI CORRER','SHADE E A LIGA','VELOCIDADE E VEICULOS','PISTAS DE STAR WARS','COMPETICAO E EVOLUCAO','SEM JEDI. SO VELOCIDADE.','O QUE ESPERAR','RADAR DOS GAMES']
          scenes=[{'title':titles[i],'narration':paras[i],'media_indices':[]} for i in range(len(paras))]
          plan={
            'topic':'Star Wars: Galactic Racer','source':press,
            'minimum_assets':3,'minimum_video_assets':3,'minimum_unique_video_seconds':150,'minimum_image_assets':0,
            'media_policy':'exact_game_only; official_presskit_google_drive_only; three_real_videos_required; no_page_images; no_platform_logos; no_other_games; no_youtube_dependency; no_paid_tools',
            'media':media,'scenes':scenes
          }
          Path('output/auto-media-plan.json').write_text(json.dumps(plan,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/selected.json').write_text(json.dumps({'title':'Star Wars: Galactic Racer','source':press,'strict_rebuild':True,'media_route':'official_presskit_google_drive_only'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Narracao Thalita Multilingual PT-BR
        run: python src/voice.py output/auto-script.txt output/voice.mp3 --voice pt-BR-ThalitaMultilingualNeural --segments-json output/voice-timings.json
      - name: Baixar 3 videos oficiais Galactic Racer
        run: python src/media.py output/auto-media-plan.json
      - name: QA semantico e de sincronismo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          media=json.loads(Path('output/clips.json').read_text())
          spec=json.loads(Path('output/auto-media-plan.json').read_text())
          timing=json.loads(Path('output/voice-timings.json').read_text())
          assets=[a for a in media.get('assets',[]) if a.get('approved')]
          videos=[a for a in assets if a.get('type')=='video']
          assert len(assets)==3, f'QUALITY_BLOCK: esperados exatamente 3 videos oficiais, encontrados {len(assets)} assets'
          assert len(videos)==3, f'QUALITY_BLOCK: videos={len(videos)}; esperado 3'
          assert media.get('unique_video_seconds',0)>=150, f"QUALITY_BLOCK: somente {media.get('unique_video_seconds',0)}s de video oficial unico"
          assert not [a for a in assets if a.get('type')!='video'], 'QUALITY_BLOCK: imagem/slideshow nao permitido nesta versao'
          expected_roles={'official_release_date_reveal','official_gameplay_trailer','official_reveal_trailer'}
          assert {a.get('role') for a in videos}==expected_roles, f'QUALITY_BLOCK: roles inesperados {[a.get("role") for a in videos]}'
          for a in videos:
              blob=(a.get('url','')+' '+a.get('role','')).lower()
              assert 'drive.google.com/file/d/' in blob, f'QUALITY_BLOCK: origem fora do press kit: {a}'
              assert a.get('relevance_evidence')=='direct_source', f'QUALITY_BLOCK: evidencia fraca: {a}'
              assert not any(x in blob for x in ['modernwar','modern-warfare','callofduty','call-of-duty','xbox-logo','playstation-logo','collector','hero-bg']), f'QUALITY_BLOCK: asset irrelevante: {a}'
          segments=timing.get('segments',[])
          assert len(segments)==len(spec['scenes']), f'QUALITY_BLOCK: {len(segments)} blocos de voz para {len(spec["scenes"])} cenas'
          Path('output/visual-qa.json').write_text(json.dumps({
            'passed':True,'approved_assets':len(assets),'video_assets':len(videos),
            'unique_video_seconds':media.get('unique_video_seconds'),'voice_segments':len(segments),
            'policy':'three_exact_official_presskit_videos_only'
          },ensure_ascii=False,indent=2))
          PY
      - name: Manifesto somente com videos aprovados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('output/auto-media-plan.json').read_text())
          media=json.loads(Path('output/clips.json').read_text())
          assets=[a for a in media['assets'] if a.get('approved') and a.get('type')=='video']
          vids=[int(a['index']) for a in assets]
          assert len(vids)==3
          for i,s in enumerate(spec['scenes']):
              # Os 3 trailers entram em todas as cenas, em ordem rotativa. O render usa trechos diferentes por seek.
              s['media_indices']=[vids[i%3],vids[(i+1)%3],vids[(i+2)%3]]
          Path('output/render.json').write_text(json.dumps({
            'assets':assets,'voice':'output/voice.mp3','voice_timings':'output/voice-timings.json',
            'intro':'radar-dos-games-intro-oficial.mp4','scenes':spec['scenes'],'output':'output/master.mp4'
          },ensure_ascii=False,indent=2))
          PY
      - name: Render Master STRICT
        run: python src/render.py output/render.json
      - name: Gerar exatamente 3 Shorts NOVOS
        run: python src/shorts.py output/master.mp4
      - name: Validar pacote final
        run: |
          test -s output/master.mp4
          test -s output/shorts/short_1.mp4
          test -s output/shorts/short_2.mp4
          test -s output/shorts/short_3.mp4
      - name: Guardar pacote STRICT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-star-wars-galactic-racer-STRICT-2026-10-03-${{ github.run_id }}
          path: output/
          retention-days: 7
