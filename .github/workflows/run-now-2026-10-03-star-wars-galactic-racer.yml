name: Radar dos Games - Star Wars Galactic Racer CLEAN 2026-10-03
# CLEAN REBUILD v4: fixed Google Drive downloader; direct official press-kit videos
on:
  push:
    paths:
      - '.github/workflows/run-now-2026-10-03-star-wars-galactic-racer.yml'
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Limpeza total do trabalho anterior
        run: |
          rm -rf output
          mkdir -p output
      - name: Ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp gdown
      - name: Validar intro oficial
        run: test -s radar-dos-games-intro-oficial.mp4
      - name: Preparar pauta e midia EXCLUSIVA Galactic Racer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          press='https://starwarsgalacticracer.com/media/'
          media=[
            {'type':'video','url':'https://drive.google.com/file/d/1SGa4yvXHEAAiRCvb8rMwjMADwYegHcsL/view?usp=drive_link','role':'official_release_date_reveal'},
            {'type':'video','url':'https://drive.google.com/file/d/1R7LnTIQ8skZounI0u3uvpnNd916DSGtr/view?usp=drive_link','role':'official_gameplay_trailer'},
            {'type':'video','url':'https://drive.google.com/file/d/181vKmDj2eEBnTfp6DXwagUE9J7P12RJ6/view?usp=drive_link','role':'official_reveal_trailer'},
            {'type':'image','url':press,'role':'official_galactic_racer_screenshots_only'}
          ]
          script='''Star Wars: Galactic Racer coloca velocidade, risco e estratégia no centro de uma nova disputa na galáxia. Depois da queda do Império, a Orla Exterior vira terreno para a Galactic League, um circuito clandestino em que pilotos disputam dinheiro, reputação e sobrevivência.\n\nO protagonista é Shade, um piloto solitário em busca de vingança e glória. A campanha combina narrativa cinematográfica com corridas em que evolução, escolha de veículo e desempenho mudam a jornada até o topo da liga.\n\nA variedade de máquinas é um dos destaques. Landspeeders apostam em peso e drift, speeder bikes entregam aceleração e velocidade, enquanto outros veículos exigem linhas precisas, domínio das curvas e coragem para correr no limite.\n\nOs circuitos exploram a identidade de Star Wars com cenários, destroços, desertos e pistas perigosas. O objetivo deste vídeo é mostrar o jogo em movimento: corridas, veículos e situações retiradas diretamente dos materiais oficiais de Galactic Racer.\n\nAlém da campanha, Galactic Racer aposta em competição, personalização e melhorias para os veículos. A combinação de classes e estilos diferentes promete corridas imprevisíveis e espaço para estratégia.\n\nAqui não é uma história sobre Jedi ou profecias. Galactic Racer quer colocar a pilotagem em primeiro plano, recuperando a energia das grandes corridas de Star Wars com uma identidade própria.\n\nO Radar dos Games está acompanhando o projeto e os materiais oficiais divulgados. O que importa agora é saber se a sensação de velocidade, variedade de pistas e progressão vão sustentar a experiência completa.\n\nE você, estava esperando um novo jogo de corrida de Star Wars? Conta nos comentários e acompanhe o Radar dos Games para mais lançamentos e novidades.'''
          Path('output/auto-script.txt').write_text(script,encoding='utf-8')
          paras=[p for p in script.split('\n\n') if p.strip()]
          titles=['A GALAXIA VAI CORRER','SHADE E A LIGA','VELOCIDADE E VEICULOS','PISTAS DE STAR WARS','COMPETICAO E EVOLUCAO','SEM JEDI. SO VELOCIDADE.','O QUE ESPERAR','RADAR DOS GAMES']
          scenes=[{'title':titles[i],'narration':paras[i],'media_indices':[]} for i in range(len(paras))]
          plan={'topic':'Star Wars: Galactic Racer','source':press,'minimum_assets':3,'media_policy':'STRICT_GALACTIC_RACER_ONLY; direct_official_presskit_videos; minimum_two_real_videos; screenshots_support_only; reject_platform_logos; reject_other_games; no_paid_tools','media':media,'scenes':scenes}
          Path('output/auto-media-plan.json').write_text(json.dumps(plan,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/selected.json').write_text(json.dumps({'title':'Star Wars: Galactic Racer','source':press,'clean_rebuild':True,'media_route':'official_presskit_google_drive'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Narracao Thalita
        run: python src/voice.py output/auto-script.txt output/voice.mp3 --voice pt-BR-ThalitaNeural --segments-json output/voice-timings.json
      - name: Baixar somente material oficial Galactic Racer
        run: python src/media.py output/auto-media-plan.json
      - name: QA visual e de sincronismo antes do render
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/clips.json').read_text())
          spec=json.loads(Path('output/auto-media-plan.json').read_text())
          timing=json.loads(Path('output/voice-timings.json').read_text())
          assets=data.get('assets',[])
          if len(assets)<3:
              raise SystemExit('QUALITY_BLOCK: menos de 3 assets oficiais do Galactic Racer')
          videos=[]
          for a in assets:
              p=str(a.get('path','')).lower();u=str(a.get('url','')).lower();role=str(a.get('role','')).lower();blob=' '.join([p,u,role])
              if any(x in blob for x in ['modernwar','modern-warfare','callofduty','call-of-duty','xbox-logo','playstation-logo']):
                  raise SystemExit('QUALITY_BLOCK: asset irrelevante/de outro jogo detectado')
              if p.endswith(('.mp4','.webm','.mov','.mkv')):
                  videos.append(a)
          if len(videos)<2:
              raise SystemExit(f'QUALITY_BLOCK: apenas {len(videos)} video(s) oficial(is); minimo 2 para evitar slideshow')
          segments=timing.get('segments',timing if isinstance(timing,list) else [])
          if len(segments)!=len(spec['scenes']):
              raise SystemExit(f'QUALITY_BLOCK: {len(segments)} blocos de voz para {len(spec["scenes"])} cenas')
          Path('output/visual-qa.json').write_text(json.dumps({'passed':True,'assets':len(assets),'video_assets':len(videos),'voice_segments':len(segments)},indent=2))
          PY
      - name: Manifesto com video prioritario
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('output/auto-media-plan.json').read_text())
          media=json.loads(Path('output/clips.json').read_text())
          assets=media['assets']
          vids=[int(a['index']) for a in assets if str(a.get('path','')).lower().endswith(('.mp4','.webm','.mov','.mkv'))]
          imgs=[int(a['index']) for a in assets if int(a['index']) not in vids]
          assert len(vids)>=2, 'QUALITY_BLOCK: minimo 2 videos oficiais obrigatorios'
          for i,s in enumerate(spec['scenes']):
              picks=[vids[i%len(vids)],vids[(i+1)%len(vids)]]
              if len(vids)>2:picks.append(vids[(i+2)%len(vids)])
              if imgs:picks.append(imgs[i%len(imgs)])
              s['media_indices']=list(dict.fromkeys(picks))
          Path('output/render.json').write_text(json.dumps({'assets':assets,'voice':'output/voice.mp3','voice_timings':'output/voice-timings.json','intro':'radar-dos-games-intro-oficial.mp4','scenes':spec['scenes'],'output':'output/master.mp4'},ensure_ascii=False,indent=2))
          PY
      - name: Render Master NOVO
        run: python src/render.py output/render.json
      - name: Gerar exatamente 3 Shorts NOVOS
        run: python src/shorts.py output/master.mp4
      - name: Validar exatamente 3 Shorts
        run: |
          python - <<'PY'
          from pathlib import Path
          shorts=list(Path('output').glob('short*.mp4'))+list(Path('output').glob('shorts/*.mp4'))
          uniq={str(x.resolve()) for x in shorts}
          if len(uniq)!=3:
              raise SystemExit(f'QUALITY_BLOCK: esperado exatamente 3 Shorts, encontrados {len(uniq)}')
          PY
      - name: Guardar pacote CLEAN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-star-wars-galactic-racer-CLEAN-2026-10-03-${{ github.run_id }}
          path: output/
          retention-days: 7
