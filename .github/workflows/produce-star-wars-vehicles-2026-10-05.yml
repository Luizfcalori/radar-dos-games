name: Produce Star Wars Galactic Racer Vehicles + 3 Shorts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-star-wars-vehicles-2026-10-05.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp gdown

      - name: Validate official intro
        run: |
          test -s radar-dos-games-intro-oficial.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 radar-dos-games-intro-oficial.mp4

      - name: Build NEW Star Wars vehicles script media plan and metadata
        run: |
          mkdir -p output output/shorts output/media
          cat > output/auto-script.txt <<'TXT'
          Star Wars: Galactic Racer chega amanhã, mas este vídeo não vai repetir a apresentação geral do jogo que já fizemos no Radar dos Games. Agora o foco é outro: os quatro tipos de veículo e como cada um muda completamente a forma de correr na Galactic League.

          O podracer é a escolha para quem quer velocidade bruta. Os motores usam ramjets para alcançar velocidades ainda maiores, enquanto o airbrake ajuda nas curvas apertadas, mas cobra um preço alto: quando você freia demais, perde muita velocidade. É uma máquina para reflexos rápidos e decisões precisas.

          O skim speeder segue por outro caminho. Ele acelera mais devagar, mas mistura resistência e agilidade. Seu movimento Knife Edge ajuda nas curvas mais fechadas, e o jogador precisa combinar ramjets e afterburners no momento certo. É menos explosivo na largada, porém muito perigoso quando ganha ritmo.

          Já a speeder bike sacrifica proteção em troca de velocidade e resposta. O Kinetic Burst entrega um impulso temporário ainda mais forte, mas reduz o controle e pode abrir demais as curvas. Como a estrutura é leve e pouco protegida, um erro custa caro. É o tipo de veículo para quem aceita correr no limite.

          O landspeeder é praticamente o oposto. Ele é mais estável, aguenta melhor impactos e favorece o drift. Não é o mais rápido, mas a combinação de controle, durabilidade e um ramjet bem usado faz dele uma ótima porta de entrada para a Galactic League e uma opção mais segura para aprender as pistas.

          A diferença entre os veículos fica ainda mais interessante porque Galactic Racer não é só uma sequência de corridas soltas. O jogo traz modos Campaign, Scenario e Arcade. Na campanha, a estrutura é baseada em runs: você escolhe eventos, desbloqueia melhorias e, se quebrar demais, precisa recomeçar a turnê. Parte dos benefícios conquistados permanece para a próxima tentativa.

          No online, a versão de PlayStation confirma suporte para até doze jogadores. Isso significa que dominar apenas um veículo pode não ser suficiente: dependendo da pista, do traçado e dos rivais, trocar de estilo pode ser a diferença entre controlar a corrida ou ficar para trás.

          Então a pergunta para Galactic Racer não é apenas qual veículo é mais rápido. É qual combina melhor com a sua forma de jogar: podracer para velocidade extrema, skim speeder para equilíbrio, speeder bike para risco e agilidade, ou landspeeder para estabilidade. Amanhã, com o lançamento, vamos poder ver qual deles realmente domina a pista.
          TXT

          cat > output/auto-media-plan.json <<'JSON'
          {
            "minimum_assets": 6,
            "minimum_video_assets": 3,
            "minimum_unique_video_seconds": 150,
            "minimum_image_assets": 3,
            "media": [
              {
                "type":"video",
                "url":"https://drive.google.com/file/d/1SGa4yvXHEAAiRCvb8rMwjMADwYegHcsL/view?usp=drive_link",
                "role":"official_release_date_reveal",
                "source_proof":"Star Wars Galactic Racer official press kit",
                "max_assets":1,
                "min_duration":25
              },
              {
                "type":"video",
                "url":"https://drive.google.com/file/d/1R7LnTIQ8skZounI0u3uvpnNd916DSGtr/view?usp=drive_link",
                "role":"official_gameplay_trailer",
                "source_proof":"Star Wars Galactic Racer official press kit",
                "max_assets":1,
                "min_duration":25
              },
              {
                "type":"video",
                "url":"https://drive.google.com/file/d/181vKmDj2eEBnTfp6DXwagUE9J7P12RJ6/view?usp=drive_link",
                "role":"official_reveal_trailer",
                "source_proof":"Star Wars Galactic Racer official press kit",
                "max_assets":1,
                "min_duration":25
              },
              {
                "type":"image",
                "url":"https://lumiere-a.akamaihd.net/v1/images/star-wars-galactic-racer-vehicle-guide-podracers-featur_c1a295b4.jpeg?region=0%2C0%2C1600%2C900",
                "role":"official_podracer_vehicle_guide",
                "source_proof":"StarWars.com official vehicle guide",
                "max_assets":1
              },
              {
                "type":"image",
                "url":"https://lumiere-a.akamaihd.net/v1/images/star-wars-galactic-racer-story-trailer-sgf-002_a4ac22a1.jpeg?region=0%2C0%2C1920%2C1080",
                "role":"official_story_shade",
                "source_proof":"StarWars.com official story trailer article",
                "max_assets":1
              },
              {
                "type":"image",
                "url":"https://lumiere-a.akamaihd.net/v1/images/star-wars-galactic-racer-story-trailer-sgf-006_2d56c643.jpeg?region=0%2C0%2C1920%2C1080",
                "role":"official_racing_cockpit",
                "source_proof":"StarWars.com official story trailer article",
                "max_assets":1
              }
            ],
            "scenes": [
              {"paragraph":1,"title":"4 VEÍCULOS, 4 ESTILOS","subtitle":"UM NOVO FOCO EM GALACTIC RACER","media_indices":[1,4]},
              {"paragraph":2,"title":"PODRACER","subtitle":"VELOCIDADE EXTREMA • AIRBRAKE","media_indices":[2,4]},
              {"paragraph":3,"title":"SKIM SPEEDER","subtitle":"EQUILÍBRIO • KNIFE EDGE","media_indices":[3,5]},
              {"paragraph":4,"title":"SPEEDER BIKE","subtitle":"RISCO • KINETIC BURST","media_indices":[1,6]},
              {"paragraph":5,"title":"LANDSPEEDER","subtitle":"ESTABILIDADE • DRIFT • DURABILIDADE","media_indices":[2,5]},
              {"paragraph":6,"title":"CAMPANHA, SCENARIO E ARCADE","subtitle":"RUNS, ESCOLHAS E PROGRESSÃO","media_indices":[3,6]},
              {"paragraph":7,"title":"ATÉ 12 JOGADORES ONLINE","subtitle":"A CORRIDA MUDA COM OS RIVAIS","media_indices":[1,2]},
              {"paragraph":8,"title":"QUAL COMBINA COM VOCÊ?","subtitle":"RADAR DOS GAMES","media_indices":[4,2]}
            ]
          }
          JSON

          python - <<'PY'
          import json
          from pathlib import Path
          official='https://www.starwars.com/news/star-wars-galactic-racer-vehicle-guide'
          story='https://www.starwars.com/news/star-wars-galactic-racer-story-trailer'
          ps='https://store.playstation.com/pt-br/concept/10014146/'
          tags=['Radar dos Games','Star Wars','Galactic Racer','Podracer','Speeder Bike','Landspeeder','Skim Speeder','PS5','Xbox','PC']
          master={
            'title':'Star Wars Galactic Racer: 4 veículos que mudam completamente a corrida',
            'description':'🎮 Star Wars: Galactic Racer chega amanhã e agora o Radar dos Games explica os quatro estilos de veículo: Podracer, Skim Speeder, Speeder Bike e Landspeeder. Também mostramos como funcionam Campaign, Scenario, Arcade e o multiplayer para até 12 jogadores.\n\n🔎 Fontes oficiais:\n'+official+'\n'+story+'\n'+ps+'\n\n#StarWars #GalacticRacer #RadarDosGames #Podracer',
            'tags':tags,'privacy':'unlisted','containsSyntheticMedia':True,'thumbnail':'output/thumbnail.jpg'
          }
          shorts=[
            {'title':'Galactic Racer: por que o PODRACER é tão difícil? #Shorts','description':'Ramjets, airbrake e velocidade extrema: o Podracer exige reflexos rápidos em Star Wars: Galactic Racer.\n\nFonte oficial: '+official+'\n\n#StarWars #GalacticRacer #Podracer #RadarDosGames #Shorts','tags':tags+['Shorts'],'privacy':'unlisted','containsSyntheticMedia':True},
            {'title':'4 veículos de Galactic Racer: qual combina com você? #Shorts','description':'Podracer, Skim Speeder, Speeder Bike e Landspeeder mudam totalmente o estilo de corrida.\n\nFonte oficial: '+official+'\n\n#StarWars #GalacticRacer #RadarDosGames #Shorts','tags':tags+['Shorts'],'privacy':'unlisted','containsSyntheticMedia':True},
            {'title':'Galactic Racer tem campanha, Arcade e até 12 online #Shorts','description':'Galactic Racer mistura campanha baseada em runs, Scenario, Arcade e multiplayer para até 12 jogadores.\n\nFontes oficiais: '+story+' '+ps+'\n\n#StarWars #GalacticRacer #RadarDosGames #Shorts','tags':tags+['Shorts'],'privacy':'unlisted','containsSyntheticMedia':True}
          ]
          old={'Star Wars: Galactic Racer | A galáxia vai correr','Galactic Racer | Competição e evolução em alta velocidade','Star Wars voltou às grandes corridas? | Galactic Racer'}
          assert master['title'] not in old
          assert not any(x['title'].replace(' #Shorts','') in old for x in shorts)
          Path('output/master-youtube.json').write_text(json.dumps(master,ensure_ascii=False,indent=2),encoding='utf-8')
          for i,x in enumerate(shorts,1): Path(f'output/short-{i}-youtube.json').write_text(json.dumps(x,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Create Thalita Multilingual PT-BR narration
        run: |
          python src/voice.py output/auto-script.txt output/voice.mp3 --voice pt-BR-ThalitaMultilingualNeural --segments-json output/voice-timings.json

      - name: Download official Galactic Racer media
        run: python src/media.py output/auto-media-plan.json

      - name: Build render manifest from approved media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('output/auto-media-plan.json').read_text(encoding='utf-8'))
          media=json.loads(Path('output/clips.json').read_text(encoding='utf-8'))
          assets=[a for a in media.get('assets',[]) if a.get('approved')]
          videos=[a for a in assets if a.get('type')=='video']
          images=[a for a in assets if a.get('type')=='image']
          assert len(videos)>=3, f'QUALITY_BLOCK videos={len(videos)}'
          assert len(images)>=3, f'QUALITY_BLOCK images={len(images)}'
          assert media.get('unique_video_seconds',0)>=150, media.get('unique_video_seconds')
          ok=[int(a['index']) for a in assets]
          scenes=spec['scenes']
          for i,scene in enumerate(scenes):
              preferred=scene.get('media_indices') or []
              valid=[x for x in preferred if x in ok]
              if not valid:
                  valid=[ok[i%len(ok)],ok[(i+1)%len(ok)]]
              scene['media_indices']=valid
          manifest={'assets':assets,'voice':'output/voice.mp3','voice_timings':'output/voice-timings.json','intro':'radar-dos-games-intro-oficial.mp4','scenes':scenes,'output':'output/master.mp4'}
          Path('output/render.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Render Master approved style
        run: python src/render.py output/render.json

      - name: Create official-image thumbnail
        run: |
          python - <<'PY'
          import urllib.request
          url='https://lumiere-a.akamaihd.net/v1/images/star-wars-galactic-racer-vehicle-guide-podracers-featur_c1a295b4.jpeg?region=0%2C0%2C1600%2C900'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r, open('output/star-wars-vehicles-official.jpg','wb') as f:
              f.write(r.read())
          PY
          python src/thumbnail.py output/master.mp4 'STAR WARS: 4 VEÍCULOS, 4 ESTILOS' output/thumbnail.jpg output/star-wars-vehicles-official.jpg

      - name: Generate 3 NEW Shorts
        run: python src/shorts.py output/master.mp4

      - name: Final QA and novelty guard
        run: |
          python - <<'PY'
          import glob,json,subprocess
          from pathlib import Path
          def probe(p): return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          master=Path('output/master.mp4'); assert master.exists() and master.stat().st_size>3_000_000
          m=probe(master); md=float(m['format']['duration']); mv=next(x for x in m['streams'] if x['codec_type']=='video')
          assert (int(mv['width']),int(mv['height']))==(1920,1080)
          assert 100<=md<=420, md
          assert any(x['codec_type']=='audio' for x in m['streams'])
          qa=json.loads(Path('output/qa.json').read_text(encoding='utf-8'))
          assert qa['card_style']['shadow_attached_to_text'] is True
          assert qa['voice']=='pt-BR-ThalitaMultilingualNeural'
          script=Path('output/auto-script.txt').read_text(encoding='utf-8').lower()
          for old in ['a galáxia vai correr','competição e evolução em alta velocidade','sem jedi. só velocidade']:
              assert old not in script, f'QUALITY_BLOCK duplicate angle: {old}'
          thumb=Path('output/thumbnail.jpg'); assert thumb.exists() and thumb.stat().st_size>30000
          shorts=sorted(glob.glob('output/shorts/short_*.mp4')); assert len(shorts)==3
          report=[]
          for p in shorts:
              q=probe(p); d=float(q['format']['duration']); v=next(x for x in q['streams'] if x['codec_type']=='video')
              assert (int(v['width']),int(v['height']))==(1080,1920)
              assert 10<=d<=65
              assert any(x['codec_type']=='audio' for x in q['streams'])
              report.append({'file':p,'seconds':round(d,2)})
          out={'master_seconds':round(md,2),'master':'1920x1080','shorts':report,'thumbnail':'1280x720','topic_angle':'vehicles_and_modes_not_previous_overview','status':'APPROVED'}
          Path('output/final-qa.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload final NEW Star Wars package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-wars-galactic-racer-vehicles-${{ github.run_id }}
          path: |
            output/auto-script.txt
            output/auto-media-plan.json
            output/clips.json
            output/voice.mp3
            output/voice-timings.json
            output/master.mp4
            output/thumbnail.jpg
            output/thumbnail-policy.json
            output/qa.json
            output/final-qa.json
            output/shorts/*.mp4
            output/*youtube*.json
          retention-days: 7
