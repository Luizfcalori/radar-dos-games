name: Radar dos Games - Dragon Dogma 2026-10-03
# rerun 2026-10-03 dynamic scenes v4
on:
  push:
    paths:
      - '.github/workflows/run-now-2026-10-03-dragons-dogma.yml'
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp
      - name: Validar intro oficial
        run: test -s radar-dos-games-intro-oficial.mp4
      - name: Preparar pauta Dragon Dogma com fontes oficiais diretas
        run: |
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          source='https://www.capcom.co.jp/ir/english/news/html/e260610.html'
          official_site='https://www.dragonsdogma.com/2/pt-br/'
          media=[
            {'type':'video','url':official_site,'role':'official_dragons_dogma_2_ptbr_site_priority'},
            {'type':'video','url':'https://captown.capcom.com/en/theaters/dragonsdogma/57','role':'official_announcement_trailer'}
          ]
          script='''Dragon’s Dogma 2: Dark Arisen está a poucos dias do lançamento, marcado para 9 de outubro de 2026. A nova fase de Dragon’s Dogma 2 coloca novamente o Arisen no centro de uma aventura de fantasia, com foco em exploração, combate e a companhia dos Pawns.\n\nPara o Radar dos Games, o ponto principal é o que essa expansão pode representar para quem já terminou a campanha original: um motivo para voltar ao mundo do jogo, experimentar novas batalhas e revisitar as vocações com uma progressão renovada.\n\nO combate continua sendo a grande vitrine de Dragon’s Dogma 2. Monstros enormes, escalada durante as lutas e combinações entre Arisen e Pawns são exatamente o tipo de experiência que pode ganhar novo fôlego com conteúdo adicional.\n\nTambém vale observar o desempenho e as melhorias acumuladas desde o lançamento do jogo base. Para muita gente, estabilidade e qualidade de vida serão tão importantes quanto novas áreas, inimigos e equipamentos.\n\nA proximidade do lançamento coloca Dark Arisen entre os assuntos mais interessantes desta semana para fãs de RPG de ação. O Radar dos Games vai acompanhar as informações oficiais e separar novidade real de expectativa.\n\nE você: voltaria para Dragon’s Dogma 2 por uma grande expansão? Conta nos comentários e acompanhe o Radar dos Games para mais notícias e lançamentos.'''
          Path('output/auto-script.txt').write_text(script,encoding='utf-8')
          paras=[p for p in script.split('\n\n') if p.strip()]
          titles=['LANÇAMENTO','DE VOLTA À AVENTURA','COMBATE','DESEMPENHO','O QUE ESPERAR','RADAR DOS GAMES']
          scenes=[{'title':titles[i], 'narration':p, 'media_indices':[]} for i,p in enumerate(paras)]
          plan={'topic':"Dragon's Dogma 2: Dark Arisen",'source':source,'official_site':official_site,'minimum_assets':2,'media_policy':'official_only; prioritize_dragonsdogma_site; no_paid_tools; require_real_video','media':media,'scenes':scenes}
          Path('output/auto-media-plan.json').write_text(json.dumps(plan,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/selected.json').write_text(json.dumps({'title':"Dragon's Dogma 2: Dark Arisen",'source':source,'official_site':official_site,'release_date':'2026-10-09'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Narracao Thalita
        run: python src/voice.py output/auto-script.txt output/voice.mp3 --voice pt-BR-ThalitaNeural --segments-json output/voice-timings.json
      - name: Midia oficial com fallbacks gratuitos
        run: python src/media.py output/auto-media-plan.json
      - name: Manifesto dinamico alinhado a voz
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('output/auto-media-plan.json').read_text())
          media=json.loads(Path('output/clips.json').read_text())
          timings=json.loads(Path('output/voice-timings.json').read_text())
          assets=media['assets']; videos=[a for a in assets if a['type']=='video']; ok=[int(a['index']) for a in videos]
          assert len(ok)>=2 and media.get('video_assets',0)>=2
          n=len(timings) if isinstance(timings,list) else len(timings.get('segments',[]))
          scenes=spec['scenes'][:n]
          assert len(scenes)==n, f'cenas {len(scenes)} != voz {n}'
          for i,s in enumerate(scenes):
              s['media_indices']=[ok[i%len(ok)],ok[(i+1)%len(ok)]]
          Path('output/render.json').write_text(json.dumps({'assets':assets,'voice':'output/voice.mp3','voice_timings':'output/voice-timings.json','intro':'radar-dos-games-intro-oficial.mp4','scenes':scenes,'output':'output/master.mp4'},ensure_ascii=False,indent=2))
          PY
      - name: Render Master
        run: python src/render.py output/render.json
      - name: Gerar 3 Shorts
        run: python src/shorts.py output/master.mp4
      - name: Guardar pacote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-dragons-dogma-2026-10-03-${{ github.run_id }}
          path: output/
          retention-days: 7
