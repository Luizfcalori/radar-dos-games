name: Radar dos Games - Daily Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema opcional; AUTO deixa o pipeline escolher"
        required: false
        default: "AUTO"
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: write

concurrency:
  group: radar-dos-games-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas gratuitas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp
      - name: Pesquisar pautas atuais
        run: python src/research.py
      - name: Preparar pipeline seguro
        env:
          RADAR_TOPIC: ${{ github.event.inputs.topic || 'AUTO' }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: python src/pipeline.py --topic "$RADAR_TOPIC"
      - name: Verificar configuração do YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: python src/check_youtube.py
      - name: Guardar pesquisa e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-daily-${{ github.run_id }}
          path: output/
          retention-days: 7
