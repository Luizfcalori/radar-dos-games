name: GTA6 08 Oct Stage Master and 3 Shorts Private
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta6-stage-youtube-2026-10-08.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gta6-stage-youtube-20261008
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install YouTube client
        run: pip install google-api-python-client==2.184.0 google-auth==2.41.1
      - name: Download reviewed GTA6 media; keep isolated from daily workflows
        uses: actions/download-artifact@v4
        with:
          name: gta6-cyberleek-2026-10-08-review-37812102922
          path: gta6
          github-token: ${{ github.token }}
          repository: Luizfcalori/radar-dos-games
          run-id: 37812102922
      - name: Stage privately, prevent duplicates, verify channel and status
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,time
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          expected='UCSZJZE-E10SVdx42wrDeWhw'
          required=('YT_CLIENT_ID','YT_CLIENT_SECRET','YT_REFRESH_TOKEN')
          if not all(os.environ.get(x) for x in required):
              raise RuntimeError('YouTube OAuth secrets missing')
          creds=Credentials(None,refresh_token=os.environ['YT_REFRESH_TOKEN'],
            token_uri='https://oauth2.googleapis.com/token',
            client_id=os.environ['YT_CLIENT_ID'],
            client_secret=os.environ['YT_CLIENT_SECRET'],
            scopes=['https://www.googleapis.com/auth/youtube.upload','https://www.googleapis.com/auth/youtube.readonly'])
          yt=build('youtube','v3',credentials=creds)
          channels=yt.channels().list(part='id,snippet,contentDetails',mine=True).execute().get('items',[])
          if len(channels)!=1 or channels[0]['id']!=expected or channels[0]['snippet']['title'].strip().casefold()!='radar dos games':
              raise RuntimeError('Wrong YouTube channel: upload blocked')
          uploads=channels[0]['contentDetails']['relatedPlaylists']['uploads']
          existing={}
          token=None
          for _ in range(5):
              result=yt.playlistItems().list(part='snippet,contentDetails',playlistId=uploads,maxResults=50,pageToken=token).execute()
              for item in result.get('items',[]):
                  title=item.get('snippet',{}).get('title','').strip().casefold()
                  vid=item.get('contentDetails',{}).get('videoId')
                  if title and vid: existing[title]=vid
              token=result.get('nextPageToken')
              if not token: break
          root=Path('gta6')
          def locate(rel):
              candidates=[root/rel,root/'output'/rel]
              for p in candidates:
                  if p.is_file() and p.stat().st_size: return p
              raise RuntimeError(f'Missing reviewed file: {rel}')
          jobs=[
              ('master','master.mp4','master-youtube.json','thumbnail.jpg'),
              ('short1','shorts/short_1.mp4','short-1-youtube.json','shorts/short_1_cover.jpg'),
              ('short2','shorts/short_2.mp4','short-2-youtube.json','shorts/short_2_cover.jpg'),
              ('short3','shorts/short_3.mp4','short-3-youtube.json','shorts/short_3_cover.jpg'),
          ]
          results=[]
          for key,video,metadata,cover in jobs:
              meta=json.loads(locate(metadata).read_text(encoding='utf-8'))
              title=meta['title'].strip()
              vid=existing.get(title.casefold())
              if vid:
                  v=yt.videos().list(part='snippet,status',id=vid).execute().get('items',[])
                  if not v or v[0]['snippet']['channelId']!=expected or v[0]['snippet']['title'].strip()!=title:
                      raise RuntimeError('Existing upload mismatch for '+key)
                  print('EXISTING_VIDEO',key,vid)
              else:
                  request=yt.videos().insert(part='snippet,status',
                    body={'snippet':{'title':title,'description':meta['description'],
                      'tags':meta.get('tags',[]),'categoryId':'20'},
                      'status':{'privacyStatus':'private','selfDeclaredMadeForKids':False,
                      'containsSyntheticMedia':bool(meta.get('containsSyntheticMedia',True))}},
                    media_body=MediaFileUpload(str(locate(video)),chunksize=8*1024*1024,resumable=True))
                  response=None
                  while response is None:
                      _,response=request.next_chunk()
                  vid=response['id']; existing[title.casefold()]=vid
                  print('UPLOADED_PRIVATE',key,vid)
              if not vid: raise RuntimeError('No video id for '+key)
              # Existing archive covers are temporary staging artwork; approved newly generated covers
              # must be applied before public scheduling.
              v=yt.videos().list(part='snippet,status',id=vid).execute()['items'][0]
              if v['status']['privacyStatus']!='private': raise RuntimeError('Not private: '+key)
              row={'key':key,'id':vid,'url':'https://youtu.be/'+vid,'title':title,
                'privacy':'private','scheduled':False,'newColorCoversApplied':False}
              results.append(row)
              print('STAGED',json.dumps(row,ensure_ascii=False))
              Path('gta6-staged-report.json').write_text(json.dumps(results,indent=2,ensure_ascii=False),encoding='utf-8')
          if len(results)!=4: raise RuntimeError('Not all four videos staged')
          print('ALL_4_STAGED_PRIVATE_PENDING_NEW_COVERS_AND_RESCHEDULE')
          PY
      - name: Keep staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-private-staging-${{ github.run_id }}
          path: gta6-staged-report.json
          retention-days: 7
          if-no-files-found: warn
