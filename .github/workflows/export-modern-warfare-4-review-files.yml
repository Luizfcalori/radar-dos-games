name: Export Modern Warfare 4 Strict Review Files

on:
  push:
    paths:
      - '.github/workflows/export-modern-warfare-4-review-files.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar pacote STRICT do run 37142818570
        uses: actions/download-artifact@v4
        with:
          name: radar-modern-warfare-4-STRICT-2026-10-03-37142818570
          path: bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Luizfcalori/radar-dos-games
          run-id: 37142818570

      - name: Localizar e preparar arquivos finais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review
          MASTER=$(find bundle -type f -name 'master.mp4' | head -1)
          SHORT1=$(find bundle -type f -path '*/shorts/short_1.mp4' | head -1)
          SHORT2=$(find bundle -type f -path '*/shorts/short_2.mp4' | head -1)
          SHORT3=$(find bundle -type f -path '*/shorts/short_3.mp4' | head -1)
          THUMB=$(find bundle -type f -name 'thumbnail.jpg' | head -1)
          test -s "$MASTER" && test -s "$SHORT1" && test -s "$SHORT2" && test -s "$SHORT3" && test -s "$THUMB"
          MSIZE=$(stat -c%s "$MASTER")
          if [ "$MSIZE" -lt 480000000 ]; then
            cp "$MASTER" review/Modern_Warfare_4_STRICT_MASTER.mp4
          else
            ffmpeg -y -v warning -i "$MASTER" -vf "scale=-2:720" -c:v libx264 -preset veryfast -crf 25 -c:a aac -b:a 160k -movflags +faststart review/Modern_Warfare_4_STRICT_MASTER_REVIEW_720p.mp4
          fi
          cp "$SHORT1" review/Modern_Warfare_4_STRICT_SHORT_1.mp4
          cp "$SHORT2" review/Modern_Warfare_4_STRICT_SHORT_2.mp4
          cp "$SHORT3" review/Modern_Warfare_4_STRICT_SHORT_3.mp4
          cp "$THUMB" review/Modern_Warfare_4_STRICT_THUMBNAIL.jpg
          ls -lh review

      - name: Upload Master separado
        uses: actions/upload-artifact@v4
        with:
          name: mw4-strict-master-review
          path: review/*MASTER*.mp4
          compression-level: 0
          retention-days: 7

      - name: Upload Short 1 separado
        uses: actions/upload-artifact@v4
        with:
          name: mw4-strict-short-1
          path: review/Modern_Warfare_4_STRICT_SHORT_1.mp4
          compression-level: 0
          retention-days: 7

      - name: Upload Short 2 separado
        uses: actions/upload-artifact@v4
        with:
          name: mw4-strict-short-2
          path: review/Modern_Warfare_4_STRICT_SHORT_2.mp4
          compression-level: 0
          retention-days: 7

      - name: Upload Short 3 separado
        uses: actions/upload-artifact@v4
        with:
          name: mw4-strict-short-3
          path: review/Modern_Warfare_4_STRICT_SHORT_3.mp4
          compression-level: 0
          retention-days: 7

      - name: Upload thumbnail separada
        uses: actions/upload-artifact@v4
        with:
          name: mw4-strict-thumbnail
          path: review/Modern_Warfare_4_STRICT_THUMBNAIL.jpg
          compression-level: 0
          retention-days: 7
