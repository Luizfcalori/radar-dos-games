name: Radar dos Games - Gears E-Day Launch Special 2026-10-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-gears-launch-special-2026-10-06.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp gdown

      - name: Validate official intro
        run: |
          test -s radar-dos-games-intro-oficial.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 radar-dos-games-intro-oficial.mp4

      - name: Build launch-day editorial package
        run: |
          rm -rf output
          mkdir -p output output/shorts output/media
          python src/gears_launch_special_2026_10_06.py

      - name: Create Thalita Multilingual PT-BR narration
        run: |
          python src/voice.py output/auto-script.txt output/voice.mp3 \
            --voice pt-BR-ThalitaMultilingualNeural \
            --segments-json output/voice-timings.json

      - name: Download official Steam media
        run: python src/media.py output/auto-media-plan.json

      - name: Build strict render manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('output/auto-media-plan.json').read_text(encoding='utf-8'))
          clips=json.loads(Path('output/clips.json').read_text(encoding='utf-8'))
          assets=clips['assets']
          videos=[a for a in assets if a['type']=='video']
          images=[a for a in assets if a['type']=='image']
          if len(videos)<2: raise RuntimeError(f'QUALITY_BLOCK: official videos={len(videos)}')
          if len(images)<8: raise RuntimeError(f'QUALITY_BLOCK: official images={len(images)}')
          if float(clips.get('unique_video_seconds',0))<90: raise RuntimeError('QUALITY_BLOCK: insufficient official video seconds')
          scenes=spec['scenes']
          for i,scene in enumerate(scenes):
              v=videos[i % len(videos)]
              im=images[(i*2) % len(images)]
              scene['media_indices']=[int(v['index']),int(im['index'])]
          Path('output/auto-media-plan.json').write_text(json.dumps(spec,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/render.json').write_text(json.dumps({
             'assets':assets,
             'voice':'output/voice.mp3',
             'voice_timings':'output/voice-timings.json',
             'intro':'radar-dos-games-intro-oficial.mp4',
             'scenes':scenes,
             'output':'output/master.mp4'
          },ensure_ascii=False,indent=2),encoding='utf-8')
          # Use a real official screenshot as the editorial cover source.
          cover=max(images,key=lambda a:int(a.get('width',0))*int(a.get('height',0)))
          Path('output/cover-source.txt').write_text(cover['path'],encoding='utf-8')
          print(json.dumps({'videos':len(videos),'images':len(images),'unique_video_seconds':clips.get('unique_video_seconds')},ensure_ascii=False))
          PY

      - name: Render Master approved Radar style
        run: python src/render.py output/render.json

      - name: Create Master thumbnail
        run: |
          COVER=$(cat output/cover-source.txt)
          python src/thumbnail.py output/master.mp4 'GEARS E-DAY CHEGOU!' output/thumbnail.jpg "$COVER"

      - name: Generate 3 Shorts without cutting speech
        run: python src/shorts.py output/master.mp4

      - name: Create vertical covers for all Shorts
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageEnhance,ImageFilter,ImageFont,ImageOps
          W,H=1080,1920
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          titles=[
            ('GEARS E-DAY','VOLTOU A SER BRUTAL'),
            ('DIA DA EMERGÊNCIA','A INVASÃO LOCUST'),
            ('VALE A PENA?','GEARS E-DAY NO LANÇAMENTO')
          ]
          def font(size): return ImageFont.truetype(FONT,size)
          def fit(draw,text,width,start=86,minimum=42):
              for size in range(start,minimum-1,-2):
                  ft=font(size); b=draw.textbbox((0,0),text,font=ft,stroke_width=4)
                  if b[2]-b[0]<=width: return ft
              return font(minimum)
          out=Path('output/shorts')
          for i in range(1,4):
              video=out/f'short_{i}.mp4'
              frame=out/f'.short_{i}_cover_frame.jpg'
              subprocess.run(['ffmpeg','-y','-v','error','-ss','2.0','-i',str(video),'-frames:v','1','-q:v','2',str(frame)],check=True)
              with Image.open(frame) as src:
                  bg=ImageOps.fit(src.convert('RGB'),(W,H),method=Image.Resampling.LANCZOS)
              bg=ImageEnhance.Contrast(bg.filter(ImageFilter.GaussianBlur(5))).enhance(1.12).convert('RGBA')
              shade=Image.new('RGBA',(W,H),(0,0,0,0)); sd=ImageDraw.Draw(shade,'RGBA')
              sd.rectangle((0,0,W,H),fill=(0,0,0,65))
              sd.rectangle((0,0,W,170),fill=(3,7,20,235))
              sd.rectangle((62,1170,1018,1555),fill=(0,0,0,210))
              sd.rectangle((62,1170,78,1555),fill=(225,45,45,255))
              bg=Image.alpha_composite(bg,shade); d=ImageDraw.Draw(bg,'RGBA')
              d.text((48,58),'RADAR DOS GAMES',font=font(42),fill=(255,255,255,255),stroke_width=2,stroke_fill=(0,0,0,190))
              main,sub=titles[i-1]; mf=fit(d,main,820,94,54); sf=fit(d,sub,820,68,40)
              d.text((108,1240),main,font=mf,fill=(255,255,255,255),stroke_width=5,stroke_fill=(0,0,0,230))
              d.text((108,1380),sub,font=sf,fill=(255,185,80,255),stroke_width=4,stroke_fill=(0,0,0,230))
              d.text((108,1500),'GEARS OF WAR • E-DAY',font=font(32),fill=(255,255,255,235),stroke_width=2,stroke_fill=(0,0,0,180))
              d.rectangle((0,H-18,W,H),fill=(225,45,45,255))
              cover=out/f'short_{i}_cover.jpg'
              bg.convert('RGB').save(cover,'JPEG',quality=95,subsampling=0)
              frame.unlink(missing_ok=True)
          PY

      - name: Final QA Gears launch special
        run: |
          python - <<'PY'
          import glob,json,subprocess
          from pathlib import Path
          from PIL import Image
          def probe(p):
              return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          master=Path('output/master.mp4')
          assert master.exists() and master.stat().st_size>5_000_000
          m=probe(master); md=float(m['format']['duration']); mv=next(x for x in m['streams'] if x['codec_type']=='video')
          assert (int(mv['width']),int(mv['height']))==(1920,1080)
          assert 330<=md<=650, md
          assert any(x['codec_type']=='audio' for x in m['streams'])
          qa=json.loads(Path('output/qa.json').read_text(encoding='utf-8'))
          assert qa['card_style']['shadow_attached_to_text'] is True
          assert qa['voice']=='pt-BR-ThalitaMultilingualNeural'
          assert len(qa['scenes'])==11
          assert all(x['all_assets_explicit'] for x in qa['scenes'])
          assert all(x['gameplay_first'] for x in qa['scenes'])
          clips=json.loads(Path('output/clips.json').read_text(encoding='utf-8'))
          assert clips.get('video_assets',0)>=2
          assert clips.get('image_assets',0)>=8
          assert float(clips.get('unique_video_seconds',0))>=90
          thumb=Path('output/thumbnail.jpg')
          assert thumb.exists() and thumb.stat().st_size>30000
          with Image.open(thumb) as im: assert im.size==(1280,720)
          shorts=sorted(glob.glob('output/shorts/short_*.mp4'))
          assert len(shorts)==3
          sm=json.loads(Path('output/shorts/manifest.json').read_text(encoding='utf-8'))
          assert len(sm.get('shorts',[]))==3
          assert all(x.get('boundary_policy')=='voice_segment_complete' for x in sm['shorts']), sm
          report=[]
          for i,p in enumerate(shorts,1):
              q=probe(p); d=float(q['format']['duration']); v=next(x for x in q['streams'] if x['codec_type']=='video')
              assert (int(v['width']),int(v['height']))==(1080,1920)
              assert 20<=d<=120,(p,d)
              assert any(x['codec_type']=='audio' for x in q['streams'])
              cover=Path(f'output/shorts/short_{i}_cover.jpg')
              assert cover.exists() and cover.stat().st_size>30000
              with Image.open(cover) as im: assert im.size==(1080,1920)
              report.append({'file':p,'seconds':round(d,2),'cover':str(cover)})
          out={
            'master_seconds':round(md,2),
            'master':'1920x1080',
            'script_words':len(Path('output/auto-script.txt').read_text(encoding='utf-8').split()),
            'official_video_assets':clips['video_assets'],
            'official_image_assets':clips['image_assets'],
            'unique_video_seconds':clips['unique_video_seconds'],
            'shorts':report,
            'thumbnail':'1280x720',
            'shorts_complete_speech':True,
            'voice':'pt-BR-ThalitaMultilingualNeural',
            'status':'APPROVED'
          }
          Path('output/final-qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload final Gears package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-gears-eday-launch-2026-10-06-${{ github.run_id }}
          path: |
            output/auto-script.txt
            output/auto-media-plan.json
            output/clips.json
            output/voice.mp3
            output/voice-timings.json
            output/master.mp4
            output/thumbnail.jpg
            output/qa.json
            output/final-qa.json
            output/shorts/*.mp4
            output/shorts/*_cover.jpg
            output/shorts/manifest.json
            output/selected.json
            output/render.json
            output/*youtube*.json
          retention-days: 7

# rerun: fix-11-scenes
