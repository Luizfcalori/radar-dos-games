name: Radar TikTok - Verify Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-tiktok-recovery-from-drive.yml'
      - 'data/tiktok_queue.json'
      - 'data/tiktok_backfill_report.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovery report and media-backed queue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          queue=json.loads(Path('data/tiktok_queue.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/tiktok_backfill_report.json').read_text(encoding='utf-8'))
          items=queue.get('items') or []
          by_id={str(x.get('youtube_id')):x for x in items if x.get('youtube_id')}

          missing=[
              x for x in items
              if x.get('youtube_id') and not str(x.get('media_url') or '').strip()
          ]
          missing_ids={str(x.get('youtube_id')) for x in missing}
          reported_ids={str(x.get('youtube_id')) for x in (report.get('remaining') or [])}

          assert report.get('remaining_count')==len(missing), {
              'report_remaining_count':report.get('remaining_count'),
              'actual_missing':len(missing)
          }
          assert reported_ids==missing_ids, {
              'report_ids':sorted(reported_ids),
              'queue_missing_ids':sorted(missing_ids)
          }

          # No item without an MP4 may remain approved/ready for posting.
          unsafe=[
              x for x in missing
              if x.get('status') in ('approved','ready_for_tiktok')
          ]
          assert not unsafe, unsafe

          # Three Resident Evil Shorts were restored from the original approved
          # production artifact; verify their exact permanent asset references.
          recovered={
              'xDCHua1DjJg':'resident-evil-requiem-levou-o-premio-mais-importante-de-43929326588-short-1',
              'wFuquyQt9-w':'resident-evil-requiem-levou-o-premio-mais-importante-de-43929326588-short-2',
              'GS36QlnZiFw':'resident-evil-requiem-levou-o-premio-mais-importante-de-43929326588-short-3',
          }
          for video_id,stem in recovered.items():
              item=by_id.get(video_id)
              assert item, f'missing queue item {video_id}'
              assert item.get('media_url','').endswith(stem+'.mp4'), item
              assert item.get('thumbnail_url','').endswith(stem+'.jpg'), item

          print(json.dumps({
              'queue_total':len(items),
              'media_missing':len(missing),
              'media_missing_ids':sorted(missing_ids),
              'resident_evil_recovered':len(recovered),
              'report_consistent':True,
          },ensure_ascii=False,indent=2))
          PY

      - name: Verify permanent recovered assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view tiktok-youtube-shorts --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/assets.txt
          for id in DFMjasmIOSw t-KVaCwbrbA dvu_iLOeRds hjCBW6wopN8 Lc3BXMSZanU S-Kw8W24bzM; do
            grep -Fx "yt-${id}.mp4" /tmp/assets.txt >/dev/null
          done
          gh release view tiktok-approved-assets --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/approved-assets.txt
          for n in 1 2 3; do
            grep -F "resident-evil-requiem-levou-o-premio-mais-importante-de-43929326588-short-${n}.mp4" /tmp/approved-assets.txt >/dev/null
            grep -F "resident-evil-requiem-levou-o-premio-mais-importante-de-43929326588-short-${n}.jpg" /tmp/approved-assets.txt >/dev/null
          done
          echo 'Recovered assets verified in both permanent releases.'

      - name: Summary
        run: |
          echo '### Radar TikTok Helper recovery verification' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          q=json.loads(Path('data/tiktok_queue.json').read_text())
          r=json.loads(Path('data/tiktok_backfill_report.json').read_text())
          print(f"- Queue entries: **{len(q.get('items') or [])}**")
          print(f"- Shorts still missing original MP4: **{r.get('remaining_count')}**")
          print('- Resident Evil originals restored: **3/3**')
          print('- Existing permanent recovery assets verified: **6/6**')
          PY
