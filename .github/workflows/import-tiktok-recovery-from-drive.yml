name: Radar TikTok - Verify Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-tiktok-recovery-from-drive.yml'
      - 'data/tiktok_queue.json'
      - 'data/tiktok_backfill_report.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovery report and TikTok queue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ids = [
              'DFMjasmIOSw',
              't-KVaCwbrbA',
              'dvu_iLOeRds',
              'hjCBW6wopN8',
              'Lc3BXMSZanU',
              'S-Kw8W24bzM',
          ]

          report = json.loads(Path('data/tiktok_backfill_report.json').read_text())
          assert report.get('total_discovered') == 28, report
          assert report.get('recovered_count') == 28, report
          assert report.get('ready_for_tiktok') == 28, report
          assert report.get('remaining_count') == 0, report
          assert report.get('remaining') == [], report

          queue = json.loads(Path('data/tiktok_queue.json').read_text())
          items = queue.get('items', [])
          by_id = {item.get('youtube_id'): item for item in items if item.get('youtube_id')}

          ready = [
              item for item in items
              if item.get('youtube_id')
              and item.get('media_url')
              and item.get('status') in ('approved', 'ready_for_tiktok')
          ]
          assert len(ready) >= 28, f'only {len(ready)} ready items'

          for video_id in ids:
              item = by_id.get(video_id)
              assert item, f'missing queue item {video_id}'
              assert item.get('status') in ('approved', 'ready_for_tiktok'), item
              expected = f'https://github.com/Luizfcalori/radar-dos-games/releases/download/tiktok-youtube-shorts/yt-{video_id}.mp4'
              assert item.get('media_url') == expected, item
              text = item.get('post_text', '')
              assert text.strip(), f'missing post_text {video_id}'
              assert '#RadarDosGames' in text and '#TikTokGames' in text, f'missing hashtags {video_id}'

          print('TikTok Helper queue verified: 28/28 ready; six recovered items have MP4 URLs, captions and hashtags.')
          PY

      - name: Verify six permanent GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view tiktok-youtube-shorts --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/assets.txt
          for id in DFMjasmIOSw t-KVaCwbrbA dvu_iLOeRds hjCBW6wopN8 Lc3BXMSZanU S-Kw8W24bzM; do
            grep -Fx "yt-${id}.mp4" /tmp/assets.txt >/dev/null
          done
          echo 'All six recovered MP4 assets exist in the permanent GitHub Release.'

      - name: Summary
        run: |
          echo '### Radar TikTok Helper recovery verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Queue: **28/28 ready**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Remaining: **0**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Recovered MP4 assets checked: **6/6**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Captions/hashtags checked for recovered items: **6/6**' >> "$GITHUB_STEP_SUMMARY"
