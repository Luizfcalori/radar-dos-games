name: Patch YouTube Fallback Retries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-youtube-fallback-retries.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Harden production fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          p=Path('src/media.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import html,json,re,subprocess,sys,time,urllib.error,urllib.parse,urllib.request','import html,json,os,re,subprocess,sys,time,urllib.error,urllib.parse,urllib.request')
          new_newisty=base64.b64decode('').decode()
          new_ytdlp=base64.b64decode('').decode()
          s,n1=re.subn(r"def newisty_download\(url,dest,quality='720p'\):.*?(?=\ndef ytdlp\()",new_newisty+'\n',s,flags=re.S)
          s,n2=re.subn(r"def ytdlp\(url,dest\):.*?(?=\ndef discover\()",new_ytdlp+'\n',s,flags=re.S)
          if n1!=1 or n2!=1: raise SystemExit(f'patch mismatch newisty={n1} ytdlp={n2}')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile src/media.py
          grep -n "external fallback selected\|newisty 429" src/media.py
      - name: Commit production patch
        run: |
          git config user.name "Radar dos Games Bot"
          git config user.email "55815124+Luizfcalori@users.noreply.github.com"
          rm .github/workflows/patch-youtube-fallback-retries.yml
          git add src/media.py .github/workflows/patch-youtube-fallback-retries.yml
          git commit -m "fix: make YouTube fallback resilient to rate limits"
          git push origin HEAD:main
