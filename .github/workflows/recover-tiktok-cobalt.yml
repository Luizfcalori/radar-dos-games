name: Radar TikTok - Recover Missing Shorts via Cobalt

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-tiktok-cobalt.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tools
        run: |
          python -m pip install --upgrade pip requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p recovered

      - name: Start private Cobalt + YouTube session helper
        shell: bash
        run: |
          set -euxo pipefail
          docker network create cobalt-recovery || true
          docker pull ghcr.io/imputnet/yt-session-generator:webserver
          docker pull ghcr.io/imputnet/cobalt:11
          docker run -d --name yt-session-generator \
            --network cobalt-recovery \
            --restart no \
            ghcr.io/imputnet/yt-session-generator:webserver
          docker run -d --name cobalt \
            --network cobalt-recovery \
            -p 9000:9000 \
            -e API_URL='http://127.0.0.1:9000/' \
            -e YOUTUBE_SESSION_SERVER='http://yt-session-generator:8080/' \
            --restart no \
            ghcr.io/imputnet/cobalt:11
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/ >/tmp/cobalt-info.json; then
              cat /tmp/cobalt-info.json
              exit 0
            fi
            sleep 2
          done
          docker logs cobalt || true
          docker logs yt-session-generator || true
          exit 1

      - name: Recover exact published Shorts
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          import requests

          base='http://127.0.0.1:9000/'
          targets=[
            ('hjCBW6wopN8','THE SIFT VAI CHEGAR AO MINECRAFT NORMAL! JAVA + BEDROCK'),
            ('S-Kw8W24bzM','O QUE É THE SIFT? A NOVA DIMENSÃO DO MINECRAFT'),
            ('Lc3BXMSZanU','MINECRAFT TEM UMA NOVA DIMENSÃO! 😱 THE SIFT'),
            ('dvu_iLOeRds','Vice City é só o COMEÇO em GTA 6! Conheça Leonida'),
            ('t-KVaCwbrbA','Jason e Lucia: o que a Rockstar JÁ CONFIRMOU em GTA 6'),
            ('DFMjasmIOSw','GTA 6 já tem DATA e PLATAFORMAS confirmadas! 👀'),
          ]
          out=Path('recovered'); out.mkdir(exist_ok=True)
          session=requests.Session()
          session.headers.update({'Accept':'application/json','Content-Type':'application/json','User-Agent':'RadarDosGames-Recovery/1.0'})
          report={}

          def fetch(url, path):
            with requests.get(url,stream=True,timeout=180,allow_redirects=True) as r:
              r.raise_for_status()
              with open(path,'wb') as f:
                for chunk in r.iter_content(1024*1024):
                  if chunk: f.write(chunk)

          def process_local(obj, final):
            tunnels=obj.get('tunnel') or []
            if not tunnels: raise RuntimeError('local-processing sem tunnel')
            temps=[]
            for n,u in enumerate(tunnels):
              p=out/f'tmp-{final.stem}-{n}'
              fetch(u,p)
              temps.append(p)
            typ=obj.get('type')
            if typ=='merge' and len(temps)>=2:
              cmd=['ffmpeg','-y','-loglevel','error','-i',str(temps[0]),'-i',str(temps[1]),'-c:v','copy','-c:a','aac','-movflags','+faststart',str(final)]
            else:
              cmd=['ffmpeg','-y','-loglevel','error','-i',str(temps[0]),'-c','copy','-movflags','+faststart',str(final)]
            subprocess.run(cmd,check=True)
            for p in temps: p.unlink(missing_ok=True)

          for vid,title in targets:
            final=out/f'yt-{vid}.mp4'
            if final.exists() and final.stat().st_size>100_000:
              report[vid]={'ok':True,'source':'existing'}
              continue
            last=None
            for quality in ('1080','720','480'):
              try:
                payload={
                  'url':f'https://www.youtube.com/shorts/{vid}',
                  'downloadMode':'auto',
                  'videoQuality':quality,
                  'youtubeVideoCodec':'h264',
                  'youtubeVideoContainer':'mp4',
                  'filenameStyle':'basic',
                  'disableMetadata':False,
                  'localProcessing':'disabled'
                }
                r=session.post(base,json=payload,timeout=90)
                data=r.json()
                print(vid,quality,json.dumps(data,ensure_ascii=False)[:1200])
                status=data.get('status')
                if status in ('tunnel','redirect') and data.get('url'):
                  fetch(data['url'],final)
                elif status=='local-processing':
                  process_local(data,final)
                elif status=='picker':
                  videos=[x for x in data.get('picker',[]) if x.get('type')=='video' and x.get('url')]
                  if not videos: raise RuntimeError('picker sem video')
                  fetch(videos[0]['url'],final)
                else:
                  raise RuntimeError(json.dumps(data,ensure_ascii=False))
                if final.exists() and final.stat().st_size>100_000:
                  probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(final)],capture_output=True,text=True)
                  dur=float(probe.stdout.strip() or 0)
                  if dur>=3:
                    report[vid]={'ok':True,'quality':quality,'size':final.stat().st_size,'duration':dur}
                    break
                raise RuntimeError('arquivo inválido')
              except Exception as e:
                last=str(e)
                final.unlink(missing_ok=True)
                time.sleep(2)
            if vid not in report:
              report[vid]={'ok':False,'error':last}
          Path('recovered/cobalt-recovery.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Show Cobalt logs on partial failure
        if: always()
        run: |
          echo '=== cobalt logs ==='
          docker logs --tail 200 cobalt || true
          echo '=== yt-session-generator logs ==='
          docker logs --tail 200 yt-session-generator || true

      - name: Validate and upload recovered files to release
        shell: bash
        run: |
          gh release view tiktok-youtube-shorts >/dev/null 2>&1 || gh release create tiktok-youtube-shorts --title "TikTok Helper - YouTube Shorts Originals" --notes "Original Shorts recovered for Radar TikTok Helper"
          shopt -s nullglob
          count=0
          for f in recovered/yt-*.mp4; do
            [ -s "$f" ] || continue
            ffprobe -v error "$f" >/dev/null
            gh release upload tiktok-youtube-shorts "$f" --clobber
            count=$((count+1))
          done
          echo "uploaded=$count" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge recovered files into TikTok queue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          repo='Luizfcalori/radar-dos-games'
          targets=[
            ('hjCBW6wopN8','THE SIFT VAI CHEGAR AO MINECRAFT NORMAL! JAVA + BEDROCK'),
            ('S-Kw8W24bzM','O QUE É THE SIFT? A NOVA DIMENSÃO DO MINECRAFT'),
            ('Lc3BXMSZanU','MINECRAFT TEM UMA NOVA DIMENSÃO! 😱 THE SIFT'),
            ('dvu_iLOeRds','Vice City é só o COMEÇO em GTA 6! Conheça Leonida'),
            ('t-KVaCwbrbA','Jason e Lucia: o que a Rockstar JÁ CONFIRMOU em GTA 6'),
            ('DFMjasmIOSw','GTA 6 já tem DATA e PLATAFORMAS confirmadas! 👀'),
          ]
          qpath=Path('data/tiktok_queue.json'); q=json.loads(qpath.read_text())
          arr=q.setdefault('items',[]); byyt={x.get('youtube_id'):x for x in arr if x.get('youtube_id')}
          now=datetime.now(timezone.utc).isoformat()
          def tags(title):
            t=title.upper()
            lead=['#Minecraft','#TheSift'] if ('MINECRAFT' in t or 'SIFT' in t) else ['#GTA6','#RockstarGames']
            return ' '.join(lead+['#RadarDosGames','#Games','#Gaming','#TikTokGames'])
          changed=[]
          for vid,title in targets:
            f=Path(f'recovered/yt-{vid}.mp4')
            if not f.exists() or f.stat().st_size<100_000: continue
            obj=byyt.get(vid)
            if obj is None:
              obj={'id':f'yt-{vid}'}; arr.append(obj); byyt[vid]=obj
            obj.update({
              'title':title,
              'media_url':f'https://github.com/{repo}/releases/download/tiktok-youtube-shorts/yt-{vid}.mp4',
              'thumbnail_url':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg',
              'post_text':f'{title}\n\n🎮 Curtiu? Siga o Radar dos Games para mais.\n\n{tags(title)}',
              'status':'approved',
              'youtube_id':vid,
              'youtube_url':f'https://www.youtube.com/shorts/{vid}',
              'source':'youtube_channel_recovered_original_cobalt',
              'recovered_at':now,
            })
            changed.append(vid)
          q['updated_at']=now
          qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n')

          index_path=Path('data/youtube_shorts_index.json')
          if index_path.exists():
            idx=json.loads(index_path.read_text())
            for x in idx.get('items',[]):
              if x.get('youtube_id') in changed: x['status']='approved'
            idx['waiting_media']=[x for x in idx.get('waiting_media',[]) if x.get('youtube_id') not in changed]
            idx['ready_for_tiktok']=sum(1 for x in idx.get('items',[]) if x.get('status')=='approved')
            idx['updated_at']=now
            index_path.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')

          ready=sum(1 for x in arr if x.get('youtube_id') and x.get('media_url') and x.get('status') in ('approved','ready_for_tiktok'))
          missing=[]
          for vid,title in targets:
            x=byyt.get(vid)
            if not x or not x.get('media_url'):
              missing.append({'youtube_id':vid,'title':title,'reason':'original_media_not_recovered_yet'})
          report={'recovered_count':ready,'ready_for_tiktok':ready,'total_discovered':28,'remaining_count':len(missing),'remaining':missing,'last_recovery_at':now,'recovered_this_run':changed}
          Path('data/tiktok_backfill_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit queue/index/report
        shell: bash
        run: |
          git config user.name "radar-tiktok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tiktok_queue.json data/tiktok_backfill_report.json data/youtube_shorts_index.json
          if git diff --cached --quiet; then
            echo 'No queue changes to commit'
          else
            git commit -m 'bot: recover missing Shorts with self-hosted Cobalt'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Final summary
        if: always()
        run: |
          echo '### Recovery details' >> "$GITHUB_STEP_SUMMARY"
          cat recovered/cobalt-recovery.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat data/tiktok_backfill_report.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
