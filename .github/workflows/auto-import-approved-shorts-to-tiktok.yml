name: Radar TikTok - Auto Import Approved Production Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-import-approved-shorts-to-tiktok.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: radar-tiktok-auto-import-approved
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find recent approved production artifacts not yet in the app
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip jq
          mkdir -p candidates imported-assets

          python - <<'PY'
          import json, os, subprocess, urllib.request, zipfile
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          qpath=Path('data/tiktok_queue.json')
          queue=json.loads(qpath.read_text(encoding='utf-8')) if qpath.exists() else {'version':2,'items':[]}
          imported_runs={str(x.get('source_run_id')) for x in queue.get('items',[]) if x.get('source_run_id')}

          def api(path):
              req=urllib.request.Request('https://api.github.com'+path,headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'RadarTikTokAutoImport/1.0',
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          runs=api(f'/repos/{repo}/actions/runs?status=success&per_page=30').get('workflow_runs',[])
          cutoff=datetime.now(timezone.utc)-timedelta(hours=24)
          selected=[]

          for run in runs:
              rid=str(run.get('id') or '')
              if not rid or rid in imported_runs:
                  continue
              created=run.get('created_at') or ''
              try:
                  if datetime.fromisoformat(created.replace('Z','+00:00')) < cutoff:
                      continue
              except Exception:
                  pass

              artifacts=api(f'/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
              for art in artifacts:
                  if art.get('expired'):
                      continue
                  name=str(art.get('name') or '')
                  # Ignore obvious non-production artifacts before downloading.
                  low=name.lower()
                  if any(x in low for x in ('youtube-upload-results','thumbnail-test','tiktok-helper','login-proof','debug')):
                      continue
                  aid=art.get('id')
                  if not aid:
                      continue

                  zpath=Path('candidates')/f'{rid}-{aid}.zip'
                  cmd=['gh','api',f'/repos/{repo}/actions/artifacts/{aid}/zip']
                  with zpath.open('wb') as out:
                      p=subprocess.run(cmd,stdout=out,stderr=subprocess.DEVNULL)
                  if p.returncode!=0 or not zpath.exists() or zpath.stat().st_size<1000:
                      zpath.unlink(missing_ok=True); continue

                  d=Path('candidates')/f'{rid}-{aid}'
                  d.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(zpath) as z: z.extractall(d)
                  except Exception:
                      continue

                  qa=list(d.rglob('final-qa.json'))
                  shorts=[next(iter(d.rglob(f'short_{n}.mp4')),None) for n in (1,2,3)]
                  metas=[next(iter(d.rglob(f'short-{n}-youtube.json')),None) for n in (1,2,3)]
                  if not qa or not all(shorts) or not all(metas):
                      continue
                  try:
                      q=json.loads(qa[0].read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if str(q.get('status') or '').upper()!='APPROVED':
                      continue

                  selected.append({
                      'run_id':rid,'artifact_id':str(aid),'artifact_name':name,
                      'dir':str(d),'shorts':[str(x) for x in shorts],
                      'metas':[str(x) for x in metas],
                  })
                  break

          Path('/tmp/radar-tiktok-auto-import.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'approved_packages_found':len(selected),'runs':[x['run_id'] for x in selected]},ensure_ascii=False))
          PY

      - name: Publish MP4s, previews and merge them into the TikTok Helper queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, shutil, subprocess, unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          selected=json.loads(Path('/tmp/radar-tiktok-auto-import.json').read_text(encoding='utf-8'))
          qpath=Path('data/tiktok_queue.json')
          queue=json.loads(qpath.read_text(encoding='utf-8')) if qpath.exists() else {'version':2,'items':[]}
          old=queue.get('items') or []
          now=datetime.now(timezone.utc).isoformat()
          new=[]

          def slugify(v):
              v=unicodedata.normalize('NFKD',str(v)).encode('ascii','ignore').decode().lower()
              v=re.sub(r'[^a-z0-9]+','-',v).strip('-')
              return v[:55] or 'radar-games'

          def clean_title(v):
              v=re.sub(r'(?i)#shorts?\b','',str(v or ''))
              return re.sub(r'\s+',' ',v).strip(' -|') or 'Radar dos Games'

          for pkg in selected:
              rid=str(pkg['run_id'])
              first=json.loads(Path(pkg['metas'][0]).read_text(encoding='utf-8'))
              slug=slugify(first.get('title') or pkg.get('artifact_name') or rid)

              for n in (1,2,3):
                  src=Path(pkg['shorts'][n-1]); meta=Path(pkg['metas'][n-1])
                  data=json.loads(meta.read_text(encoding='utf-8'))
                  title=clean_title(data.get('title'))
                  stem=f'{slug}-{rid}-short-{n}'
                  mp4=Path('imported-assets')/(stem+'.mp4')
                  jpg=Path('imported-assets')/(stem+'.jpg')
                  shutil.copy2(src,mp4)
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss','1','-i',str(src),'-frames:v','1','-vf','scale=720:-2',str(jpg)],check=True)

                  desc=str(data.get('description') or '')
                  tags=[]
                  for t in re.findall(r'#([\wÀ-ÿ]+)',desc,flags=re.UNICODE):
                      tag='#'+re.sub(r'[^\w]','',t,flags=re.UNICODE)
                      if tag.lower() not in {'#shorts','#youtubeshorts'} and tag.lower() not in {x.lower() for x in tags}:
                          tags.append(tag)
                      if len(tags)>=4: break
                  for g in ['#RadarDosGames','#Games','#Gaming','#TikTokGames']:
                      if g.lower() not in {x.lower() for x in tags}: tags.append(g)

                  new.append({
                    'id':f'{slug}-approved-{rid}-short-{n}',
                    'title':title,
                    'media_asset':mp4.name,
                    'thumbnail_asset':jpg.name,
                    'post_text':title+'\n\n🎮 Curtiu? Siga o Radar dos Games para mais.\n\n'+' '.join(tags),
                    'status':'approved','source_run_id':int(rid),'short_number':n,
                    'approved_at':now,'source':'approved_production_artifact_auto',
                  })

          Path('/tmp/radar-tiktok-new-items.json').write_text(json.dumps(new,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'prepared':len(new)},ensure_ascii=False))
          PY

          shopt -s nullglob
          files=(imported-assets/*.mp4 imported-assets/*.jpg)
          if ((${#files[@]})); then
            TAG=tiktok-approved-assets
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'Radar dos Games - Shorts aprovados para TikTok' --notes 'Arquivos aprovados usados pelo Radar TikTok Helper.'
            gh release upload "$TAG" "${files[@]}" --clobber
          fi

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          qpath=Path('data/tiktok_queue.json')
          q=json.loads(qpath.read_text(encoding='utf-8')) if qpath.exists() else {'version':2,'items':[]}
          new=json.loads(Path('/tmp/radar-tiktok-new-items.json').read_text(encoding='utf-8'))
          base='https://github.com/Luizfcalori/radar-dos-games/releases/download/tiktok-approved-assets'
          for x in new:
              x['media_url']=f"{base}/{x.pop('media_asset')}"
              x['thumbnail_url']=f"{base}/{x.pop('thumbnail_asset')}"
          ids={x['id'] for x in new}
          old=[x for x in (q.get('items') or []) if x.get('id') not in ids]
          if new:
              q['version']=2
              q['updated_at']=datetime.now(timezone.utc).isoformat()
              q['items']=(new+old)[:200]
              qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'added':len(new),'total':len(q.get('items') or [])},ensure_ascii=False))
          PY

      - name: Commit queue only when new approved Shorts were imported
        shell: bash
        run: |
          set -euo pipefail
          git config user.name radar-tiktok-bot
          git config user.email actions@users.noreply.github.com
          git add data/tiktok_queue.json
          if git diff --cached --quiet; then
            echo 'No new approved production Shorts to import.'
            exit 0
          fi
          git commit -m 'bot: auto-import approved production Shorts to TikTok Helper'
          git pull --rebase origin main
          git push origin main

