name: Ace Combat Master Reference V1
on:
  push:
    paths: ['.github/workflows/ace-combat-master-reference-v1.yml']
  workflow_dispatch:
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Produce new Ace Combat master from approved editorial standard
        run: |
          rm -rf output && mkdir -p output
          python src/voice.py production/2026-10-02-ace-combat-fresh/script.txt output/voice.mp3 --voice pt-BR-ThalitaMultilingualNeural
          python src/media.py production/2026-10-02-ace-combat-8/media.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/clips.json').read_text())
          # Contextual overlays tied to script sections, deliberately sparse like approved Masters.
          cards=[
            {'start':20,'end':26,'title':'ACE COMBAT 8: WINGS OF THEVE','subtitle':'O retorno aos céus'},
            {'start':70,'end':76,'title':'NOVA GERAÇÃO','subtitle':'Escala, atmosfera e velocidade'},
            {'start':116,'end':122,'title':'JOKER FLIGHT','subtitle':'Uma nova campanha'},
            {'start':177,'end':183,'title':'ESCOLHA SEU CAÇA','subtitle':'Cada missão pede uma estratégia'},
            {'start':238,'end':244,'title':'PS5 • XBOX SERIES • PC','subtitle':'Foco no hardware atual'}]
          Path('output/manifest.json').write_text(json.dumps({'clips':d['clips'],'voice':'output/voice.mp3','output':'output/master.mp4','cards':cards},ensure_ascii=False,indent=2))
          PY
          python src/render.py output/manifest.json
          ffprobe -v error -show_entries format=duration,size -of json output/master.mp4 > output/quality.json
          test -s output/master.mp4
      - name: Upload preview only
        uses: actions/upload-artifact@v4
        with:
          name: ace-combat-master-reference-v1
          path: |
            output/master.mp4
            output/quality.json
            output/manifest.json
          if-no-files-found: error
          retention-days: 7
