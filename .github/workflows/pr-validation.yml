name: Radar dos Games - Pull Request Validation

on:
  push:
    branches: ["main", "fix/dedupe-media-content-2026-10-21"]
  pull_request:
    branches: [main]
    paths:
      - "src/media.py"
      - "src/media_first.py"
      - "src/continuity.py"
      - "docs/VIDEO_STANDARD_RADAR_DOS_GAMES.md"
      - "docs/SHORTS_STANDARD.md"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pr-validation.yml"

permissions:
  contents: read

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q tests
