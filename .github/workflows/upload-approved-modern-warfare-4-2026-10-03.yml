name: Radar dos Games - Publicar Modern Warfare 4 STRICT aprovado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-approved-modern-warfare-4-2026-10-03.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar exatamente o pacote Modern Warfare 4 STRICT aprovado
        uses: actions/download-artifact@v4
        with:
          name: radar-modern-warfare-4-STRICT-2026-10-03-37142818570
          path: bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Luizfcalori/radar-dos-games
          run-id: 37142818570

      - name: Separar Master, capa e 3 Shorts aprovados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p approved/shorts
          MASTER=$(find bundle -type f -name 'master.mp4' | head -1)
          SHORT1=$(find bundle -type f -path '*/shorts/short_1.mp4' | head -1)
          SHORT2=$(find bundle -type f -path '*/shorts/short_2.mp4' | head -1)
          SHORT3=$(find bundle -type f -path '*/shorts/short_3.mp4' | head -1)
          THUMB=$(find bundle -type f -name 'thumbnail.jpg' | head -1)
          PROOF=$(find bundle -type f -name 'PROVA-STRICT.json' | head -1)
          test -n "$MASTER" && test -s "$MASTER"
          test -n "$SHORT1" && test -s "$SHORT1"
          test -n "$SHORT2" && test -s "$SHORT2"
          test -n "$SHORT3" && test -s "$SHORT3"
          test -n "$THUMB" && test -s "$THUMB"
          test -n "$PROOF" && test -s "$PROOF"
          cp "$MASTER" approved/master.mp4
          cp "$SHORT1" approved/shorts/short_1.mp4
          cp "$SHORT2" approved/shorts/short_2.mp4
          cp "$SHORT3" approved/shorts/short_3.mp4
          cp "$THUMB" approved/thumbnail.jpg
          cp "$PROOF" approved/PROVA-STRICT.json
          ls -lh approved/master.mp4 approved/thumbnail.jpg approved/shorts/*.mp4

      - name: Validar pacote aprovado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('approved/PROVA-STRICT.json').read_text(encoding='utf-8'))
          assert p['status']=='APPROVED_STRICT', p
          assert p['topic']=='Call of Duty: Modern Warfare 4', p
          assert p['voice']=='pt-BR-ThalitaMultilingualNeural', p
          assert len(p['shorts'])==3, p
          assert p['previous_artifacts_reused'] is False, p
          print('PACOTE_MODERN_WARFARE_4_APROVADO_OK')
          PY

      - name: Preparar metadados YouTube
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base={
            'privacy':'public',
            'containsSyntheticMedia':True,
            'tags':['Call of Duty','Modern Warfare 4','Call of Duty Modern Warfare 4','MW4','video games','jogos','Radar dos Games']
          }
          metas={
            'master':{
              **base,
              'title':'Call of Duty: Modern Warfare 4 — campanha, Multiplayer, DMZ e tudo que muda',
              'description':'Call of Duty: Modern Warfare 4 chega com campanha na Península Coreana, Price foragido, ruptura na Task Force 141, Multiplayer mais fluido e o retorno do DMZ. Neste Radar dos Games, reunimos o que foi mostrado oficialmente sobre campanha, modos, plataformas e lançamento.\n\nO vídeo usa materiais exatos de Modern Warfare 4 e a narração Thalita Multilingual PT-BR no padrão aprovado do canal.\n\nInscreva-se no Radar dos Games para acompanhar lançamentos, gameplays e novidades.\n\n#ModernWarfare4 #CallOfDuty #MW4 #RadarDosGames'
            },
            'short1':{
              **base,
              'title':'Modern Warfare 4 | Price está foragido e a guerra mudou #Shorts',
              'description':'Price está foragido e Modern Warfare 4 muda o equilíbrio da série. #ModernWarfare4 #CallOfDuty #Shorts'
            },
            'short2':{
              **base,
              'title':'Modern Warfare 4 | Multiplayer mais fluido e DMZ de volta #Shorts',
              'description':'Multiplayer, movimentação mais fluida e o retorno do DMZ em Modern Warfare 4. #ModernWarfare4 #MW4 #Shorts'
            },
            'short3':{
              **base,
              'title':'Modern Warfare 4 | A Task Force 141 está dividida #Shorts',
              'description':'Ghost, Gaz e Price já não seguem o mesmo caminho em Modern Warfare 4. #CallOfDuty #ModernWarfare4 #Shorts'
            }
          }
          for key,meta in metas.items():
              Path(f'approved/{key}.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Validar OAuth e canal Radar dos Games
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/check_youtube.py

      - name: Publicar Master com capa aprovada e publicar 3 Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from googleapiclient.http import MediaFileUpload
          from src.youtube import service, channel_identity, assert_radar_channel, RADAR_CHANNEL_ID, _scheduled_status

          yt=service()
          cid,channel_title=channel_identity(yt)
          assert_radar_channel(cid,channel_title)

          items=[
            ('master','approved/master.mp4','approved/master.json'),
            ('short1','approved/shorts/short_1.mp4','approved/short1.json'),
            ('short2','approved/shorts/short_2.mp4','approved/short2.json'),
            ('short3','approved/shorts/short_3.mp4','approved/short3.json'),
          ]
          results=[]

          def find_existing(title):
              r=yt.search().list(part='snippet',channelId=RADAR_CHANNEL_ID,q=title,type='video',maxResults=10).execute()
              for it in r.get('items',[]):
                  sn=it.get('snippet',{})
                  if sn.get('title','').strip().casefold()==title.strip().casefold():
                      return it['id']['videoId']
              return None

          for key,path,meta_path in items:
              meta=json.loads(Path(meta_path).read_text(encoding='utf-8'))
              existing=find_existing(meta['title'])
              if existing:
                  print(f'SKIP_EXISTING {key}: {existing}')
                  results.append({'key':key,'id':existing,'url':f'https://www.youtube.com/watch?v={existing}','existing':True})
                  continue

              body={
                'snippet':{
                  'title':meta['title'],
                  'description':meta['description'],
                  'tags':meta.get('tags',[]),
                  'categoryId':'20'
                },
                'status':_scheduled_status(meta)
              }
              req=yt.videos().insert(part='snippet,status',body=body,media_body=MediaFileUpload(path,chunksize=-1,resumable=True))
              resp=None
              while resp is None:
                  _,resp=req.next_chunk()
              vid=resp['id']
              thumb_applied=False
              if key=='master':
                  yt.thumbnails().set(videoId=vid,media_body=MediaFileUpload('approved/thumbnail.jpg',mimetype='image/jpeg',resumable=False)).execute()
                  thumb_applied=True
              print(f'PUBLICADO {key}: https://www.youtube.com/watch?v={vid}')
              results.append({'key':key,'id':vid,'url':f'https://www.youtube.com/watch?v={vid}','existing':False,'thumbnail_applied':thumb_applied})

          Path('approved/upload-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Confirmar os 4 videos no canal correto e publicos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.youtube import service, assert_radar_channel, RADAR_CHANNEL_ID
          rows=json.loads(Path('approved/upload-results.json').read_text(encoding='utf-8'))
          assert len(rows)==4, rows
          yt=service(); proof=[]
          for row in rows:
              r=yt.videos().list(part='snippet,status',id=row['id']).execute()
              assert len(r.get('items',[]))==1, row
              item=r['items'][0]; sn=item['snippet']; st=item['status']
              assert_radar_channel(sn['channelId'],sn['channelTitle'])
              assert sn['channelId']==RADAR_CHANNEL_ID
              assert st['privacyStatus']=='public', st
              proof.append({'key':row['key'],'id':row['id'],'url':row['url'],'title':sn['title'],'privacy':st['privacyStatus'],'channel':sn['channelTitle']})
          Path('approved/publicacao-confirmada.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(proof,ensure_ascii=False))
          PY

      - name: Guardar comprovantes e capa aprovada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprovante-modern-warfare-4-youtube-${{ github.run_id }}
          path: |
            approved/upload-results.json
            approved/publicacao-confirmada.json
            approved/thumbnail.jpg
            approved/PROVA-STRICT.json
            approved/*.json
          if-no-files-found: ignore
          retention-days: 7
