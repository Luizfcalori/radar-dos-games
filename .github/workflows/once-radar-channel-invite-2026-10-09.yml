name: "ONE-OFF — Convite ao Radar dos Games (revisão)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/once-radar-channel-invite-2026-10-09.yml"
      - "specials/once_radar_channel_invite_2026_10_09.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exclusive-invitation:
    if: github.repository == 'Luizfcalori/radar-dos-games'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout (preserve all regular production files)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "edge-tts>=7,<9"

      - name: Create ONLY the standalone channel invitation (no YouTube upload)
        run: python specials/once_radar_channel_invite_2026_10_09.py

      - name: Quality check exported Short and artwork
        run: |
          test -s promo-once/Radar_dos_Games_Convite_Exclusivo.mp4
          test -s promo-once/Radar_dos_Games_Convite_Capa.jpg
          test -s promo-once/production-report.json
          grep -q 'Vocês gostam de jogos?' promo-once/narration.txt
          grep -q 'gameplay' promo-once/narration.txt
          python - <<'PY'
          import json
          p=json.load(open('promo-once/production-report.json'))
          assert p['opening_language']=='pt-BR'
          assert p['pronunciation']['english_phonemes']=='/geɪmpleɪ/'
          assert p['pipeline_changes']=='NONE'
          print("QA script PT-BR and English gameplay pronunciation approved")
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 promo-once/Radar_dos_Games_Convite_Exclusivo.mp4 | tee promo-once/qa-media.txt
          grep -qx 'width=1080' promo-once/qa-media.txt
          grep -qx 'height=1920' promo-once/qa-media.txt
          grep -qx 'r_frame_rate=30/1' promo-once/qa-media.txt
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 promo-once/Radar_dos_Games_Convite_Exclusivo.mp4 | grep -q 'aac'

      - name: Store review-only video, thumbnail, transcript and QA
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-DOS-GAMES-ONE-TIME-CANAL-PROMO-REVIEW
          retention-days: 25
          path: |
            promo-once/Radar_dos_Games_Convite_Exclusivo.mp4
            promo-once/Radar_dos_Games_Convite_Capa.jpg
            promo-once/production-report.json
            promo-once/narration.txt
            promo-once/qa-media.txt

      - name: Provide public direct MP4/JPG links for review (NOT YouTube)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="radar-channel-invite-oneoff-2026-10-09"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Radar dos Games | Convite exclusivo para revisão" --prerelease --notes "Short promocional exclusivo. Revisão antes de qualquer postagem. Trilha Five Armies — Kevin MacLeod, CC BY 4.0: https://creativecommons.org/licenses/by/4.0/."
          gh release upload "$TAG" promo-once/Radar_dos_Games_Convite_Exclusivo.mp4 promo-once/Radar_dos_Games_Convite_Capa.jpg promo-once/production-report.json --clobber
