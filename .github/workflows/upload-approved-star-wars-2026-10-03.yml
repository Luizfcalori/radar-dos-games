name: Radar dos Games - Publicar Star Wars STRICT aprovado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-approved-star-wars-2026-10-03.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar exatamente o pacote Star Wars STRICT aprovado
        uses: actions/download-artifact@v4
        with:
          name: radar-star-wars-galactic-racer-STRICT-2026-10-03-37137795933
          path: bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Luizfcalori/radar-dos-games
          run-id: 37137795933

      - name: Separar somente Master e 3 Shorts aprovados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p approved/shorts
          MASTER=$(find bundle -type f -iname 'master.mp4' | head -1)
          SHORT1=$(find bundle -type f -iname 'short_1.mp4' | head -1)
          SHORT2=$(find bundle -type f -iname 'short_2.mp4' | head -1)
          SHORT3=$(find bundle -type f -iname 'short_3.mp4' | head -1)
          test -n "$MASTER" && test -s "$MASTER"
          test -n "$SHORT1" && test -s "$SHORT1"
          test -n "$SHORT2" && test -s "$SHORT2"
          test -n "$SHORT3" && test -s "$SHORT3"
          cp "$MASTER" approved/master.mp4
          cp "$SHORT1" approved/shorts/short_1.mp4
          cp "$SHORT2" approved/shorts/short_2.mp4
          cp "$SHORT3" approved/shorts/short_3.mp4
          printf 'ARQUIVOS_APROVADOS\n'
          ls -lh approved/master.mp4 approved/shorts/*.mp4

      - name: Preparar metadados YouTube
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = {
            'privacy':'public',
            'containsSyntheticMedia':True,
            'tags':['Star Wars','Star Wars Galactic Racer','Galactic Racer','video games','jogos','Radar dos Games']
          }
          metas = {
            'master': {
              **base,
              'title':'Star Wars: Galactic Racer — corrida, risco e velocidade na Orla Exterior',
              'description':'Star Wars: Galactic Racer coloca velocidade, risco e estratégia no centro de uma nova disputa na galáxia. Neste Radar dos Games, mostramos o jogo em movimento com materiais oficiais: corridas, veículos, pistas, campanha, competição, personalização e evolução.\n\nO protagonista Shade entra na Galactic League, um circuito clandestino na Orla Exterior, com landspeeders, speeder bikes e diferentes estilos de pilotagem.\n\nFonte de mídia: press kit oficial de Star Wars: Galactic Racer.\n\nInscreva-se no Radar dos Games para acompanhar lançamentos, gameplays e novidades.\n\n#StarWars #GalacticRacer #StarWarsGalacticRacer #RadarDosGames',
              'thumbnail':'approved/thumbnail.jpg'
            },
            'short1': {
              **base,
              'title':'Star Wars: Galactic Racer | A galáxia vai correr #Shorts',
              'description':'Velocidade, risco e a Galactic League no novo Star Wars: Galactic Racer. #StarWars #GalacticRacer #Shorts'
            },
            'short2': {
              **base,
              'title':'Galactic Racer | Competição e evolução em alta velocidade #Shorts',
              'description':'Veículos, evolução e competição em Star Wars: Galactic Racer. #StarWars #GalacticRacer #Shorts'
            },
            'short3': {
              **base,
              'title':'Star Wars voltou às grandes corridas? | Galactic Racer #Shorts',
              'description':'Star Wars: Galactic Racer coloca a pilotagem no centro da experiência. #StarWars #GalacticRacer #Shorts'
            }
          }
          for key, meta in metas.items():
              Path(f'approved/{key}.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Validar OAuth e canal Radar dos Games
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/check_youtube.py

      - name: Publicar Master, aplicar capa e publicar 3 Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          from googleapiclient.http import MediaFileUpload
          from src.youtube import service, channel_identity, assert_radar_channel, RADAR_CHANNEL_ID, _scheduled_status

          yt=service()
          cid,channel_title=channel_identity(yt)
          assert_radar_channel(cid,channel_title)

          items=[
            ('master','approved/master.mp4','approved/master.json'),
            ('short1','approved/shorts/short_1.mp4','approved/short1.json'),
            ('short2','approved/shorts/short_2.mp4','approved/short2.json'),
            ('short3','approved/shorts/short_3.mp4','approved/short3.json'),
          ]
          results=[]

          def find_existing(title):
              r=yt.search().list(part='snippet',channelId=RADAR_CHANNEL_ID,q=title,type='video',maxResults=10).execute()
              for it in r.get('items',[]):
                  sn=it.get('snippet',{})
                  if sn.get('title','').strip().casefold()==title.strip().casefold():
                      return it['id']['videoId']
              return None

          for key,path,meta_path in items:
              meta=json.loads(Path(meta_path).read_text(encoding='utf-8'))
              existing=find_existing(meta['title'])
              if existing:
                  print(f'SKIP_EXISTING {key}: {existing}')
                  results.append({'key':key,'id':existing,'url':f'https://www.youtube.com/watch?v={existing}','existing':True})
                  continue

              thumb=None
              if key=='master':
                  thumb=Path('approved/thumbnail.jpg')
                  subprocess.run([sys.executable,'src/thumbnail.py',path,meta['title'],str(thumb)],check=True)
                  if not thumb.exists() or thumb.stat().st_size < 20000:
                      raise RuntimeError('QUALITY_BLOCK: capa do Master não foi gerada corretamente')

              body={
                'snippet':{
                  'title':meta['title'],
                  'description':meta['description'],
                  'tags':meta.get('tags',[]),
                  'categoryId':'20'
                },
                'status':_scheduled_status(meta)
              }
              req=yt.videos().insert(part='snippet,status',body=body,media_body=MediaFileUpload(path,chunksize=-1,resumable=True))
              resp=None
              while resp is None:
                  _,resp=req.next_chunk()
              vid=resp['id']
              if thumb is not None:
                  yt.thumbnails().set(videoId=vid,media_body=MediaFileUpload(str(thumb),mimetype='image/jpeg',resumable=False)).execute()
              print(f'PUBLICADO {key}: https://www.youtube.com/watch?v={vid}')
              results.append({'key':key,'id':vid,'url':f'https://www.youtube.com/watch?v={vid}','existing':False,'thumbnail_applied':bool(thumb)})

          Path('approved/upload-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Confirmar os 4 videos no canal correto e publicos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.youtube import service, assert_radar_channel, RADAR_CHANNEL_ID
          results=json.loads(Path('approved/upload-results.json').read_text(encoding='utf-8'))
          assert len(results)==4, results
          yt=service()
          proof=[]
          for row in results:
              r=yt.videos().list(part='snippet,status',id=row['id']).execute()
              assert len(r.get('items',[]))==1, row
              item=r['items'][0]
              sn=item['snippet']; st=item['status']
              assert_radar_channel(sn['channelId'],sn['channelTitle'])
              assert sn['channelId']==RADAR_CHANNEL_ID
              assert st['privacyStatus']=='public', st
              proof.append({'key':row['key'],'id':row['id'],'url':row['url'],'title':sn['title'],'privacy':st['privacyStatus'],'channel':sn['channelTitle']})
          Path('approved/publicacao-confirmada.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(proof,ensure_ascii=False))
          PY

      - name: Guardar comprovantes e capa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprovante-star-wars-youtube-${{ github.run_id }}
          path: |
            approved/upload-results.json
            approved/publicacao-confirmada.json
            approved/thumbnail.jpg
            approved/*.json
          if-no-files-found: ignore
          retention-days: 7
