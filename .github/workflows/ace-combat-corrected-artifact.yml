name: Ace Combat Corrected Artifact
on:
  push:
    paths:
      - '.github/workflows/ace-combat-corrected-artifact.yml'
      - 'src/render.py'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rebuild Ace Combat with approved intro and cards
        run: |
          mkdir -p output
          echo 'Ace Combat v3: abertura Radar 0-6s + Thalita PT-BR + cards sincronizados + mídia oficial + CTA. Artifact only; no publication.' > output/REBUILD_REQUIREMENTS.txt
          python src/voice.py production/2026-10-02/script.txt output/voice.mp3 --voice pt-BR-ThalitaMultilingualNeural
          python src/media.py production/2026-10-02-ace-combat-8/media.json
          python - <<'PY'
          import json
          from pathlib import Path
          clips_data=json.loads(Path('output/clips.json').read_text(encoding='utf-8'))
          cards=[
            {'start':18,'end':25,'title':'ACE COMBAT 8','subtitle':'O retorno da franquia depois de 7 anos'},
            {'start':52,'end':59,'title':'UNREAL ENGINE 5','subtitle':'Nova geração de combate aéreo'},
            {'start':90,'end':97,'title':'JOKER FLIGHT','subtitle':'Esquadrão, campanha e novas missões'},
            {'start':128,'end':135,'title':'PS5 • XBOX SERIES • PC','subtitle':'Disponível nas plataformas atuais'},
            {'start':166,'end':173,'title':'MULTIPLAYER + CROSS-PLAY','subtitle':'Combate online e personalização'},
            {'start':204,'end':211,'title':'RADAR DOS GAMES','subtitle':'Like + inscrição para mais novidades'}]
          manifest={'clips':clips_data['clips'],'voice':'output/voice.mp3','output':'output/master.mp4','cards':cards}
          Path('output/manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
          python src/render.py output/manifest.json
          test -s output/master.mp4
          ffprobe -v error -show_entries format=duration,size -of json output/master.mp4 > output/quality.json
      - name: Upload corrected master only
        uses: actions/upload-artifact@v4
        with:
          name: ace-combat-8-corrected-v3-intro-cards
          path: |
            output/master.mp4
            output/REBUILD_REQUIREMENTS.txt
            output/manifest.json
            output/quality.json
          if-no-files-found: error
          retention-days: 7
