      - name: Create vertical covers for all 3 Shorts
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageEnhance,ImageFilter,ImageFont,ImageOps
          W,H=1080,1920
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          titles=[('GTA 6','GAMEPLAY E LEONIDA'),('CLIMA INSANO','FURACÕES EM GTA 6'),('19 DE NOVEMBRO','O QUE JÁ ESTÁ CONFIRMADO')]
          def font(size): return ImageFont.truetype(FONT,size)
          def fit(draw,text,width,start=86,minimum=44):
              for size in range(start,minimum-1,-2):
                  ft=font(size); b=draw.textbbox((0,0),text,font=ft,stroke_width=4)
                  if b[2]-b[0]<=width: return ft
              return font(minimum)
          out=Path('output/shorts')
          for i in range(1,4):
              video=out/f'short_{i}.mp4'
              frame=out/f'.short_{i}_cover_frame.jpg'
              subprocess.run(['ffmpeg','-y','-v','error','-ss','2.0','-i',str(video),'-frames:v','1','-q:v','2',str(frame)],check=True)
              with Image.open(frame) as src:
                  bg=ImageOps.fit(src.convert('RGB'),(W,H),method=Image.Resampling.LANCZOS)
              bg=ImageEnhance.Contrast(bg.filter(ImageFilter.GaussianBlur(5))).enhance(1.12).convert('RGBA')
              shade=Image.new('RGBA',(W,H),(0,0,0,0)); sd=ImageDraw.Draw(shade,'RGBA')
              sd.rectangle((0,0,W,H),fill=(0,0,0,68)); sd.rectangle((0,0,W,170),fill=(3,7,20,235))
              sd.rectangle((62,1170,1018,1555),fill=(0,0,0,208)); sd.rectangle((62,1170,78,1555),fill=(235,58,138,255))
              bg=Image.alpha_composite(bg,shade); d=ImageDraw.Draw(bg,'RGBA')
              d.text((48,58),'RADAR DOS GAMES',font=font(42),fill=(255,255,255,255),stroke_width=2,stroke_fill=(0,0,0,190))
              main,sub=titles[i-1]; mf=fit(d,main,820,96,56); sf=fit(d,sub,820,70,42)
              d.text((108,1240),main,font=mf,fill=(255,255,255,255),stroke_width=5,stroke_fill=(0,0,0,230))
              d.text((108,1380),sub,font=sf,fill=(255,184,62,255),stroke_width=4,stroke_fill=(0,0,0,230))
              d.text((108,1500),'GTA VI • ROCKSTAR',font=font(34),fill=(255,255,255,235),stroke_width=2,stroke_fill=(0,0,0,180))
              d.rectangle((0,H-18,W,H),fill=(235,58,138,255))
              cover=out/f'short_{i}_cover.jpg'; bg.convert('RGB').save(cover,'JPEG',quality=95,subsampling=0)
              frame.unlink(missing_ok=True)
          PY

      - name: Final QA GTA VI special
        run: |
          python - <<'PY'
          import glob,json,subprocess
          from pathlib import Path
          from PIL import Image
          def probe(p): return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          master=Path('output/master.mp4'); assert master.exists() and master.stat().st_size>5_000_000
          m=probe(master); md=float(m['format']['duration']); mv=next(x for x in m['streams'] if x['codec_type']=='video')
          assert (int(mv['width']),int(mv['height']))==(1920,1080)
          assert 300<=md<=650, md
          assert any(x['codec_type']=='audio' for x in m['streams'])
          qa=json.loads(Path('output/qa.json').read_text(encoding='utf-8'))
          assert qa['card_style']['shadow_attached_to_text'] is True
          assert qa['voice']=='pt-BR-ThalitaMultilingualNeural'
          assert qa['framing_policy']=='full_source_visible; blurred_background_fill; no_destructive_crop'
          assert len(qa['scenes'])==10
          assert all(x['all_assets_explicit'] for x in qa['scenes'])
          assert all(x['gameplay_first'] for x in qa['scenes'])
          clips=json.loads(Path('output/clips.json').read_text(encoding='utf-8'))
          assert clips.get('video_assets',0)>=1
          assert clips.get('image_assets',0)>=8
          thumb=Path('output/thumbnail.jpg'); assert thumb.exists() and thumb.stat().st_size>30000
          with Image.open(thumb) as im: assert im.size==(1280,720)
          shorts=sorted(glob.glob('output/shorts/short_*.mp4')); assert len(shorts)==3
          sm=json.loads(Path('output/shorts/manifest.json').read_text(encoding='utf-8'))
          assert len(sm.get('shorts',[]))==3
          assert all(x.get('boundary_policy')=='voice_segment_complete' for x in sm['shorts']), sm
          report=[]
          for i,p in enumerate(shorts,1):
              q=probe(p); d=float(q['format']['duration']); v=next(x for x in q['streams'] if x['codec_type']=='video')
              assert (int(v['width']),int(v['height']))==(1080,1920)
              assert 20<=d<=120, (p,d)
              assert any(x['codec_type']=='audio' for x in q['streams'])
              cover=Path(f'output/shorts/short_{i}_cover.jpg'); assert cover.exists() and cover.stat().st_size>30000
              with Image.open(cover) as im: assert im.size==(1080,1920)
              report.append({'file':p,'seconds':round(d,2),'cover':str(cover)})
          out={'master_seconds':round(md,2),'master':'1920x1080','script_words':len(Path('output/auto-script.txt').read_text(encoding='utf-8').split()),'official_video_assets':clips['video_assets'],'official_image_assets':clips['image_assets'],'shorts':report,'thumbnail':'1280x720','shorts_complete_speech':True,'status':'APPROVED'}
          Path('output/final-qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
