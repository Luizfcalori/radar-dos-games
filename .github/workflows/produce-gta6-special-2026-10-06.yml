name: Radar dos Games - GTA 6 Especial 2026-10-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/produce-gta6-special-2026-10-06.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp gdown

      - name: Validate official intro
        run: |
          test -s radar-dos-games-intro-oficial.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 radar-dos-games-intro-oficial.mp4

      - name: Build GTA 6 special script media plan and metadata
        run: |
          mkdir -p output output/shorts output/media
          cat > output/auto-script.txt <<'TXT'
          GTA 6 entrou na reta final para o lançamento, e agora finalmente existe material suficiente para olhar para o jogo de forma mais concreta, sem depender de rumor. A Rockstar confirmou o lançamento para 19 de novembro de 2026 no PlayStation 5 e Xbox Series X e S, e nas últimas semanas ampliou bastante a divulgação. O ponto mais importante foi o vídeo Grand Theft Auto VI: An Extended Look, capturado inteiramente dentro do jogo no PlayStation 5. Esse material mostra que a proposta não é simplesmente fazer um GTA 5 maior. A Rockstar está tentando transformar Vice City e o estado de Leonida em um mundo muito mais denso, reativo e detalhado. E é justamente isso que vamos destrinchar agora: história, protagonistas, mapa, clima, atividades, personalização, vida criminal e o que já está confirmado para o lançamento.

          A campanha gira em torno de Jason Duval e Lucia Caminos. A própria Rockstar resume a história dizendo que os dois sempre souberam que as probabilidades estavam contra eles, mas que um serviço aparentemente simples dá errado e coloca o casal no centro de uma conspiração criminal que atravessa Leonida. Esse detalhe é importante porque muda o foco em relação a GTA 5. Em vez de três protagonistas vivendo histórias relativamente separadas, tudo indica que o coração de GTA 6 será a relação entre Jason e Lucia, com os dois dependendo um do outro para sobreviver. O material oficial também mostra que eles não vivem isolados. Personagens como Cal Hampton, Boobie Ike, Dre'Quan Priest, Real Dimez, Raul Bautista e Brian Heder ajudam a construir a rede de contatos, negócios, golpes e conflitos ao redor da dupla.

          O mapa também vai muito além de uma única cidade. Vice City volta como o grande centro urbano, mas ela faz parte do estado de Leonida, claramente inspirado na Flórida. A Rockstar já apresentou regiões como Leonida Keys, Port Gellhorn, Ambrosia, Grassrivers e Mount Kalaga National Park. Isso abre espaço para praias, ilhas, áreas industriais, pântanos, estradas rurais, cidades menores e regiões naturais dentro do mesmo mundo aberto. O mais interessante é que a sensação de escala não vem apenas do tamanho do mapa. Executivos e desenvolvedores da Rockstar têm destacado densidade e nível de detalhe como prioridades. A ideia parece ser que cada região tenha identidade própria, população própria e atividades que façam sentido naquele lugar, em vez de servir apenas como cenário entre uma missão e outra.

          O gameplay também está apontando para um GTA com muito mais coisas para fazer fora das missões principais. Informações recentes mostraram atividades como corridas de rua, luta livre, minigolfe e outras distrações espalhadas pelo mapa. A Rockstar também confirmou garagens pessoais em Leonida, com espaço seguro para veículos, armazenamento de itens roubados e armários de armas para organizar o equipamento. Isso parece pequeno no papel, mas muda a rotina do jogador. Em vez de toda preparação acontecer em um único esconderijo, diferentes pontos do mapa podem funcionar como bases de apoio. Também foi confirmado que objetos roubados podem ser vendidos para receptadores, criando um ciclo de crime mais direto: roubar, escapar da polícia, esconder mercadoria quente e depois transformar aquilo em dinheiro.

          Outro ponto forte é a personalização. O material oficial e as informações de pré-venda mostram carros, roupas, penteados, tatuagens, lojas, oficinas e variações de armas. A Rockstar também apresenta locais como Rideout Customs Mod Shop, Sara's Unisex Salon, Stock 305 Clothing Store, Electric Fang Tattoo Parlor e One-Eyed Willie's Mod Shop. Isso sugere que a customização não vai ficar concentrada apenas em menus. Ela deve fazer parte do próprio mundo. E para quem gosta de carros, há sinais de uma atenção enorme ao sistema automotivo: veículos clássicos, motos, barcos, personalização e oficinas aparecem repetidamente no material divulgado. Se a física e a condução acompanharem esse nível de variedade, dirigir pode voltar a ser uma das partes mais divertidas da experiência.

          E quando a gente fala em detalhe, um dos sistemas que mais chama atenção é o clima. Em entrevistas recentes sobre o desenvolvimento, a Rockstar explicou que o sistema foi refeito para GTA 6 e não é simplesmente uma versão reciclada do que existia em Red Dead Redemption 2. Leonida pode ter calor pesado, chuva, grandes formações de nuvens, vento forte e até furacões. A água reage, o cabelo dos personagens pode responder ao vento e poças se formam depois da chuva. A equipe também falou em arco-íris depois das tempestades. Parece um detalhe visual, mas em um jogo de mundo aberto isso muda a sensação de presença. Dirigir por Vice City à noite sob chuva forte, atravessar uma área costeira durante vento intenso ou sair de uma tempestade para um céu aberto pode fazer o mundo parecer menos estático e mais imprevisível.

          A vida criminal também parece mais integrada ao mundo. O enredo começa com um golpe que dá errado, mas a estrutura mostrada até agora aponta para assaltos, chantagens, tráfico, receptação e negócios espalhados por Leonida. Brian Heder, por exemplo, é apresentado como um antigo traficante que ainda movimenta produto pelo estaleiro e deixa Jason morar de graça em uma de suas propriedades em troca de serviços locais. Boobie Ike transformou a vida nas ruas em um império que passa por imóveis, clube e estúdio de gravação. Já Raul Bautista aparece ligado a trabalhos maiores. Isso dá a impressão de que a progressão de Jason e Lucia não será apenas subir uma lista de missões, mas entrar cada vez mais fundo em uma rede criminosa que conecta pessoas, lugares e oportunidades.

          Visualmente, GTA 6 também está tentando aumentar o número de coisas acontecendo ao mesmo tempo. O material mostrado pela Rockstar tem praias cheias, trânsito intenso, festas, barcos, aviões, helicópteros, animais, multidões, redes sociais dentro do universo do jogo e NPCs reagindo ao ambiente. O objetivo declarado da equipe é combinar escala com detalhe, e esse é provavelmente o maior desafio técnico do projeto. Não adianta ter um mapa gigantesco se ele parece vazio. O que torna GTA memorável é encontrar situações inesperadas simplesmente dirigindo ou andando pela cidade. Se o jogo conseguir manter essa densidade sem sacrificar desempenho, Vice City pode ser um dos mundos abertos mais convincentes já feitos pela Rockstar.

          Juntando tudo, GTA 6 parece estar sendo construído menos como uma sequência tradicional e mais como uma tentativa de elevar vários sistemas ao mesmo tempo: mundo aberto, clima, personagens, atividades, customização, veículos, crime, densidade de NPCs e narrativa em dupla. Ainda existem perguntas importantes, principalmente sobre desempenho, inteligência artificial, física, estrutura das missões e como será a experiência online, mas o que já foi mostrado oficialmente é muito mais concreto do que há um ano. A grande diferença agora é que já conseguimos enxergar como essas peças conversam entre si: Jason e Lucia no centro da história, um estado enorme ao redor deles e sistemas que tentam fazer Leonida reagir às escolhas do jogador.

          Agora, sobre lançamento: GTA 6 chega em 19 de novembro de 2026 para PlayStation 5 e Xbox Series X e S. A Rockstar ainda não anunciou uma versão de PC para o lançamento. As reservas já estão abertas e a empresa confirmou bônus de pré-venda e diferentes edições, além do pacote Vintage Vice City. Também existe um álbum oficial de Grand Theft Auto VI anunciado para o mesmo dia do jogo, com 34 faixas originais, reforçando como música continua sendo parte central da identidade de Vice City. Aqui no Radar dos Games vamos continuar acompanhando tudo. Se você quer mais GTA 6, comenta qual ponto mais te chamou atenção: o mundo de Leonida, Jason e Lucia, o clima, os carros ou as atividades. E se inscreve no canal porque quando surgir novidade realmente importante, ela entra direto no radar.
          TXT

