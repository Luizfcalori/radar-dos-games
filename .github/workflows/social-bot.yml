name: Radar Social Bot

on:
  workflow_dispatch:
    inputs:
      networks:
        description: "Redes separadas por vírgula"
        required: true
        default: "youtube"
        type: string
      auto_reply:
        description: "Enviar respostas seguras de verdade"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
      - feature/radar-social-bot-v1-ready
    paths:
      - "social_bot/**"
      - "tests/test_social_bot.py"
      - ".github/workflows/social-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar motor de respostas
        run: python -m unittest tests.test_social_bot -v

  bot:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Rodar Radar Social Bot
        env:
          SOCIAL_BOT_NETWORKS: ${{ github.event_name == 'workflow_dispatch' && inputs.networks || 'youtube' }}
          SOCIAL_BOT_AUTO_REPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_reply || false }}
          SOCIAL_BOT_MAX_REPLIES: "5"
          SOCIAL_BOT_FETCH_LIMIT: "30"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_SOCIAL_REFRESH_TOKEN: ${{ secrets.YT_SOCIAL_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python -m social_bot.bot
      - name: Salvar relatório
        uses: actions/upload-artifact@v4
        with:
          name: radar-social-bot-report
          path: social_bot/out/
          retention-days: 7
