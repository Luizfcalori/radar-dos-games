name: Cancel stale Street Fighter production run

on:
  push:
    paths:
      - ".github/workflows/cancel-stale-street-fighter-run.yml"

permissions:
  actions: write

jobs:
  cancel-stale-run:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel the earlier attempt that lacks the corrected approval mapping
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 41054222196;
            const { owner, repo } = context.repo;
            await github.rest.actions.forceCancelWorkflowRun({ owner, repo, run_id: runId });
            core.info(`Force-cancelled stale production run ${runId} to prevent duplicate uploads.`);
