name: Ace Combat Fresh Standard Test
on:
  push:
    paths: ['.github/workflows/ace-combat-fresh-test.yml']
  workflow_dispatch:
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Produce entirely new master
        run: |
          rm -rf output && mkdir -p output
          python src/voice.py production/2026-10-02-ace-combat-fresh/script.txt output/voice.mp3 --voice pt-BR-ThalitaMultilingualNeural
          python src/media.py production/2026-10-02-ace-combat-8/media.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/clips.json').read_text())
          cards=[
           {'start':22,'end':29,'title':'7 ANOS DEPOIS','subtitle':'Ace Combat está de volta'},
           {'start':58,'end':65,'title':'NOVA GERAÇÃO','subtitle':'Atmosfera, escala e velocidade'},
           {'start':98,'end':105,'title':'JOKER FLIGHT','subtitle':'Uma nova campanha começa'},
           {'start':140,'end':147,'title':'ESCOLHA SEU CAÇA','subtitle':'Agilidade, alcance ou ataque terrestre'},
           {'start':182,'end':189,'title':'MULTIPLAYER','subtitle':'Combates para prolongar a experiência'},
           {'start':220,'end':227,'title':'PS5 • XBOX SERIES • PC','subtitle':'Foco no hardware atual'},
           {'start':260,'end':267,'title':'RADAR DOS GAMES','subtitle':'Notícias • Lançamentos • Gameplays'}]
          Path('output/manifest.json').write_text(json.dumps({'clips':d['clips'],'voice':'output/voice.mp3','output':'output/master.mp4','cards':cards},ensure_ascii=False,indent=2))
          PY
          python src/render.py output/manifest.json
          ffprobe -v error -show_entries format=duration,size -of json output/master.mp4 > output/quality.json
          test -s output/master.mp4
      - name: Package preview only
        uses: actions/upload-artifact@v4
        with:
          name: ace-combat-fresh-standard-preview
          path: |
            output/master.mp4
            output/quality.json
            output/manifest.json
          if-no-files-found: error
          retention-days: 7
