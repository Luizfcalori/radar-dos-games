name: Radar dos Games - Discover Elta Official Media

on:
  push:
    branches: [main]
    paths:
      - ".proof/discover-elta-media.txt"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PlayStation direct-video context
        run: |
          python - <<'PY'
          import html,re,urllib.request
          page='https://blog.playstation.com/2026/10/01/martial-arts-meet-fluid-platforming-in-elta-defy-all-gods-with-a-free-ps5-demo-out-today/'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          raw=html.unescape(raw).replace('\\/','/')
          urls=[]
          for pattern in [r'https?://[^"\'<>\\ ]+?\.mp4(?:\?[^"\'<>\\ ]*)?', r'https?://stream\.mux\.com/[^"\'<>\\ ]+']:
              urls.extend(re.findall(pattern,raw,re.I))
          seen=[]
          for u in urls:
              u=u.rstrip('),]}')
              if u in seen: continue
              seen.append(u)
              pos=raw.find(u)
              context=re.sub(r'\s+',' ',raw[max(0,pos-800):pos+len(u)+800])
              print('\nURL',u)
              print('CONTEXT',context)
          PY
