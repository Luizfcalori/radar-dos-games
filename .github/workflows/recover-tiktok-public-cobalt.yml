name: Radar TikTok - Recover Missing Shorts via Active Cobalt Instances

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-tiktok-public-cobalt.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          python - <<'PY'
          try:
              import requests
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'requests'])
          PY
          mkdir -p recovered

      - name: Discover active Cobalt instances and recover exact IDs
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib3
          from pathlib import Path
          import requests
          requests.packages.urllib3.disable_warnings()

          targets=[
            ('4J11rX8qp-U','A Coreia Está Pegando Fogo'),
            ('wYDMp_a572w','Combate Intenso'),
            ('jFqiD7hw0hc','Missão 1: O Início'),
            ('FWfua78AQis','Provando que a comunidade gamer é unida'),
            ('4rHekP89KHY','O QUE O TRAILER DE YEAT MOSTRA?'),
            ('BQ30QQNY9kw','Radar dos Games: notícias, lançamentos e gameplays'),
            ('XA-YklCtg1k','Gears of War: E-Day é o #1 do TOP 10'),
          ]
          out=Path('recovered'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 RadarDosGamesRecovery/1.0','Accept':'application/json'})

          # Current community instances listed by cobalt.directory (updated frequently).
          # Only endpoints with valid TLS and a healthy Cobalt API response are used.
          urls=[
            'https://bergung-api.hoffnungfuerdiezukunft.net/',
            'https://cobalt-omega.wolfy.love/',
            'https://grapefruit.clxxped.lol/',
            'https://apicobalt.girlskissing.top/',
            'https://yuuri-c.meowing.de/',
            'https://nuko-c.meowing.de/',
            'https://eulogy-c.meowing.de/',
            'https://cobalt-api.lamps-dev.dev/',
            'https://api.cobalt.rpkiinval.id/',
            'https://cobalt-alpha.wolfy.love/',
            'https://melon.clxxped.lol/',
            'https://lime.clxxped.lol/',
            'https://dog.kittycat.boo/',
            'https://fox.kittycat.boo/',
            'https://cobaltapi.kittycat.boo/',
            'https://cobaltapi.squair.xyz/',
            'https://rue-cobalt.xenon.zone/',
            'https://capi.3kh0.net/',
            'https://kitty.tame.gg/',
            'https://api.qwkuns.me/',
            'https://cobaltapi.cjs.nz/',
            'https://api-cobalt.eversiege.network/',
          ]
          # preserve order, normalize
          seen=set(); instances=[]
          for u in urls:
            u=u.strip().rstrip('/')+'/'
            if u in seen: continue
            seen.add(u)
            if any(bad in u for bad in ('localhost','127.0.0.1')): continue
            instances.append(u)
          print('discovered instances:',len(instances))
          print('\n'.join(instances[:40]))

          # Keep only responsive Cobalt APIs; cap to reduce unnecessary traffic.
          healthy=[]
          for base in instances[:60]:
            try:
              r=s.get(base,timeout=8)
              if r.ok and ('cobalt' in r.text.lower() or 'services' in r.text.lower()):
                healthy.append(base)
                print('healthy',base)
                if len(healthy)>=15: break
            except: pass
          print('healthy count:',len(healthy))

          def download(url,path):
            with requests.get(url,stream=True,timeout=150,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'}) as r:
              r.raise_for_status()
              with open(path,'wb') as f:
                for c in r.iter_content(1024*1024):
                  if c: f.write(c)

          report={}
          for vid,title in targets:
            final=out/f'yt-{vid}.mp4'
            errors=[]
            for base in healthy:
              try:
                payload={
                  'url':f'https://www.youtube.com/shorts/{vid}',
                  'downloadMode':'auto',
                  'videoQuality':'720',
                  'youtubeVideoCodec':'h264',
                  'youtubeVideoContainer':'mp4',
                  'filenameStyle':'basic',
                  'disableMetadata':False
                }
                rr=requests.post(base,json=payload,timeout=45,headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
                body=rr.text[:1200]
                print('try',vid,base,rr.status_code,body)
                if not rr.ok:
                  errors.append(f'{base}:{rr.status_code}'); continue
                data=rr.json(); status=data.get('status')
                if status in ('tunnel','redirect') and data.get('url'):
                  download(data['url'],final)
                elif status=='picker':
                  picks=[x for x in data.get('picker',[]) if x.get('type')=='video' and x.get('url')]
                  if not picks: raise RuntimeError('picker without video')
                  download(picks[0]['url'],final)
                else:
                  errors.append(f'{base}:{data.get("error",{}).get("code",status)}'); continue
                if final.exists() and final.stat().st_size>100_000:
                  with final.open('rb') as media:
                    header=media.read(16)
                  if b'ftyp' in header:
                    report[vid]={'ok':True,'instance':base,'size':final.stat().st_size,'container':'mp4'}
                    break
                final.unlink(missing_ok=True)
              except Exception as e:
                final.unlink(missing_ok=True); errors.append(f'{base}:{type(e).__name__}')
              time.sleep(.5)
            if vid not in report: report[vid]={'ok':False,'errors':errors[-8:]}
          Path('recovered/public-cobalt-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload any recovered MP4s to TikTok release
        shell: bash
        run: |
          gh release view tiktok-youtube-shorts >/dev/null 2>&1 || gh release create tiktok-youtube-shorts --title 'TikTok Helper - YouTube Shorts Originals' --notes 'Original Shorts recovered for Radar TikTok Helper'
          shopt -s nullglob
          for f in recovered/yt-*.mp4; do
            python - "$f" <<'PY'
          import os,sys
          p=sys.argv[1]
          if os.path.getsize(p)<100_000 or b'ftyp' not in open(p,'rb').read(16):
              raise SystemExit('MP4 inválido: '+p)
          PY
            gh release upload tiktok-youtube-shorts "$f" --clobber
          done

      - name: Merge recovered items into queue and report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          targets=[
            ('4J11rX8qp-U','A Coreia Está Pegando Fogo'),
            ('wYDMp_a572w','Combate Intenso'),
            ('jFqiD7hw0hc','Missão 1: O Início'),
            ('FWfua78AQis','Provando que a comunidade gamer é unida'),
            ('4rHekP89KHY','O QUE O TRAILER DE YEAT MOSTRA?'),
            ('BQ30QQNY9kw','Radar dos Games: notícias, lançamentos e gameplays'),
            ('XA-YklCtg1k','Gears of War: E-Day é o #1 do TOP 10'),
          ]
          qpath=Path('data/tiktok_queue.json'); q=json.loads(qpath.read_text()); arr=q.setdefault('items',[])
          by={x.get('youtube_id'):x for x in arr if x.get('youtube_id')}; now=datetime.now(timezone.utc).isoformat(); changed=[]
          for vid,title in targets:
            f=Path(f'recovered/yt-{vid}.mp4')
            if not f.exists() or f.stat().st_size<100_000: continue
            x=by.get(vid)
            if x is None:
              x={'id':f'yt-{vid}'}; arr.append(x); by[vid]=x
            upper=title.upper()
            if 'GEARS' in upper:
              tags=['#GearsOfWar','#GearsOfWarEDay']
            elif 'FORTNITE' in upper or 'YEAT' in upper:
              tags=['#Fortnite','#Yeat']
            elif 'COREIA' in upper:
              tags=['#Games','#NotíciasGamer']
            else:
              tags=['#Gaming','#Gameplay']
            tags += ['#GameTok','#Jogos']
            tags=tags[:5]
            x.update({
              'title':title,
              'media_url':f'https://github.com/Luizfcalori/radar-dos-games/releases/download/tiktok-youtube-shorts/yt-{vid}.mp4',
              'thumbnail_url':f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg',
              'post_text':title+'\n\n🎮 Curtiu? Siga o Radar dos Games para mais.\n\n'+' '.join(tags),
              'status':'approved','youtube_id':vid,'youtube_url':f'https://www.youtube.com/shorts/{vid}',
              'source':'youtube_channel_recovered_public_cobalt','recovered_at':now})
            changed.append(vid)
          q['updated_at']=now; qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n')
          missing=[]
          for vid,title in targets:
            x=by.get(vid)
            if not x or not x.get('media_url'): missing.append({'youtube_id':vid,'title':title,'reason':'original_media_not_recovered_yet'})
          ready=sum(1 for x in arr if x.get('youtube_id') and x.get('media_url') and x.get('status') in ('approved','ready_for_tiktok'))
          report={'recovered_count':ready,'ready_for_tiktok':ready,'total_discovered':int(json.loads(Path('data/youtube_shorts_index.json').read_text()).get('total_discovered',0)),'remaining_count':len(missing),'remaining':missing,'last_recovery_at':now,'recovered_this_run':changed}
          Path('data/tiktok_backfill_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit recovered originals without overwriting concurrent queue changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          targets=[
            ('4J11rX8qp-U','A Coreia Está Pegando Fogo'),
            ('wYDMp_a572w','Combate Intenso'),
            ('jFqiD7hw0hc','Missão 1: O Início'),
            ('FWfua78AQis','Provando que a comunidade gamer é unida'),
            ('4rHekP89KHY','O QUE O TRAILER DE YEAT MOSTRA?'),
            ('BQ30QQNY9kw','Radar dos Games: notícias, lançamentos e gameplays'),
            ('XA-YklCtg1k','Gears of War: E-Day é o #1 do TOP 10'),
          ]
          repo=os.environ['REPO']
          now=datetime.now(timezone.utc).isoformat()
          qpath=Path('data/tiktok_queue.json'); ipath=Path('data/youtube_shorts_index.json')
          q=json.loads(qpath.read_text(encoding='utf-8')); idx=json.loads(ipath.read_text(encoding='utf-8'))
          arr=q.setdefault('items',[]); by={str(x.get('youtube_id')):x for x in arr if x.get('youtube_id')}
          changed=[]
          for vid,title in targets:
            mp4=Path(f'recovered/yt-{vid}.mp4')
            if not mp4.exists() or mp4.stat().st_size<100_000: continue
            x=by.get(vid)
            if x is None:
              x={'id':f'yt-{vid}'}; arr.append(x); by[vid]=x
            upper=title.upper()
            if 'GEARS' in upper: tags=['#GearsOfWar','#GearsOfWarEDay','#GameTok','#Jogos']
            elif 'FORTNITE' in upper or 'YEAT' in upper: tags=['#Fortnite','#Yeat','#GameTok','#Jogos']
            elif 'COREIA' in upper: tags=['#Games','#NotíciasGamer','#GameTok','#Jogos']
            else: tags=['#Gaming','#Gameplay','#GameTok','#Jogos']
            x.update({
              'title':title,
              'media_url':f'https://github.com/{repo}/releases/download/tiktok-youtube-shorts/yt-{vid}.mp4',
              'thumbnail_url':x.get('thumbnail_url') or f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg',
              'post_text':title+'\n\n🎮 Curtiu? Siga o Radar dos Games para mais.\n\n'+' '.join(tags[:5]),
              'status':'approved','youtube_id':vid,'youtube_url':f'https://www.youtube.com/shorts/{vid}',
              'source':'youtube_channel_recovered_public_cobalt','recovered_at':now
            })
            changed.append(vid)
          changed_set=set(changed)
          for item in idx.get('items',[]):
            if str(item.get('youtube_id')) in changed_set: item['status']='approved'
          idx['waiting_media']=[x for x in idx.get('waiting_media',[]) if str(x.get('youtube_id')) not in changed_set]
          idx['ready_for_tiktok']=sum(1 for x in idx.get('items',[]) if x.get('status')=='approved')
          idx['updated_at']=now; q['updated_at']=now
          waiting=[{'youtube_id':x.get('youtube_id'),'title':x.get('title'),'reason':'original_media_not_recovered_yet'} for x in arr if x.get('source','').startswith('youtube_channel') and not x.get('media_url')]
          Path('data/tiktok_backfill_report.json').write_text(json.dumps({
            'recovered_count':idx['ready_for_tiktok'],'ready_for_tiktok':idx['ready_for_tiktok'],
            'total_discovered':idx.get('total_discovered',0),'remaining_count':len(waiting),
            'remaining':waiting,'last_recovery_at':now,'recovered_this_run':changed
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          ipath.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'recovered_this_run':changed,'remaining_count':len(waiting)},ensure_ascii=False))
          PY
          git config user.name radar-tiktok-bot
          git config user.email actions@users.noreply.github.com
          git add data/tiktok_queue.json data/youtube_shorts_index.json data/tiktok_backfill_report.json
          if git diff --cached --quiet; then
            echo 'No new original MP4s were recovered; queue left untouched.'
            exit 0
          fi
          git commit -m 'bot: merge recovered original Shorts into TikTok Helper'
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo '### Public Cobalt recovery' >> "$GITHUB_STEP_SUMMARY"
          cat recovered/public-cobalt-report.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat data/tiktok_backfill_report.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

# Public Cobalt recovery retargeted to the seven Shorts still waiting for original MP4 media.

# Use the runner's preinstalled ffmpeg; install only if it is absent to avoid slow apt refreshes.

# Public Cobalt directory TLS is validated at the instance endpoints before sending any video URLs; only its list endpoint is read without verification.

# Use MP4 container signature and size checks; no apt/ffprobe install is needed on hosted runners.

# Use live community API hostnames from cobalt.directory; the old instances.cobalt.best JSON endpoint now serves a JS challenge page.
