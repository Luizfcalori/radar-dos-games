name: Radar Games Ace Combat Zero
on:
  push:
    paths:
      - '.github/workflows/render-now-2026-10-02.yml'
      - 'src/media.py'
      - 'src/render.py'
      - 'src/voice.py'
      - 'production/2026-10-02-ace-combat-zero/**'
      - 'production/reference-masters/radar-intro-official.mp4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          pip install -U yt-dlp
      - name: Guard Zero inputs and PT-BR voice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          wf=Path('.github/workflows/render-now-2026-10-02.yml').read_text()
          spec=json.loads(Path('production/2026-10-02-ace-combat-zero/media-plan.json').read_text())
          assert 'pt-BR-ThalitaNeural' in wf, 'THALITA PT-BR VOICE COMMAND MISSING'
          assert '--segments-json output/voice-timings.json' in wf, 'SEMANTIC VOICE TIMINGS MISSING'
          assert len(spec.get('media',[])) >= 12, 'OFFICIAL BANDai ASSET SET INCOMPLETE'
          assert len(spec.get('scenes',[])) == 12, 'SEMANTIC SCENES INCOMPLETE'
          assert all('youtube.com' not in x['url'] and 'youtu.be' not in x['url'] for x in spec['media']), 'YOUTUBE SOURCE FORBIDDEN'
          assert all('graphassets.com' in x['url'] for x in spec['media']), 'NON-OFFICIAL DIRECT SOURCE FOUND'
          print('ZERO INPUTS + THALITA + 12 OFFICIAL ASSETS + SEMANTIC SCENES OK')
          PY
      - name: Voice Thalita PT-BR master with semantic timings
        run: python src/voice.py production/2026-10-02-ace-combat-zero/script-v1.txt output/voice.mp3 --voice pt-BR-ThalitaNeural --segments-json output/voice-timings.json
      - name: Acquire 12 official Bandai visual assets
        run: python src/media.py production/2026-10-02-ace-combat-zero/media-plan.json
      - name: Build semantic render manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          media=json.loads(Path('output/clips.json').read_text())
          spec=json.loads(Path('production/2026-10-02-ace-combat-zero/media-plan.json').read_text())
          voice=json.loads(Path('output/voice-timings.json').read_text())
          assert media.get('publishable_media') and media.get('official_assets') and not media.get('generic_fallback'), media
          assert len(media['assets']) == 12, media
          assert len(voice['segments']) == len(spec['scenes']) == 12, (len(voice['segments']),len(spec['scenes']))
          Path('output/render.json').write_text(json.dumps({
            'assets':media['assets'],
            'voice':'output/voice.mp3',
            'voice_timings':'output/voice-timings.json',
            'intro':'production/reference-masters/radar-intro-official.mp4',
            'scenes':spec['scenes'],
            'output':'output/ace-combat-zero-master.mp4',
            'storyboard':'production/2026-10-02-ace-combat-zero/storyboard.md',
            'asset_plan':'production/2026-10-02-ace-combat-zero/asset-plan.json'
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload source bundle for deterministic final assembly
        uses: actions/upload-artifact@v4
        with:
          name: ace-combat-zero-source-thalita-ptbr
          path: |
            output/media/**
            output/clips.json
            output/voice.mp3
            output/voice-timings.json
            output/render.json
            production/2026-10-02-ace-combat-zero/media-plan.json
            production/2026-10-02-ace-combat-zero/storyboard.md
          retention-days: 7
      - name: Detect approved real Radar intro
        id: intro
        shell: bash
        run: |
          if [ -s production/reference-masters/radar-intro-official.mp4 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Real approved intro is not committed; source bundle remains valid for final assembly with approved reference intro."
          fi
      - name: Render Ace Combat Zero master
        if: steps.intro.outputs.present == 'true'
        run: python src/render.py output/render.json
      - name: Quality gate
        if: steps.intro.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('output/ace-combat-zero-master.mp4')
          q=Path('output/qa.json')
          assert p.exists() and p.stat().st_size>1_000_000, p
          assert q.exists(), q
          qa=json.loads(q.read_text())
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          v=next(x for x in probe['streams'] if x['codec_type']=='video')
          a=next(x for x in probe['streams'] if x['codec_type']=='audio')
          d=float(probe['format']['duration'])
          assert d>=240, d
          assert int(v['width'])==1920 and int(v['height'])==1080, (v['width'],v['height'])
          assert v['r_frame_rate']=='30/1', v['r_frame_rate']
          assert a['codec_name']=='aac', a['codec_name']
          assert qa['intro_audio_preserved'] is True
          assert qa['semantic_timing_source']=='paragraph_boundaries'
          assert qa['legacy_ace_input'] is False
          assert len(qa['scenes'])==12
          print({'master_seconds':d,'bytes':p.stat().st_size,'video':'1920x1080@30','audio':'aac','scenes':12})
          PY
      - name: Upload final master
        if: steps.intro.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ace-combat-zero-master-final-thalita-ptbr
          path: |
            output/ace-combat-zero-master.mp4
            output/qa.json
            output/voice-timings.json
          retention-days: 7
