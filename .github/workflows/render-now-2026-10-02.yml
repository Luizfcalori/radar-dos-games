name: Radar Games Ace Combat Zero
on:
  push:
    paths:
      - '.github/workflows/render-now-2026-10-02.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          pip install -U yt-dlp
      - name: Guard against rejected Ace Combat inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/render-now-2026-10-02.yml').read_text()
          forbidden=['production/2026-10-02/script.txt','production/2026-10-02-ace-combat-8/media.json','render_reference.py']
          bad=[x for x in forbidden if x in wf]
          assert not bad, f'REJECTED OLD INPUTS: {bad}'
          assert '--voice pt-BR-ThalitaNeural' in wf, 'MASTER VOICE NOT LOCKED TO THALITA'
          print('ZERO INPUT + THALITA VOICE GUARD OK')
          PY
      - name: Voice PT-BR Thalita approved master voice
        run: python src/voice.py production/2026-10-02-ace-combat-zero/script-v1.txt output/voice.mp3 --voice pt-BR-ThalitaNeural
      - name: Acquire Zero visual assets only
        run: python src/media.py production/2026-10-02-ace-combat-zero/media-plan.json
      - name: Build Zero render manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/clips.json').read_text())
          assert data.get('publishable_media') and not data.get('generic_fallback'), data
          Path('output/render.json').write_text(json.dumps({
            'clips':data['clips'],
            'voice':'output/voice.mp3',
            'output':'output/ace-combat-zero-master.mp4',
            'storyboard':'production/2026-10-02-ace-combat-zero/storyboard.md',
            'asset_plan':'production/2026-10-02-ace-combat-zero/asset-plan.json'
          },indent=2))
          PY
      - name: Render Ace Combat Zero master
        run: python src/render.py output/render.json
      - name: Quality gate
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p=Path('output/ace-combat-zero-master.mp4')
          assert p.exists() and p.stat().st_size>250000, p
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],text=True))
          assert d>=180, d
          print({'master_seconds':d,'bytes':p.stat().st_size})
          PY
      - name: Upload Zero preview only
        uses: actions/upload-artifact@v4
        with:
          name: ace-combat-zero-preview-thalita
          path: |
            output/ace-combat-zero-master.mp4
            output/voice.mp3
            production/2026-10-02-ace-combat-zero/storyboard.md
          retention-days: 7
# ZERO trigger THALITA locked
